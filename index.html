        if(!abyssGrad){
          abyssGrad=g.createLinearGradient(EDGE_SX,0,W,0);
          abyssGrad.addColorStop(0,'rgba(10,6,20,.0)'); abyssGrad.addColorStop(0.25,'rgba(8,4,16,.92)'); abyssGrad.addColorStop(1,'#05030d');
        }
        g.fillStyle=abyssGrad; g.fillRect(EDGE_SX,150,W-EDGE_SX,H-150);
        // 危険ライン
        const blink=0.55+0.45*Math.sin(t*7);
        g.save();g.strokeStyle=`rgba(255,60,70,${blink})`;g.lineWidth=4;
        g.beginPath();g.moveTo(EDGE_SX,168);g.lineTo(EDGE_SX,H-150);g.stroke();
        g.fillStyle=`rgba(255,60,70,${blink*0.5})`;
        for(let y=176;y<H-150;y+=18){g.beginPath();g.moveTo(EDGE_SX-7,y);g.lineTo(EDGE_SX,y+5);g.lineTo(EDGE_SX,y-5);g.closePath();g.fill();}
        g.restore();
        // 車 (同ラウンドは自分/CPUとも同じ車種。色のみで区別)
        drawCar(g,cCar,COLC,LANE_C,tilt,ROUND_PLAN[round].car);
        drawCar(g,pCar,COLP,LANE_P,tilt,ROUND_PLAN[round].car);
      }
      parts.draw(g);

      // タイトル + スコア
      // #feedback4 5件目: 右上HUD(R1/3 崖xxxcm)とタイトルが近接/重なって見えるため、タイトルを少し縮小
      outlinedText(g,'🏁 チキンレース',W/2,48,21,'#ffd9a0','#3a1f1a',6);
      const pw=results.filter(r=>r.winner==='p').length, cw=results.filter(r=>r.winner==='c').length;
      if(stPhase!=='title'){
        outlinedText(g,'あなた',W/2-92,84,15,COLP.car,'#2a1020',4);
        outlinedText(g,pw+' – '+cw,W/2,86,28,'#fff','#2a1020',6);
        outlinedText(g,'CPU',W/2+92,84,15,COLC.car,'#06262a',4);
        // 条件バー: 🚗 車種(特徴) ｜ 坂
        const def=planDef(), sl=planSlope();
        outlinedText(g,'🚗 '+def.name+'('+def.trait+')  '+sl.icon+sl.name,W/2,114,13,'#ffe6cf','#2a1530',4);
        outlinedText(g,'ラウンド '+(round+1)+' / '+ROUND_PLAN.length,W/2,134,12,'#cbb8e8','#241636',3);
      }

      // ── 局面オーバーレイ ──
      if(stPhase==='title'){
        outlinedText(g,'～崖っぷちの勇気～',W/2,150,16,'#ffb38a','#3a1f1a',5);
        outlinedText(g,'🏅 ベスト '+getInt('pgp2_best_chicken',0)+'pt',W/2,178,14,'#ffd9a0','#3a1f1a',4); // #13 成績表示
        outlinedText(g,'アクセル長押しで加速、離して',W/2,300,15,'#fff','#2a1530',4);
        outlinedText(g,'崖ギリギリで止めろ！越えたら負け',W/2,324,15,'#fff','#2a1530',4);
        outlinedText(g,'むずかしさ',W/2,422,15,'#cbb8e8','#241636',4);
        for(const b of diffBtns){
          const on=b.k===diff;
          drawBtn(g,b,on?'#ff7a4d':'rgba(40,30,60,.7)',on?'#ffd9a0':'rgba(255,255,255,.25)',DIFF_LBL[b.k]);
        }
        const sb={x:W/2-120,y:540,w:240,h:64};
        g.save();g.fillStyle='#ff4d5e';rr(g,sb.x,sb.y,sb.w,sb.h,20);g.fill();g.restore();
        const bl=0.7+0.3*Math.sin(t*4);
        outlinedText(g,'▶ スタート',W/2,540+38,26,'#fff','#7a1020',7,bl);
        outlinedText(g,'タップ / Space',W/2,632,13,'#cbb8e8','#241636',3);
      }
      else if(stPhase==='count'){
        const seq=['3','2','1','GO!'], i=Math.min(cdIdx,3);
        if(i>=0){
          const sub=(cdT-i*0.62)/0.62;
          const sc=1+(1-Math.min(1,sub))*0.6;
          g.save();g.translate(W/2,360);g.scale(sc,sc);
          outlinedText(g,seq[i],0,0,seq[i]==='GO!'?64:78,seq[i]==='GO!'?'#7cff9c':'#ffd23f','#3a2a10',10);
          g.restore();
        }
      }
      else if(stPhase==='run'){
        // アクセルペダル (画面どこ押しでも加速。状態を表示)
        const on=accelOn();
        g.save();
        g.fillStyle=on?'#ff4d5e':'rgba(40,28,54,.82)';
        rr(g,PEDAL.x,PEDAL.y,PEDAL.w,PEDAL.h,PEDAL.r);g.fill();
        g.lineWidth=3;g.strokeStyle=on?'#ffd9a0':'rgba(255,120,90,.5)';
        rr(g,PEDAL.x,PEDAL.y,PEDAL.w,PEDAL.h,PEDAL.r);g.stroke();
        g.restore();
        outlinedText(g,on?'🔥 アクセル全開！':'⛽ アクセル (長押し)',W/2,PEDAL.y+50,22,'#fff',on?'#7a1020':'#3a2233',6);
        outlinedText(g,'離して崖ギリで止めろ',W/2,PEDAL.y+86,14,'#ffe6cf','#3a2233',4);
      }
      else if(stPhase==='rresult'||stPhase==='mresult'){
        g.save();g.fillStyle='rgba(10,6,22,.7)';g.fillRect(0,150,W,H-150);g.restore();
        const r=results[results.length-1];
        if(stPhase==='rresult'){
          const wtxt=r.winner==='p'?'あなたの勝ち！':r.winner==='c'?'CPUの勝ち':'引き分け';
          const wc=r.winner==='p'?COLP.car:r.winner==='c'?COLC.car:'#ffd23f';
          outlinedText(g,'ラウンド'+(round+1)+' 結果',W/2,210,18,'#cbb8e8','#241636',5);
          outlinedText(g,wtxt,W/2,256,30,wc,'#fff',8);
          const cm=v=>Math.round(v);
          outlinedText(g,'あなた: '+(r.pFell?'転落…':'崖まで '+cm(r.pGap)+'cm'),W/2,330,18,COLP.glow,'#2a1020',5);
          outlinedText(g,'CPU  : '+(r.cFell?'転落…':'崖まで '+cm(r.cGap)+'cm'),W/2,366,18,COLC.glow,'#06262a',5);
          outlinedText(g,'得点  あなた '+r.pScore+' / CPU '+r.cScore,W/2,410,15,'#fff','#241636',4);
          const nb={x:W/2-120,y:560,w:240,h:62};
          g.save();g.fillStyle='#ff4d5e';rr(g,nb.x,nb.y,nb.w,nb.h,20);g.fill();g.restore();
          outlinedText(g,round>=ROUND_PLAN.length-1?'▶ 最終結果へ':'▶ 次のラウンド',W/2,560+38,22,'#fff','#7a1020',6);
        }else{
          const mw=judgeMatch(results);
          const wtxt=mw==='p'?'🏆 あなたの勝利！':mw==='c'?'CPUの勝利…':'引き分け';
          const wc=mw==='p'?COLP.car:mw==='c'?COLC.car:'#ffd23f';
          outlinedText(g,'マッチ結果',W/2,206,20,'#cbb8e8','#241636',5);
          outlinedText(g,wtxt,W/2,252,30,wc,'#fff',8);
          let ps=0,cs=0;for(const rr2 of results){ps+=rr2.pScore;cs+=rr2.cScore;}
          outlinedText(g,'勝ち数  あなた '+pw+' – '+cw+' CPU',W/2,316,18,'#fff','#241636',5);
          outlinedText(g,'近さ得点合計  '+ps+' – '+cs,W/2,350,15,'#ffe6cf','#241636',4);
          // #13 ベスト成績 + 新記録表示
          outlinedText(g,'🏅 ベスト '+getInt('pgp2_best_chicken',0)+'pt'+(matchIsRec?'  🎉しんきろく！':''),W/2,374,14,matchIsRec?'#ffe93d':'#ffd9a0','#241636',4);
          let ry=402;
          results.forEach((rr2,i)=>{
            const s=rr2.winner==='p'?'あなた':rr2.winner==='c'?'CPU':'引分';
            outlinedText(g,'R'+(i+1)+': '+s+'  ('+(rr2.pFell?'転落':rr2.pScore+'pt')+' vs '+(rr2.cFell?'転落':rr2.cScore+'pt')+')',W/2,ry,13,'#cbb8e8','#241636',3);
            ry+=26;
          });
          const nb={x:W/2-120,y:560,w:240,h:62};
          g.save();g.fillStyle='#ff4d5e';rr(g,nb.x,nb.y,nb.w,nb.h,20);g.fill();g.restore();
          outlinedText(g,'▶ もう いちど',W/2,560+38,22,'#fff','#7a1020',6);
          outlinedText(g,'タップ / Space',W/2,636,12,'#cbb8e8','#241636',3);
        }
      }

      // 転落の赤フラッシュ
      if(flashT>0){g.save();g.globalAlpha=flashT*1.4;g.fillStyle='#ff2030';g.fillRect(0,0,W,H);g.restore();}
      g.restore();
    }

    return {
      onDown(x,y){
        held=true;                       // ポインタ押下を記録 (run中は accelOn が拾う)
        if(stPhase==='title'){
          for(const b of diffBtns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){diff=b.k;store.set('pgp2_chk_diff',b.k);A.pop();return;}
          startMatch(); A.pop(); return;
        }
        if(stPhase==='run'){ A.tone({f:150,f2:96,type:'square',dur:.05,vol:.08}); return; }
        if(stPhase==='rresult'){ nextRound(); return; }
        if(stPhase==='mresult'){ startMatch(); A.pop(); return; }
        // count 中は加速対象外 (held は run 開始まで保持され GO で発火)
      },
      onUp(){ held=false; },
      onKey(code,down){
        if(code!=='Space')return;
        if(down){
          keyHeld=true;
          if(stPhase==='title'){startMatch();A.pop();}
          else if(stPhase==='rresult'){nextRound();}
          else if(stPhase==='mresult'){startMatch();A.pop();}
          // run中は keyHeld=true を accelOn が拾って加速
        }else{ keyHeld=false; }
      },
      update,
      draw,
      hudInfo(){
        if(stPhase==='title')return 'むずかしさ: '+DIFF_LBL[diff];
        if(stPhase==='count')return 'R'+(round+1)+'/'+ROUND_PLAN.length+' よーい';
        if(stPhase==='run'){
          const cm=Math.max(0,Math.round(pCar.gap));
          return 'R'+(round+1)+'/'+ROUND_PLAN.length+' 崖'+cm+'cm';
        }
        if(stPhase==='rresult')return 'R'+(round+1)+'/'+ROUND_PLAN.length+' けっか';
        return 'マッチ終了';
      },
    };
  }
});
// 純ロジックの自動テスト公開 (?selftest で実行・core boot は不変更)
if(typeof window!=='undefined'){
  window.runChickenTests=runChickenTests;
  SELFTESTS.push(runChickenTests);
}

/* ============================================================
   起動
   ============================================================ */
boot();
</script>
