    const base = () => SUITS[qi % 3];
    // 牌描画: なぜきり道場の mjRenderTile があれば流用 (読み取りのみ)。無ければ軽量牌
    function tile(g, n, x, y, w, h, o) { // n: 1..9
      const t = base() + (n - 1);
      if (typeof mjRenderTile === 'function') { mjRenderTile(g, t, x, y, w, h, o); return; }
      o = o || {};
      rr(g, x, y, w, h, Math.max(3, w * .16));
      g.fillStyle = o.sel ? '#fff3c4' : '#fdfcf4'; g.fill();
      g.strokeStyle = o.sel ? '#e5a000' : '#b0a48e'; g.lineWidth = o.sel ? 2 : 1; g.stroke();
      const su = base() / 9;
      g.fillStyle = ['#c0392b', '#2166ac', '#1d7a3d'][su];
      g.font = `800 ${h * .42}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(n), x + w / 2, y + h * .32);
      g.font = `800 ${h * .3}px ${FONT}`;
      g.fillText(['萬', '筒', '索'][su], x + w / 2, y + h * .72);
    }
    const handTiles = () => { const out = []; const c = quiz[qi].c; for (let t = 0; t < 9; t++) for (let k = 0; k < c[t]; k++) out.push(t + 1); return out; };
    function judgeNow(timeout) {
      const waits = quiz[qi].waits;
      const picked = [...sel].sort((a, b) => a - b);
      const exact = picked.length === waits.length && picked.every((v, i) => v === waits[i]);
      const subset = picked.length > 0 && picked.every((v) => waits.includes(v)) && !exact;
      const mark = exact ? '◎' : subset ? '◯' : '✕';
      const p = exact ? 2 : subset ? 1 : 0;
      pts += p; marks.push(mark);
      times.push(QSEC - Math.max(0, tLeft));
      lastMark = mark;
      ctx.judge(exact ? 'perfect' : subset ? 'good' : 'miss', W / 2, 300,
        exact ? { sub: '完全一致！' } : subset ? { sub: 'おしい！あと' + (waits.length - picked.length) + '種' } : timeout && !picked.length ? { sub: '時間切れ…' } : undefined);
      phase = 'reveal'; revT = REVEAL;
    }
    function next() {
      qi++;
      if (qi >= QN) { finishAll(); return; }
      sel = new Set(); tLeft = QSEC; phase = 'q';
    }
    function finishAll() {
      phase = 'done';
      banner('しゅうりょう！ ' + pts + '/20点');
      A[pts >= 14 ? 'record' : pts >= 8 ? 'ok' : 'miss'](); // メソッドを切り離すと this が失われるので添字呼び
      setTimeout(() => ctx.finishGame({ banner: pts + '/20点！' }), 900);
    }
    return {
      update(dt) {
        if (phase === 'q') { tLeft -= dt; if (tLeft <= 0) { tLeft = 0; judgeNow(true); } }
        else if (phase === 'reveal') { revT -= dt; if (revT <= 0) next(); }
      },
      draw(g) {
        const grd = g.createLinearGradient(0, 0, 0, H);
        grd.addColorStop(0, '#28504f'); grd.addColorStop(1, '#1a3a38');
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        if (phase === 'done') return;
        outlinedText(g, 'もんだい ' + (qi + 1) + '/' + QN, 16, 56, 16, '#fff', '#10302e', 4, 1, 'left');
        outlinedText(g, '得点 ' + pts + '/20', W - 16, 56, 14, '#ffd77a', '#10302e', 4, 1, 'right');
        // タイマーバー (のこり5秒で赤)
        const ratio = clamp(tLeft / QSEC, 0, 1);
        rr(g, 12, 72, W - 24, 12, 6); g.fillStyle = 'rgba(0,0,0,.35)'; g.fill();
        if (ratio > 0) { rr(g, 12, 72, (W - 24) * ratio, 12, 6);
          g.fillStyle = tLeft <= 5 ? '#ef5a6f' : '#7cf29c'; g.fill(); }
        outlinedText(g, phase === 'q' ? 'この手牌の「待ち牌」をぜんぶ選ぼう！' : 'せいかいは…',
          W / 2, 116, 15, '#fff', '#10302e', 4, 1, 'center');
        // 手牌 13枚
        handTiles().forEach((n, i) => tile(g, n, HT.x0 + i * (HT.w + 3), HT.y, HT.w, HT.h));
        outlinedText(g, ['萬子', '筒子', '索子'][base() / 9] + 'の清一色', W / 2, HT.y + HT.h + 24, 12, '#bfe3d8', '#10302e', 3, 1, 'center');
        if (phase === 'q') {
          // 回答牌 1-9 (トグル)
          outlinedText(g, 'タップで選ぶ (複数OK)', W / 2, BT.y - 18, 12, '#bfe3d8', '#10302e', 3, 1, 'center');
          for (let n = 1; n <= 9; n++) {
            const x = BT.x0 + (n - 1) * (BT.w + 5);
            tile(g, n, x, BT.y + (sel.has(n) ? -8 : 0), BT.w, BT.h, { sel: sel.has(n) });
          }
          // 回答ボタン
          rr(g, ANS.x, ANS.y, ANS.w, ANS.h, 14);
          g.fillStyle = sel.size ? '#ff8fb8' : '#5a6a68'; g.fill();
          g.strokeStyle = 'rgba(0,0,0,.15)'; g.stroke();
          outlinedText(g, '✅ 回答する', ANS.x + ANS.w / 2, ANS.y + ANS.h / 2 + 1, 17, '#fff', 'rgba(0,0,0,.35)', 4, 1, 'center');
        } else if (phase === 'reveal') {
          // 正解リビール
          const waits = quiz[qi].waits;
          rr(g, 24, 420, W - 48, 180, 14);
          g.fillStyle = 'rgba(253,252,244,.96)'; g.fill();
          g.strokeStyle = '#b0a48e'; g.lineWidth = 2; g.stroke();
          g.fillStyle = lastMark === '◎' ? '#e5a000' : lastMark === '◯' ? '#7a9a3a' : '#c0392b';
          g.font = `800 40px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(lastMark, W / 2, 458);
          g.fillStyle = '#3a3f52'; g.font = `800 14px ${FONT}`;
          g.fillText('正解の待ち (' + waits.length + '種)', W / 2, 492);
          const tw = 34, gap = 6, x0 = W / 2 - (waits.length * (tw + gap) - gap) / 2;
          waits.forEach((n, i) => tile(g, n, x0 + i * (tw + gap), 508, tw, 48, { sel: sel.has(n) }));
          g.fillStyle = '#8a7a5a'; g.font = `700 11px ${FONT}`;
          g.fillText('タップですすむ', W / 2, 584);
        }
      },
      onDown(x, y) {
        if (phase === 'reveal') { next(); A.tick(); return; }
        if (phase !== 'q') return;
        // 回答牌トグル
        if (y >= BT.y - 12 && y <= BT.y + BT.h + 6) {
          const n = Math.floor((x - BT.x0) / (BT.w + 5)) + 1;
          const inTile = (x - BT.x0) % (BT.w + 5) <= BT.w; // 牌間のgapは拾わない (review nit対応)
          if (n >= 1 && n <= 9 && inTile) { sel.has(n) ? sel.delete(n) : sel.add(n); A.tick(); return; }
        }
        if (x >= ANS.x && x <= ANS.x + ANS.w && y >= ANS.y && y <= ANS.y + ANS.h) {
          if (sel.size) { judgeNow(false); A.pop(); } else A.bad();
        }
      },
      finish() {
        const perfect = marks.filter((m) => m === '◎').length;
        const partial = marks.filter((m) => m === '◯').length;
        const avg = times.length ? (times.reduce((a, b) => a + b, 0) / times.length) : 0;
        return { banner: pts + '/20点！', stats: [
          ['🀅 クイズ得点', pts + ' / 20'],
          ['◎ 完全一致', perfect + '問'],
          ['◯ 部分正解', partial + '問'],
          ['⏱ 平均回答', avg.toFixed(1) + '秒'],
        ] };
      },
      destroy() {},
    };
  },
});

/* ---- チンイツ道場 セルフテスト ---- */
function runChinitsuTests() {
  const { ck, done } = makeTest('chinitsu');
  const H = (s) => { const c = new Array(9).fill(0); for (const ch of s) c[+ch - 1]++; return c; };
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  // ── 確定フィクスチャ (待ちは手計算/オラクル照合済み) ──
  // 111222333 型は 123×3 にも読めるため直感より待ちが増える (それ自体が本ゲームの学び)。
  // 期待値は 手計算＋下記オラクル(独立実装) の一致で確定させたもの。
  const FIX = [
    ['1112345678999', [1, 2, 3, 4, 5, 6, 7, 8, 9]], // 純正九蓮宝燈=九面待ち
    ['1112223334449', [9]],                          // 単騎 (123×3読みでも9のみ)
    ['1112223334499', [1, 4, 9]],                    // シャンポン+99雀頭で111/123/234/234の1
    ['1112223334456', [1, 2, 3, 4, 5, 7]],           // 六面 (111222333の多面化)
    ['1112223334457', [6]],                          // 嵌張
    ['1112223345678', [1, 2, 3, 4, 6, 9]],           // 六面
    ['1122334455667', [1, 4, 7]],                    // 二盃口連続形の1-4-7 (7単騎に見える罠)
    ['1122445577889', [9]],                          // 七対子でのみ和了 (標準形なし)
    ['1112223335567', [4, 5, 8]],                    // 亜両面+多面化
    ['1111222333444', [2, 3, 4]],                    // 同一牌4枚使い切り
    ['2233445566778', [2, 5, 8]],                    // 定番の2-5-8三面
    ['1113334445557', [6, 7]],
    ['1123456789999', [1, 4, 7]],                    // 9は4枚使用済みで待てない
    ['2223456777889', [6, 7, 9]],
    ['1122335578899', [7]],                          // 七対子/標準どちらでも7単騎
  ];
  // ── 独立オラクル: 牌配列ベースの別実装 (ソルバーのタイポ検出用) ──
  function oraDecomp(arr) { // arr: 昇順の牌配列 (雀頭除去済み)
    if (!arr.length) return true;
    const x = arr[0];
    if (arr[1] === x && arr[2] === x && oraDecomp(arr.slice(3))) return true;
    const i1 = arr.indexOf(x + 1), i2 = arr.indexOf(x + 2);
    if (i1 > 0 && i2 > 0) {
      const rest = arr.slice(1); rest.splice(rest.indexOf(x + 1), 1); rest.splice(rest.indexOf(x + 2), 1);
      if (oraDecomp(rest)) return true;
    }
    return false;
  }
  function oraAgari(arr14) {
    const cnt = {}; arr14.forEach((t) => cnt[t] = (cnt[t] || 0) + 1);
    if (Object.values(cnt).filter((n) => n === 2).length === 7) return true;
    for (const v of Object.keys(cnt)) {
      if (cnt[v] < 2) continue;
      const rest = [...arr14]; rest.splice(rest.indexOf(+v), 1); rest.splice(rest.indexOf(+v), 1);
      if (oraDecomp(rest)) return true;
    }
    return false;
  }
  const oraWaits = (c) => {
    const arr = []; for (let t = 0; t < 9; t++) for (let k = 0; k < c[t]; k++) arr.push(t + 1);
    const out = [];
    for (let n = 1; n <= 9; n++) {
      if (c[n - 1] >= 4) continue;
      if (oraAgari([...arr, n].sort((a, b) => a - b))) out.push(n);
    }
    return out;
  };
  for (const [s, want] of FIX) {
    const c = H(s);
    const got = ctzWaits(c);
    const expect = want || oraWaits(c);
    ck('fix:' + s + '→' + expect.join(''), eq(got, expect) && (want == null || eq(got, want)));
    ck('fix:' + s + ' オラクル一致', eq(got, oraWaits(c)));
  }
  // ── クロスチェック: ランダム400手でオラクルと完全一致 ──
  {
    const rng = mulberry32(77); let ok = true;
    for (let n = 0; n < 400; n++) {
      const pool = [];
      for (let t = 0; t < 9; t++) for (let k = 0; k < 4; k++) pool.push(t);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      const c = new Array(9).fill(0);
      for (let i = 0; i < 13; i++) c[pool[i]]++;
      if (!eq(ctzWaits(c), oraWaits(c))) { ok = false; break; }
    }
    ck('cross: ランダム400手でオラクル一致', ok);
  }
  // ── 構成的性質: ランダム和了形から1枚抜くと必ずその牌が待ちに含まれる ──
  {
    const rng = mulberry32(99); let ok = true;
    for (let n = 0; n < 200; n++) {
      const c = new Array(9).fill(0);
      let guard = 0, sets = 0;
      while (sets < 4 && guard++ < 60) {
        if (rng() < 0.5) { const t = Math.floor(rng() * 9); if (c[t] + 3 <= 4) { c[t] += 3; sets++; } }
        else { const t = Math.floor(rng() * 7); if (c[t] + 1 <= 4 && c[t + 1] + 1 <= 4 && c[t + 2] + 1 <= 4) { c[t]++; c[t + 1]++; c[t + 2]++; sets++; } }
      }
      if (sets < 4) continue;
      const pt = Math.floor(rng() * 9); if (c[pt] + 2 > 4) { n--; continue; }
      c[pt] += 2;
      const tiles = []; for (let t = 0; t < 9; t++) for (let k = 0; k < c[t]; k++) tiles.push(t);
      const rm = tiles[Math.floor(rng() * tiles.length)];
      c[rm]--;
      if (!ctzWaits(c).includes(rm + 1)) { ok = false; break; }
      c[rm]++;
    }
    ck('prop: 和了形-1枚 → その牌が待ちに含まれる (200手)', ok);
  }
  // ── 出題生成の性質 ──
  {
    const quiz = ctzGenQuiz(mulberry32(2026), 10, 4);
    ck('gen: 10問', quiz.length === 10);
    ck('gen: 全問 待ち1種以上', quiz.every((q) => q.waits.length >= 1));
    ck('gen: 13枚・各牌4枚以下', quiz.every((q) => q.c.reduce((a, b) => a + b, 0) === 13 && q.c.every((v) => v >= 0 && v <= 4)));
    ck('gen: 待ち3種以上が4問以上', quiz.filter((q) => q.waits.length >= 3).length >= 4);
    const quiz2 = ctzGenQuiz(mulberry32(2026), 10, 4);
    ck('gen: 同シードで同一問題 (デイリー対応)', eq(quiz, quiz2));
  }
  return done();
}
SELFTESTS.push(runChinitsuTests);


/* =========================================================================
   🀄 まーじゃん なぜきり道場 — 打牌理由コーチング (1人用)
   牌表現: int[34] 枚数配列 (0-8:萬 9-17:筒 18-26:索 27-33:東南西北白發中)
   設計方針: シャンテンはスート別メモ化DP / 役・安全度・押し引きは全てテーブル駆動 /
             河の情報は増分更新。if分岐の羅列を避けコード量を圧縮する。
   ========================================================================= */
const MJ=(()=>{
  const HONOR=27;
  const NAMES=(()=>{const n=[];for(const[suf,b]of[['萬',0],['筒',9],['索',18]])
    for(let i=1;i<=9;i++)n[b+i-1]=i+suf;
    ['東','南','西','北','白','發','中'].forEach((z,i)=>n[HONOR+i]=z);return n;})();
  const YAOCHU=(()=>{const y=new Array(34).fill(false);
    [0,8,9,17,18,26].forEach(t=>y[t]=true);
    for(let t=HONOR;t<34;t++)y[t]=true;return y;})();
  function parse(str){ // "123m45p6z"→int[34] (テスト用)
    const h=new Array(34).fill(0);let d=[];
    for(const ch of str){
      if(ch>='1'&&ch<='9')d.push(+ch);
      else{const b={m:0,p:9,s:18,z:HONOR}[ch];if(b!==undefined){d.forEach(x=>h[b+x-1]++);d=[];}}
    }
    return h;
  }
  /* --- シャンテンDP: スート9種ベクトル→(面子,塔子)パレート集合をメモ化。
         手牌が1枚変わっても残り2スート+字牌はキャッシュヒット=実質差分計算 --- */
  const suitMemo=new Map();
  function pPush(list,m,t){
    for(let i=0;i<list.length;i++){const p=list[i];
      if(p[0]>=m&&p[1]>=t)return;
      if(m>=p[0]&&t>=p[1])list.splice(i--,1);
    }
    list.push([m,t]);
  }
  function enumSuit(c,i,out,m,t){
    while(i<9&&c[i]===0)i++;
    if(i>=9){pPush(out,m,t);return;}
    c[i]--;enumSuit(c,i,out,m,t);c[i]++;                                   // 孤立牌として除外
    if(c[i]>=3){c[i]-=3;enumSuit(c,i,out,m+1,t);c[i]+=3;}                  // 刻子
    if(i<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;
      enumSuit(c,i,out,m+1,t);c[i]++;c[i+1]++;c[i+2]++;}                   // 順子
    if(c[i]>=2){c[i]-=2;enumSuit(c,i,out,m,t+1);c[i]+=2;}                  // 対子
    if(i<=7&&c[i+1]>0){c[i]--;c[i+1]--;enumSuit(c,i,out,m,t+1);c[i]++;c[i+1]++;} // 両面/辺張
    if(i<=6&&c[i+2]>0){c[i]--;c[i+2]--;enumSuit(c,i,out,m,t+1);c[i]++;c[i+2]++;} // 嵌張
  }
  function suitPat(c9){
    const key=c9.join('');let v=suitMemo.get(key);
    if(!v){v=[];enumSuit(c9.slice(),0,v,0,0);suitMemo.set(key,v);}
    return v;
  }
  // Phase4a: 副露(ポン/チー/明カン)は既に確定した面子として外部で保持するため、
  // シャンテン計算は「残り必要ブロック数」をnumMelds分だけ圧縮して評価する(既定0=門前・従来どおり)
  function bestMT(h,numMelds){ // ブロック数(面子+塔子)≤(4-numMelds) で 2m+t 最大
    const cap=4-(numMelds||0);
    const hon=[[0,0]];let hm=0,ht=0;
    for(let i=HONOR;i<34;i++){if(h[i]>=3)hm++;else if(h[i]===2)ht++;}
    hon[0]=[hm,ht];
    let acc=[[0,0]];
    for(const list of[suitPat(h.slice(0,9)),suitPat(h.slice(9,18)),suitPat(h.slice(18,27)),hon]){
      const next=[];
      for(const a of acc)for(const b of list){
        const m=a[0]+b[0];if(m>cap)continue;
        pPush(next,m,Math.min(a[1]+b[1],cap-m));
      }
      acc=next;
    }
    let best=0;for(const[m,t]of acc)best=Math.max(best,2*m+t);
    return best;
  }
  const shCache=new Map(); // (副露数:手牌ハッシュ)→シャンテン数
  function shanten(h,numMelds){
    numMelds=numMelds||0;
    const key=numMelds+':'+h.join('');const hit=shCache.get(key);
    if(hit!==undefined)return hit;
    let std=8-2*numMelds-bestMT(h,numMelds);
    for(let hd=0;hd<34;hd++){ // 雀頭を固定して再計算
      if(h[hd]<2)continue;
      h[hd]-=2;std=Math.min(std,7-2*numMelds-bestMT(h,numMelds));h[hd]+=2;
    }
    let s=std;
    if(!numMelds){ // 七対子/国士は副露があると成立不可能(門前限定)
      let pairs=0,kinds=0,yK=0,yP=0;
      for(let i=0;i<34;i++){
        if(h[i]>0){kinds++;if(YAOCHU[i]){yK++;if(h[i]>=2)yP=1;}}
        if(h[i]>=2)pairs++;
      }
      s=Math.min(std,6-pairs+Math.max(0,7-kinds),13-yK-yP);
    }
    shCache.set(key,s);
    return s;
  }
  function ukeire(h,vis,numMelds){ // 手牌の有効牌: {shanten,tiles:[{tile,left}],count,kinds}
    const s0=shanten(h,numMelds);const tiles=[];let count=0;
    for(let t=0;t<34;t++){
      const left=4-h[t]-(vis?vis[t]:0);
      if(left<=0)continue;
      h[t]++;
      if(shanten(h,numMelds)<s0){tiles.push({tile:t,left});count+=left;}
      h[t]--;
    }
    return {shanten:s0,tiles,count,kinds:tiles.length};
  }
  function winTiles(h13,numMelds){ // 和了牌リスト (聴牌でなければ空)
    const out=[];
    for(let t=0;t<34;t++){
      if(h13[t]>=4)continue;
      h13[t]++;if(shanten(h13,numMelds)===-1)out.push(t);h13[t]--;
    }
    return out;
  }
  /* --- 和了形分解 (役判定用: 雀頭+面子の全分解と七対子)
     numMelds>0(副露あり)の時は七対子を除外(副露していると成立不可能)。
     残り必要面子数は副露分だけ手牌が小さくなっているため、既存の再帰はそのまま使い回せる --- */
  function decompose(h,numMelds){
    const res=[];
    if(!numMelds){
      let pr=0;for(let i=0;i<34;i++)if(h[i]===2)pr++;
      if(pr===7)res.push({chiitoi:true,pair:-1,sets:[]});
    }
    for(let hd=0;hd<34;hd++){
      if(h[hd]<2)continue;
      h[hd]-=2;
      const sets=[];
      (function rec(i){
        while(i<34&&h[i]===0)i++;
        if(i>=34){res.push({pair:hd,sets:sets.slice()});return;}
        if(h[i]>=3){h[i]-=3;sets.push({type:'tri',tile:i});rec(i);sets.pop();h[i]+=3;}
        if(i<HONOR&&i%9<=6&&h[i+1]>0&&h[i+2]>0){
          h[i]--;h[i+1]--;h[i+2]--;sets.push({type:'run',tile:i});rec(i);
          sets.pop();h[i]++;h[i+1]++;h[i+2]++;}
      })(0);
      h[hd]+=2;
    }
    return res;
  }
  /* --- 役テーブル: 宣言的な条件記述子のみ。judgeOne 1関数で全役を評価 --- */
  const YAKU=[
    {name:'リーチ',han:1,menzenOnly:true,flag:'riichi'},
    {name:'門前清自摸和',han:1,menzenOnly:true,flag:'tsumo'},
    {name:'断幺九',han:1,tileTest:t=>!YAOCHU[t]},
    {name:'平和',han:1,menzenOnly:true,pinfu:true},
    {name:'役牌(白)',han:1,tripletOf:31},
    {name:'役牌(發)',han:1,tripletOf:32},
    {name:'役牌(中)',han:1,tripletOf:33},
    {name:'場風牌',han:1,tripletOf:'roundWind'},
    {name:'自風牌',han:1,tripletOf:'seatWind'},
    {name:'七対子',han:2,menzenOnly:true,chiitoi:true},
    {name:'対々和',han:2,setType:'tri'},
    {name:'一盃口',han:1,menzenOnly:true,iipeiko:true},
    {name:'混一色',han:3,suitLimit:'half'},
    {name:'清一色',han:6,suitLimit:'full'},
  ];
  function meldTiles(m){return m.type==='run'?[m.tile,m.tile+1,m.tile+2]:[m.tile,m.tile,m.tile];}
  function judgeOne(y,ctx,d){
    if(y.menzenOnly&&!ctx.menzen)return false;
    if(y.flag)return !!ctx[y.flag];
    if(y.chiitoi)return !!d.chiitoi;
    if(d.chiitoi&&(y.pinfu||y.setType||y.iipeiko||y.tripletOf!==undefined))return false;
    const melds=ctx.melds||[],allSets=d.sets.concat(melds); // 副露も刻子/順子判定に含める(#Phase4a)
    if(y.tileTest){
      for(let t=0;t<34;t++)if(ctx.hand[t]>0&&!y.tileTest(t))return false;
      for(const m of melds)for(const t of meldTiles(m))if(!y.tileTest(t))return false;
      return true;
    }
    if(y.tripletOf!==undefined){
      const tg=typeof y.tripletOf==='number'?y.tripletOf:ctx[y.tripletOf];
      return allSets.some(s=>s.type==='tri'&&s.tile===tg);
    }
    if(y.setType)return allSets.every(s=>s.type===y.setType);
    if(y.iipeiko){const r=d.sets.filter(s=>s.type==='run').map(s=>s.tile);
      return r.some((t,i)=>r.indexOf(t)<i);}
    if(y.suitLimit){
      const su=new Set();let hon=false;
      for(let i=0;i<34;i++)if(ctx.hand[i]>0){if(i<HONOR)su.add(i/9|0);else hon=true;}
      for(const m of melds){if(m.tile<HONOR)su.add(m.tile/9|0);else hon=true;}
      return su.size===1&&(y.suitLimit==='full'?!hon:hon);
    }
    if(y.pinfu){
      if(d.sets.length!==4||!d.sets.every(s=>s.type==='run'))return false;
      const p=d.pair;
      if(p>=31||p===ctx.seatWind||p===ctx.roundWind)return false;
      const w=ctx.winTile; // 両面待ち(辺張123の3/789の7を除外)
      return d.sets.some(s=>(w===s.tile&&s.tile%9<=5)||(w===s.tile+2&&s.tile%9>=1));
    }
    return false;
  }
  function judgeYaku(ctx){ // 全分解を試し最大翻の役リスト
    let best={han:0,yaku:[]};
    for(const d of decompose(ctx.hand,(ctx.melds||[]).length)){
      const yaku=[];let han=0;
      for(const y of YAKU)if(judgeOne(y,ctx,d)){yaku.push(y);han+=y.han;}
      if(han>best.han)best={han,yaku,decomp:d};
    }
    return best;
  }
  return {HONOR,NAMES,YAOCHU,parse,shanten,ukeire,winTiles,decompose,YAKU,judgeYaku,
    clearCache(){suitMemo.clear();shCache.clear();}};
})();

/* ---- 河の情報 (現物・スジ・壁): 捨て牌1枚ごとの増分更新 ---- */
function mjRiverNew(){return {visible:new Array(34).fill(0),genbutsu:new Array(34).fill(false)};}
function mjSee(S,t){S.visible[t]++;}                 // 見えた牌を数えるだけ O(1)
function mjThreatDiscard(S,t){S.genbutsu[t]=true;mjSee(S,t);} // 警戒対象の捨て牌 O(1)
const mjSuji=(S,t)=>{ // スジ判定: 4切り→1・7 が通りやすい
  const n=t%9,b=t-n,g=k=>k>=0&&k<=8&&S.genbutsu[b+k];
  if(n<=2)return g(n+3);
  if(n>=6)return g(n-3);
  return g(n-3)&&g(n+3); // 4-6は中スジ(両側必要)
};
const mjWallCnt=(S,h,t)=>4-S.visible[t]-h[t];        // 自分から見えない残り枚数
const mjNoChance=(S,h,t)=>{ // 両面待ちが構成不能(壁): 下側・上側とも塔子が枯れている
  const n=t%9,b=t-n,dead=k=>k<0||k>8||mjWallCnt(S,h,b+k)<=0;
  return (dead(n-2)||dead(n-1))&&(dead(n+1)||dead(n+2));
};
/* 安全度テーブル: 上から順に最初に一致した行を採用 (現物100〜無スジ中央22) */
const MJ_SAFETY=[
  {label:'現物',pts:100,hit:(S,h,t)=>S.genbutsu[t]},
  {label:'字牌3枚見え',pts:90,hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]>=3},
  {label:'壁(ノーチャンス)',pts:80,hit:(S,h,t)=>t<MJ.HONOR&&mjNoChance(S,h,t)},
  {label:'スジの1・9',pts:75,hit:(S,h,t)=>t<MJ.HONOR&&(t%9===0||t%9===8)&&mjSuji(S,t)},
  {label:'字牌2枚見え',pts:70,hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]>=2},
  {label:'スジの2・8',pts:65,hit:(S,h,t)=>t<MJ.HONOR&&(t%9===1||t%9===7)&&mjSuji(S,t)},
  {label:'中スジ',pts:55,hit:(S,h,t)=>t<MJ.HONOR&&mjSuji(S,t)},
  {label:'生牌の字牌',pts:45,hit:(S,h,t)=>t>=MJ.HONOR},
  {label:'端の1・9',pts:40,hit:(S,h,t)=>t%9===0||t%9===8},
  {label:'2・8',pts:32,hit:(S,h,t)=>t%9===1||t%9===7},
  {label:'中央3-7(無スジ)',pts:22,hit:()=>true},
];
function mjSafety(S,h,t){for(const e of MJ_SAFETY)if(e.hit(S,h,t))return e;}

/* ---- Phase3: 他家個別の危険牌ヒートマップ (現物/スジ/裏スジ/間四軒/カベ/ワンチャンス・ノーチャンス/字牌の生き死に) ----
   既存のmjSuji/mjNoChance/mjWallCntは「リーチ済み他家の河を合算した1視点」向けだったため、
   Phase3では家ごとに現物(自分の河のみ)を見る個別ビューを新設し、4段階(tier 0=◎〜3=危険)へ統合する */
// review must-fix(PR#49 3巡目): 裏スジは対象牌±3の手出しではない(それは通常のスジと同じ関係)。
// 正しくは「手出し牌D(1-indexed)の裏スジは、D<=4ならD+1とD+4、D>=5ならD-1とD-4」(参考: 麻雀豆腐 裏筋解説)。
// 例: 3m手出し→4m・7mが裏スジ危険(4m手出しなら5m・8mが裏スジ、1mは通常のスジであって裏スジではない)
const mjUraSuji=(river,t)=>{
  if(t>=MJ.HONOR)return false;
  const n=t%9,b=t-n;
  return river.some(e=>{
    if(!e.ted||e.t<b||e.t>=b+9)return false; // 同色の手出しのみ対象
    const d=e.t-b; // 手出し牌の0-indexedランク(0-8)
    return (d<=4&&(n===d+1||n===d+4))||(d>=4&&(n===d-1||n===d-4));
  });
};
// review must-fix(PR#49 3巡目): 間四軒は対象牌自身の周辺牌が壁(4枚見え)かどうかのカベ系判定ではない。
// 正しくは「同色で5差(1-indexedでD, D+5)の手出しが河に両方あれば、その内側の牌(D+1・D+4)が危険」
// (=同じ牌の裏スジが2方向から重なって成立する、より強い危険信号。参考: 麻雀豆腐 間四軒解説)
// 例: 2p・7p手出し(5差)→3p・6pが間四軒で危険
const mjAidaYonken=(river,t)=>{
  if(t>=MJ.HONOR)return false;
  const n=t%9,b=t-n;
  const ted=new Set();
  for(const e of river)if(e.ted&&e.t>=b&&e.t<b+9)ted.add(e.t-b);
  for(const d of ted)if(d<=3&&ted.has(d+5)&&(n===d+1||n===d+4))return true;
  return false;
};
// review must-fix(PR#49): 壁/ワンチャンスは「待ちを構成する周辺牌(両面の相方)の枯れ方」で判定するべきで、
// 対象牌t自身の残り枚数(mjWallCnt(S,h,t))を根拠にしてはいけない(現物残り1枚でも普通に放銃しうる)。
// 既存mjNoChance(Phase2からの周辺牌ベース判定)を流用し、片側だけ枯れている状態をワンチャンスとして新設する。
const mjOneChance=(S,h,t)=>{ // ワンチャンス: 両面が構成できる相方(実在する牌に限る)のうち少なくとも1つが枯れている(壁=両側とも成立不可は上位tierで処理済み)
  // 端牌は片側が盤面外(範囲外)になるが、それを「枯れている」扱いにするとmjNoChanceのAND判定では無害でも
  // このOneChance(何かが1つでも枯れていればtrue)ではXOR相当の判定が常に真になってしまうため、
  // 範囲内(実在する牌)のみを対象に判定する
  if(mjNoChance(S,h,t))return false; // 既に壁(ノーチャンス)ならワンチャンスとは呼ばない
  const n=t%9,b=t-n,realDead=k=>k>=0&&k<=8&&mjWallCnt(S,h,b+k)<=0;
  return [n-2,n-1,n+1,n+2].some(k=>realDead(k));
};
/* ヒートマップ段階テーブル: tier 0=◎安全 / 1=○ / 2=注意 / 3=危険。上から順に最初の一致を採用 */
const MJ_DANGER=[
  {tier:0,label:'現物',hit:(S,h,t)=>S.genbutsu[t]},
  {tier:0,label:'壁(ノーチャンス)',hit:(S,h,t)=>t<MJ.HONOR&&mjNoChance(S,h,t)},
  // review must-fix(PR#49 3巡目): 間四軒は裏スジが2方向から重なった、より強い危険信号(参考記事: 「裏スジよりさらに危険」)。
  // 対象牌集合は理論上どちらか片方の裏スジ単独と一致するため、先に判定してより具体的なラベルを優先する
  {tier:3,label:'間四軒',hit:(S,h,t,river)=>mjAidaYonken(river,t)},
  {tier:3,label:'裏スジ',hit:(S,h,t,river)=>mjUraSuji(river,t)},
  {tier:3,label:'生牌の字牌',hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]<2},
  {tier:1,label:'ワンチャンス',hit:(S,h,t)=>t<MJ.HONOR&&mjOneChance(S,h,t)},
  {tier:1,label:'字牌2枚見え',hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]>=2},
  {tier:1,label:'スジ',hit:(S,h,t)=>t<MJ.HONOR&&mjSuji(S,t)},
  {tier:2,label:'情報なし',hit:()=>true},
];
function mjDanger(S,h,t,river){for(const e of MJ_DANGER)if(e.hit(S,h,t,river))return e;}
const MJ_TIER_MARK=['◎','○','注意','危険'];
function mj4Danger(R,seat,t){ // 指定家(seat)から見た牌tの危険度。現物はseatの河のみで判定(furiten理論通り)
  // review must-fix(PR#49 2巡目): 候補牌tは「今から切って河に乗る」ものとして扱う。
  // 手牌hからは1枚減らすが、同時にローカルなvisible[t]を+1して既知総数を保存する
  // (減らすだけだと打牌後の既知枚数が1枚少なく評価され、例: 字牌を手牌2枚→1枚打牌時に
  //  本来「字牌2枚見え」のはずが「生牌」に誤判定されていた)
  const S={visible:R.visible.slice(),genbutsu:new Array(34).fill(false)};
  for(const e of R.players[seat].river)S.genbutsu[e.t]=true;
  const h=R.players[0].hand.slice();
  if(h[t]>0){h[t]--;S.visible[t]++;}
  return mjDanger(S,h,t,R.players[seat].river);
}
function mj4TenpaiKehai(river){ // 聴牌気配(簡易): 直近3打中2回以上が手出し→気配あり
  if(river.length<3)return false;
  return river.slice(-3).filter(e=>e.ted).length>=2;
}
function mj4DangerReason(R,t){ // 自分が切る牌tについて、他家3人のうち最も危険な家の判定を返す({seat,d}) / 全員◎ならnull扱いはせずtier0を返す
  let worst=null;
  for(let s=1;s<4;s++){
    const d=mj4Danger(R,s,t);
    if(!worst||d.tier>worst.d.tier)worst={seat:s,d};
  }
  return worst;
}
function mj4CoachLine(R,t){ // ルーペ用の理由付き1行解説(注意/危険な家がある時だけ返す。安全なら null)
  const w=mj4DangerReason(R,t);
  if(!w||w.d.tier<=1)return null;
  return MJ4_NAMES[w.seat]+'に'+(w.d.tier===3?'危険':'注意')+'('+w.d.label+')';
}
function mj4PushEval(R,chosenTile,an){ // 押し引き採点用: 危険牌を押したか/より安全な牌をよけて選んだか
  const threat=[1,2,3].some(s=>R.players[s].riichi||mj4TenpaiKehai(R.players[s].river));
  if(!threat)return null;
  const chosenTier=mj4DangerReason(R,chosenTile).d.tier;
  if(chosenTier<=1)return {pushedDanger:false,avoidedDanger:true}; // 脅威下で安全な牌を選べた(代替の有無は問わない)
  const hadSafeAlt=an.cands.some(c=>c.tile!==chosenTile&&mj4DangerReason(R,c.tile).d.tier<=1);
  return {pushedDanger:hadSafeAlt,avoidedDanger:false}; // 危険な牌を選んだ場合のみ「避けられたか」を見る
}

/* 役の芽テーブル: 13枚時点で「どの役に向かえるか」を宣言的に判定 */
const MJ_YAKU_EYES=[
  {label:'タンヤオ形',pts:8,hit:h=>{for(let t=0;t<34;t++)if(h[t]>0&&MJ.YAOCHU[t])return false;return true;}},
  {label:'役牌対子',pts:7,hit:(h,c)=>[31,32,33,c.seatWind,c.roundWind].some(t=>h[t]>=2)},
  {label:'七対子ねらい',pts:6,hit:h=>{let p=0;for(let t=0;t<34;t++)if(h[t]>=2)p++;return p>=4;}},
  {label:'ピンフ形',pts:5,hit:h=>{let tri=0;for(let t=0;t<34;t++)if(h[t]>=3)tri++;
    for(let t=MJ.HONOR;t<34;t++)if(h[t]>0&&t>=31)return false;return tri===0;}},
  {label:'染め手みこみ',pts:6,hit:h=>{const c=[0,0,0];let hon=0;
    for(let t=0;t<34;t++)if(h[t]>0){if(t<MJ.HONOR)c[t/9|0]+=h[t];else hon+=h[t];}
    return Math.max(...c)+hon>=11&&c.filter(x=>x>0).length<3;}},
];
function mjYakuEyes(h13,c){const out=[];let pts=0;
  for(const e of MJ_YAKU_EYES)if(e.hit(h13,c)){out.push(e.label);pts+=e.pts;}
  return {labels:out,pts};
}

/* 押し引きテーブル: 自シャンテン×脅威(リーチ有無)×巡目→効率/安全の重み */
const MJ_PUSH=[
  [{eff:1,safe:0},{eff:.65,safe:.35}], // 聴牌
  [{eff:1,safe:0},{eff:.35,safe:.65}], // 1シャンテン
  [{eff:1,safe:0},{eff:.12,safe:.88}], // 2シャンテン以上
];
function mjPushW(sh,threat,turn){
  const w=Object.assign({},MJ_PUSH[Math.min(Math.max(sh,0),2)][threat?1:0]);
  if(threat&&turn>=12){w.safe=Math.min(1,w.safe+.1);w.eff=1-w.safe;} // 終盤は降り寄り
  return w;
}

/* ---- 打牌候補の分析: 14枚→全候補の {効率/安全/役} スコアと理由 ---- */
function mjAnalyze(h14,S,c){ // c:{threat,turn,seatWind,roundWind,numMelds}(#Phase4a: 副露があるとシャンテン計算に反映)
  const cands=[];
  const numMelds=c.numMelds||0;
  for(let t=0;t<34;t++){
    if(h14[t]===0)continue;
    h14[t]--;
    const u=MJ.ukeire(h14,S.visible,numMelds);
    const eyes=mjYakuEyes(h14,c);
    cands.push({tile:t,sh:u.shanten,uke:u,eyes,safe:mjSafety(S,h14,t)});
    h14[t]++;
  }
  const shMin=Math.min(...cands.map(x=>x.sh));
  // 受け入れ枚数はシャンテン数が同じ候補どうしでしか比較できない(浅いほど母数が減る)。
  // 同一シャンテン帯内で正規化し、後退は1段ごとに-70点(帯内順位は保って理由説明に使う)
  const maxBySh={};
  for(const x of cands)maxBySh[x.sh]=Math.max(maxBySh[x.sh]||1,x.uke.count);
  const pw=mjPushW(shMin,c.threat,c.turn);
  for(const x of cands){
    x.eff=Math.max(0,Math.round(100*x.uke.count/maxBySh[x.sh]-70*(x.sh-shMin)));
    x.total=Math.round(pw.eff*x.eff+pw.safe*x.safe.pts+Math.min(12,x.eyes.pts)*.01*x.eff);
  }
  cands.sort((a,b)=>b.total-a.total||b.eff-a.eff);
  return {cands,shMin,maxBySh,weights:pw};
}
/* 理由テキスト: 出力例「①受け入れ6種18枚(最大) ②現物で安全 ③タンヤオ形を維持」 */
function mjReason(x,an,threat){
  const r=['①受け入れ'+x.uke.kinds+'種'+x.uke.count+'枚'+
    (x.sh>an.shMin?'(シャンテン後退!)':x.uke.count>=an.maxBySh[x.sh]?'(最大)':'')];
  if(threat)r.push('②'+x.safe.label+(x.safe.pts>=65?'で安全':x.safe.pts>=45?'(やや危険)':'(危険!)'));
  r.push((threat?'③':'②')+(x.eyes.labels.length?x.eyes.labels.slice(0,2).join('・')+'を維持':'役の芽なし(リーチ頼み)'));
  return r;
}

/* ---- CPU打牌 (B-8): プレイヤーと同じ分析器を使い、判断根拠もログに残す ---- */
function mjCpuDiscard(h14,S,c){
  const an=mjAnalyze(h14,S,c);
  const top=an.cands[0];
  const why=c.threat?(top.safe.pts>=65?'あんぜんな'+MJ.NAMES[top.tile]+'からきるよ'
      :'おりたいけど…'+MJ.NAMES[top.tile]+'がいちばんマシ')
    :'うけいれ'+top.uke.count+'まいで最大の'+MJ.NAMES[top.tile]+'をきるよ';
  return {tile:top.tile,why,an};
}

/* ---- 採点 (A-6): 1打ごとのロス→局全体をSS/S/A/B/Cへ (titleForと同形式のテーブル) ---- */
const MJ_RANKS=[[0,'C','#aab0c8'],[45,'B','#8fd0ff'],[65,'A','#7cf29c'],[80,'S','#ffb0d8'],[92,'SS','#ffd23f']];
function mjRankFor(score){let r=MJ_RANKS[0];for(const e of MJ_RANKS)if(score>=e[0])r=e;return r;}
function mjTurnScore(chosen,an){ // その巡の打牌採点 0-100
  return Math.max(0,100-(an.cands[0].total-chosen.total)*3);
}
function mjJudgeKind(chosen,an){ // コア共通JUDGE(スコア/コンボ)への写像
  const loss=an.cands[0].total-chosen.total;
  return loss<=0?'perfect':loss<=4?'great':loss<=12?'good':'miss';
}

/* ---- Phase2: 4人打ちの進行 (UI非依存: セルフテストでヘッドレス実行できる) ----
   卓は seat0=自分, 1=下家, 2=対面, 3=上家。鳴きなし(門前のみ)・東風戦(既定)/半荘。
   AI打牌は自分と同じ mjAnalyze を使用 (Phase3の手牌読み確率はこの分離点に乗せる想定) */
const MJ4_NAMES=['あなた','下家','対面','上家'];
// #feedback4 7件目: 席の見た目表示に大富豪(#51)と共通のキャラプールを使い、統一感を出す。
// MJ4_NAMESは「下家に危険」等の戦略テキストで席位置の意味を伝えるため引き続き使用し、
// こちらは卓の相手パネル(drawOpp、画面上の位置で上家/対面/下家がすでに分かる)専用の見た目だけの表示名
const MJ4_CHAR_NAMES=['','🐶ぽち','🐱みけ','🐰うさこ'];
const MJ_SPEED_ORDER=['slow','normal','fast'];
const MJ_SPEED={ // 他家の打牌テンポ(秒)。normalが既定=1手0.7秒ほど見せてから次へ
  slow:{seat:1.1,trans:.55,init:.45,label:'🐢ゆっくり'},
  normal:{seat:.7,trans:.35,init:.3,label:'🚶ふつう'},
  fast:{seat:.4,trans:.2,init:.2,label:'🐇はやい'},
};
function mj4ScoreValue(han,dealer){ // 簡易点数表(初版): 2000×翻 / 4翻=8000 / 5翻+=12000 / 7翻+=16000。親1.5倍
  const base=han>=7?16000:han>=5?12000:han>=4?8000:2000*han;
  return dealer?Math.ceil(base*1.5/100)*100:base;
}
function mj4GameNew(rng,hanchan){
  return {rng,hanchan:!!hanchan,maxKyoku:hanchan?8:4,kyoku:0,
    scores:[25000,25000,25000,25000],results:[],log:[],hintsUsed:0,noYaku:0};
}
const mj4KyokuLabel=g=>(g.kyoku<4?'東':'南')+((g.kyoku%4)+1)+'局';
const mj4SeatWindOf=(dealer,s)=>27+((s-dealer+4)%4); // 親=東
const mj4NextSeat=(R,s)=>{const nx=(s+1)%4;if(nx===R.dealer)R.turnNo++;return nx;}; // 一周=親に手番が戻る (親≠seat0の局でも巡目が合う)
function mj4DoraOf(t){ // ドラ表示牌→ドラ (数牌は同スート+1・字牌は東南西北/白發中で循環)
  if(t<27){const suit=t-t%9;return suit+(t-suit+1)%9;}
  if(t<31)return 27+(t-27+1)%4;
  return 31+(t-31+1)%3;
}
function mj4RoundNew(g){
  const dealer=g.kyoku%4; // 連荘なし(コーチングテンポ優先)
  const wall=[];
  for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);
  for(let i=wall.length-1;i>0;i--){const j=Math.floor(g.rng()*(i+1));[wall[i],wall[j]]=[wall[j],wall[i]];}
  const players=[];
  for(let s=0;s<4;s++){
    const hand=new Array(34).fill(0);
    for(let i=0;i<13;i++)hand[wall.pop()]++;
    players.push({hand,river:[],riichi:0,lastDraw:-1,melds:[]}); // #Phase4a: 副露(ポン/チー/明カン)の記録
  }
  const doraIndicator=wall[0]; // wall.pop()は末尾から取るため先頭14枚(王牌)は局中ずっと不可侵
  return {g,dealer,wall,players,turn:dealer,turnNo:1,end:null,
    roundWind:g.kyoku<4?27:28,
    doraIndicator,dora:mj4DoraOf(doraIndicator),
    visible:new Array(34).fill(0)}; // 全河の見え枚数 (増分更新・全席共有)
}
const mj4SeatWind=(R,s)=>mj4SeatWindOf(R.dealer,s);
// #Phase4a: 副露(ポン/チー/明カン)を役判定用のset形状{type:'tri'|'run',tile}へ変換
const mj4MeldSets=melds=>melds.map(m=>({type:m.type==='chi'?'run':'tri',tile:m.tile}));
const mj4WinCtx=(R,s,hand,winTile,tsumo)=>{
  const melds=R.players[s].melds;
  return {hand,winTile,menzen:melds.length===0,melds:mj4MeldSets(melds),
    riichi:!!R.players[s].riichi,tsumo,seatWind:mj4SeatWind(R,s),roundWind:R.roundWind};
};
const mj4Threat=(R,seat)=>R.players.some((p,s)=>s!==seat&&p.riichi); // 他家のリーチ有無
function mj4SafetyView(R,seat){ // seat視点の安全度: 現物=リーチ済み他家の河の合算
  const S={visible:R.visible,genbutsu:new Array(34).fill(false)};
  for(let s=0;s<4;s++){
    if(s===seat||!R.players[s].riichi)continue;
    for(const e of R.players[s].river)S.genbutsu[e.t]=true;
  }
  return S;
}
function mj4Draw(R,s){ // ツモ → {tile, win|null}。win時は R.end 設定
  const p=R.players[s],t=R.wall.pop();
  p.hand[t]++;p.lastDraw=t;
  if(MJ.shanten(p.hand,p.melds.length)===-1){
    const w=MJ.judgeYaku(mj4WinCtx(R,s,p.hand,t,true));
    if(w.han>0){R.end={type:'tsumo',seat:s,win:w,winTile:t};return {tile:t,win:w};}
    if(s===0)R.g.noYaku++; // 役なし: あがれない教材ポイント (自分のみ表示)
  }
  return {tile:t,win:null};
}
function mj4Discard(R,s,t){ // 打牌 → 'ron'|null。ロンは打牌者の下家から順 (フリテン・役なし不可)
  const p=R.players[s];
  p.hand[t]--;p.river.push({t,ted:t!==p.lastDraw});R.visible[t]++;
  for(let k=1;k<4;k++){
    const o=(s+k)%4,q=R.players[o];
    if(MJ.shanten(q.hand,q.melds.length)!==0)continue;
    const wins=MJ.winTiles(q.hand,q.melds.length);
    if(!wins.includes(t))continue;
    if(wins.some(wt=>q.river.some(e=>e.t===wt)))continue; // フリテン
    q.hand[t]++;
    const w=MJ.judgeYaku(mj4WinCtx(R,o,q.hand,t,false));
    if(w.han>0){R.end={type:'ron',seat:o,from:s,win:w,winTile:t};return 'ron';}
    q.hand[t]--;
  }
  return null;
}
function mj4CpuTurn(R,s){ // AI席の1手: ツモ→(和了)→打牌→リーチ宣言。→ {tile,cut,why}
  const d=mj4Draw(R,s);
  if(R.end)return d;
  const p=R.players[s];
  if(p.riichi){mj4Discard(R,s,d.tile);return {...d,cut:d.tile,why:'ツモぎり'};}
  const an=mjAnalyze(p.hand,mj4SafetyView(R,s),
    {threat:mj4Threat(R,s),turn:R.turnNo,seatWind:mj4SeatWind(R,s),roundWind:R.roundWind,numMelds:p.melds.length});
  const cut=an.cands[0].tile;
  if(mj4Discard(R,s,cut)==='ron')return {...d,cut,why:''};
  let why=an.cands[0].sh===0?'テンパイ！':'手なり';
  if(!p.riichi&&p.melds.length===0&&MJ.shanten(p.hand,p.melds.length)===0){p.riichi=R.turnNo;why='リーチ！';} // 副露済みはリーチ不可
  return {...d,cut,why};
}
/* ---- Phase4a: 他家同士の鳴み(ポン/チー/明カン)。4aスコープは自分(seat0)の捨て牌には反応せず、
   自分も鳴かない(=4bで対応)。判定はシンプルに: 役牌がらみはポン、上家からの牌はタンヤオ寄りでチー ---- */
function mj4CallCandidates(R,discarderSeat,t){ // 優先度: 明カン>ポン(誰でも)>チー(下家のみ)
  if(discarderSeat===0)return null; // 自分の捨て牌は4aでは鳴きの対象外
  const others=[1,2,3].filter(s=>s!==discarderSeat);
  for(const s of others)if(R.players[s].hand[t]>=3)return {seat:s,type:'kan',tile:t,from:discarderSeat};
  for(const s of others)if(R.players[s].hand[t]>=2)return {seat:s,type:'pon',tile:t,from:discarderSeat};
  if(t<MJ.HONOR){
    const s=(discarderSeat+1)%4;
    if(s!==0){
      const h=R.players[s].hand,n=t%9,b=t-n;
      const combos=[[n-2,n-1],[n-1,n+1],[n+1,n+2]].filter(([a,c])=>a>=0&&c<=8);
      for(const[a,c]of combos)if(h[b+a]>0&&h[b+c]>0)return {seat:s,type:'chi',tile:t,with:[b+a,b+c],from:discarderSeat};
    }
  }
  return null;
}
// #Phase4a鳴き判断: 役牌(自風/場風/白發中)が対子なら常にポン・カンできるなら明カン優先。
// チーは受け入れ改善(シャンテンが浅くなる、または同シャンテンで受け入れ枚数が増える)時のみ
function mj4WantsCall(R,call){
  const p=R.players[call.seat];
  if(call.type==='kan'||call.type==='pon'){
    const t=call.tile;
    if(t>=31)return true; // 白發中は無条件でポン/カン(役確定)
    if(t===mj4SeatWind(R,call.seat)||t===R.roundWind)return true; // 自風・場風
    return false; // 客風・数牌の理由なきポン/カンは今回は見送り(4aはシンプルに)
  }
  // チー: 仮に鳴いた場合とスルーした場合でシャンテン/受け入れを比較し、改善する時だけ鳴く
  const h=p.hand.slice();h[call.with[0]]--;h[call.with[1]]--;
  const before=MJ.shanten(p.hand,p.melds.length),after=MJ.shanten(h,p.melds.length+1);
  if(after<before)return true;
  if(after===before){
    const u0=MJ.ukeire(p.hand,R.visible,p.melds.length),u1=MJ.ukeire(h,R.visible,p.melds.length+1);
    return u1.count>u0.count;
  }
  return false;
}
function mj4ApplyCall(R,call){ // 鳴きを手牌へ適用。呼ばれた牌は捨てた家の河に残したまま(視認カウントは既に加算済み)、
  const p=R.players[call.seat]; // 副露で新たに見える手出し分だけvisibleへ反映(Phase3ヒートマップとの整合)
  let tiles;
  if(call.type==='kan'){p.hand[call.tile]-=3;tiles=[call.tile,call.tile,call.tile,call.tile];R.visible[call.tile]+=3;}
  else if(call.type==='pon'){p.hand[call.tile]-=2;tiles=[call.tile,call.tile,call.tile];R.visible[call.tile]+=2;}
  else{const[a,b]=call.with;p.hand[a]--;p.hand[b]--;tiles=[call.tile,a,b].sort((x,y)=>x-y);
    R.visible[a]++;R.visible[b]++;}
  p.melds.push({type:call.type,tile:call.tile,tiles,from:call.from});
  // review気づき(Phase4b着手時): ポン/チー直後はツモ牌がないため、鳴いた家の次の打牌は必ず手出し扱いにする
  // (lastDrawを更新しないと数巡前のツモ牌と偶然一致した時に誤ってツモぎり判定されうる。カンは直後にmj4Drawで上書きされる)
  if(call.type!=='kan')p.lastDraw=-1;
}
/* ---- Phase4b: 自分(seat0)も鳴ける ---- */
function mj4PlayerCallOptions(R,discarderSeat,t){ // 自分がdiscarderSeatの捨て牌tに対して選べる鳴き選択肢({pon,kan,chi:[[a,b],...]|null}) / 無ければnull
  if(discarderSeat===0)return null; // 自分の捨て牌には鳴けない
  // review must-fix(PR#58): リーチ後は手牌固定のため鳴けない(リーチ後鳴きという不正状態を防ぐ)
  if(R.players[0].riichi)return null;
  const h=R.players[0].hand;
  const pon=h[t]>=2,kan=h[t]>=3;
  let chi=null;
  if(t<MJ.HONOR&&(discarderSeat+1)%4===0){ // チーは自分が下家(discarderSeat+1===自分)の時のみ
    const n=t%9,b=t-n;
    const combos=[[n-2,n-1],[n-1,n+1],[n+1,n+2]]
      .filter(([a,c])=>a>=0&&c<=8&&h[b+a]>0&&h[b+c]>0)
      .map(([a,c])=>[b+a,b+c]);
    if(combos.length)chi=combos;
  }
  if(!pon&&!kan&&!chi)return null;
  return {pon,kan,chi,tile:t,from:discarderSeat};
}
function mj4CallWouldLoseYaku(hand,type,tile,withPair,ctx){ // この鳴きを適用した仮の手牌に役の芽が無いか(コーチング警告用)
  // review nit(PR#58): 役牌(白發中・自風・場風)のポン/カンはその副露自体が役になるため、
  // 手牌に役の芽が残っていなくても警告しない(mjYakuEyesは手牌のみを見て副露を含まないため個別に判定)
  if((type==='pon'||type==='kan')&&(tile>=31||tile===ctx.seatWind||tile===ctx.roundWind))return false;
  const h=hand.slice();
  if(type==='kan')h[tile]-=3;
  else if(type==='pon')h[tile]-=2;
  else{h[withPair[0]]--;h[withPair[1]]--;}
  return mjYakuEyes(h,ctx).labels.length===0;
}
function mj4CpuDiscardAfterCall(R,s){ // 鳴き直後の打牌(ポン/チーはツモなし・明カンは嶺上ツモ後に呼ぶ)。→{cut,why}
  const p=R.players[s];
  const an=mjAnalyze(p.hand,mj4SafetyView(R,s),
    {threat:mj4Threat(R,s),turn:R.turnNo,seatWind:mj4SeatWind(R,s),roundWind:R.roundWind,numMelds:p.melds.length});
  const cut=an.cands[0].tile;
  if(mj4Discard(R,s,cut)==='ron')return {cut,why:''};
  return {cut,why:an.cands[0].sh===0?'テンパイ！':'手なり'};
}
function mj4Settle(R){ // 局の清算(ゼロサム) → moves[4]。g.results へ局サマリ、kyoku++
  const g=R.g,moves=[0,0,0,0];
  if(R.end&&(R.end.type==='tsumo'||R.end.type==='ron')){
    const s=R.end.seat,v=mj4ScoreValue(R.end.win.han,s===R.dealer);
    if(R.end.type==='ron'){moves[s]+=v;moves[R.end.from]-=v;}
    else{const per=Math.ceil(v/300)*100;moves[s]+=per*3;for(let o=0;o<4;o++)if(o!==s)moves[o]-=per;}
  }else{
    const ten=R.players.map(p=>MJ.shanten(p.hand)<=0);
    const n=ten.filter(Boolean).length;
    R.end={type:'ryuukyoku',tenpai:ten};
    if(n>0&&n<4){ // 標準のノーテン罰符(計3000・ゼロサム): 1人聴牌+3000 / 2人±1500 / 3人+1000
      const get={1:3000,2:1500,3:1000}[n],pay={3:1000,2:1500,1:3000}[4-n];
      for(let i=0;i<4;i++)moves[i]+=ten[i]?get:-pay;
    }
  }
  for(let i=0;i<4;i++)g.scores[i]+=moves[i];
  g.results.push({label:mj4KyokuLabel(g),end:R.end,moves:moves.slice(),dealer:R.dealer});
  g.kyoku++;
  return moves;
}
const mj4Ranking=g=>[0,1,2,3].sort((a,b)=>g.scores[b]-g.scores[a]); // 席順タイブレークは席番

/* ---- 対局後レポート (Phase2: 局ではなく対局全体を採点) ---- */
const MJ_ADJ=[ // 加減点テーブル (S: {log,hintsUsed,wins,dealins,tenpaiRyu})
  {label:'和了ボーナス',pts:6,count:S=>S.wins||0},
  {label:'ほうじゅう',pts:-6,count:S=>S.dealins||0},
  {label:'流局時テンパイ',pts:3,count:S=>S.tenpaiRyu||0},
  {label:'リーチみのがし',pts:-3,count:S=>Math.min(3,S.log.filter(l=>l.couldRiichi&&!l.riichied&&!l.auto).length)},
  {label:'ヒントにたよった',pts:-1,count:S=>Math.min(5,S.hintsUsed||0)},
  // Phase3 押し引き採点: 他家に脅威(リーチ/聴牌気配)がある局面で、危険牌をよけた/押した回数
  {label:'危険牌をよけた',pts:2,count:S=>S.log.filter(l=>l.avoidedDanger).length},
  {label:'危険牌をおした',pts:-2,count:S=>S.log.filter(l=>l.pushedDanger).length},
];
function mjReport(S){
  const judged=S.log.filter(l=>!l.auto);
  const opt=judged.filter(l=>l.kind==='perfect').length;
  let sc=judged.length?judged.reduce((a,l)=>a+l.tscore,0)/judged.length:70;
  const adj=[];
  for(const a of MJ_ADJ){const n=a.count(S);
    if(n){adj.push({label:a.label,pts:a.pts*n});sc+=a.pts*n;}}
  sc=clamp(Math.round(sc),0,100);
  const worst=judged.filter(l=>l.kind!=='perfect')
    .sort((a,b)=>a.tscore-b.tscore).slice(0,4);
  return {score:sc,rank:mjRankFor(sc),opt,total:judged.length,adj,worst,
    optRate:judged.length?opt/judged.length:1};
}
/* 成長トラッキング: 直近対局から弱点を1つ提案 */
const MJ_WEAK=[
  {hit:h=>h.avgOpt<0.45,label:'きるまえに「うけいれ何枚?」をくらべるクセをつけよう'},
  {hit:h=>h.lateRi>=2,label:'テンパイしたら まずリーチをけんとうしよう'},
  {hit:h=>h.dealin>=2,label:'リーチには 現物→スジ のじゅんでおりよう'},
  {hit:()=>true,label:'この調子！SSランクをめざそう'},
];
function mjWeakness(hist){
  const h5=hist.slice(-5);
  if(!h5.length)return MJ_WEAK[MJ_WEAK.length-1].label;
  const agg={avgOpt:h5.reduce((a,x)=>a+x.opt,0)/h5.length,
    lateRi:h5.reduce((a,x)=>a+(x.lateRi||0),0),
    dealin:h5.reduce((a,x)=>a+(x.dealin||0),0)};
  for(const w of MJ_WEAK)if(w.hit(agg))return w.label;
}

/* 8索は実物同様アーチ型(上下2段が弓なりに湾曲)。他の数字はMJ_PIPSの汎用配置を流用 */
const MJ_SOU_PIPS_8=[[.22,.32],[.41,.19],[.59,.19],[.78,.32],[.22,.68],[.41,.81],[.59,.81],[.78,.68]];
function mjRenderTile(g,t,x,y,w,h,o){
  o=o||{};
  g.save();
  if(o.ghost)g.globalAlpha*=.38;
  const r=Math.max(3,w*.16),gray=!!o.gray;
  if(gray)g.globalAlpha*=.72; // #feedback2 4件目: ツモぎりを色だけでなく実際に「うすく」する
  const face=o.sel?'#fff3c4':gray?'#d9dbde':'#fdfcf4';
  rr(g,x,y+h*.06,w,h*.94,r);g.fillStyle=gray?'#9aa0a8':'#c9bfae';g.fill(); // 厚み
  const fh=h*.94;
  rr(g,x,y,w,fh,r);
  g.fillStyle=face;g.fill();
  g.strokeStyle=o.sel?'#e5a000':gray?'#8a9098':'#b0a48e';g.lineWidth=o.sel?2:1;g.stroke();
  if(o.back){rr(g,x+w*.12,y+fh*.12,w*.76,fh*.76,r*.7);g.fillStyle='#2c6e49';g.fill();g.restore();return;}
  const cx=x+w/2;
  const ink=c=>gray?'#7d838d':c; // グレーアウト時は図柄も灰色化
  if(t>=MJ.HONOR){ // 字牌 (白=青枠の空白)
    if(t===31){
      g.strokeStyle=ink('#3f6fb0');g.lineWidth=Math.max(1.2,w*.06);
      rr(g,x+w*.2,y+fh*.16,w*.6,fh*.68,r*.5);g.stroke();
    }else{
      g.fillStyle=ink(t===33?'#c0392b':t===32?'#1d7a3d':'#2c3242');
      g.font=`800 ${fh*.56}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
      g.fillText(MJ.NAMES[t],cx,y+fh*.53);
    }
  }else{
    const su=t/9|0,n=t%9+1;
    if(su===0){ // 萬子: 漢数字(五は赤)+萬
      g.textAlign='center';g.textBaseline='middle';
      g.fillStyle=ink(n===5?'#c0392b':'#2c3242');
      g.font=`800 ${fh*.42}px ${FONT}`;g.fillText(MJ_KAN[n-1],cx,y+fh*.3);
      g.fillStyle=ink('#b03030');
      g.font=`800 ${fh*.38}px ${FONT}`;g.fillText('萬',cx,y+fh*.72);
    }else if(su===1){ // 筒子: 丸ピップ (1筒は的の専用デザイン・2-9筒は実物準拠で赤/青/緑を混色)
      if(n===1){
        const R0=w*.3,X=x+w*.5,Y=y+fh*.5;
        g.beginPath();g.arc(X,Y,R0,0,TAU);g.fillStyle=ink(MJ_BLU);g.fill();
        g.beginPath();g.arc(X,Y,R0*.62,0,TAU);g.fillStyle=face;g.fill();
        g.beginPath();g.arc(X,Y,R0*.36,0,TAU);g.fillStyle=ink(MJ_BLU);g.fill();
        g.beginPath();g.arc(X,Y,R0*.16,0,TAU);g.fillStyle=ink(MJ_RED);g.fill();
      }else{
        const R0=n<=4?w*.135:w*.105,cols=MJ_PIN_COLORS[n-2];
        MJ_PIPS[n-1].forEach(([ux,uy],i)=>{
          const X=x+w*ux,Y=y+fh*(uy*.84+.08);
          const col=ink(cols[i]);
          g.beginPath();g.arc(X,Y,R0,0,TAU);g.fillStyle=col;g.fill();
          g.beginPath();g.arc(X,Y,R0*.5,0,TAU);g.fillStyle=face;g.fill();
          g.beginPath();g.arc(X,Y,R0*.22,0,TAU);g.fillStyle=col;g.fill();
        });
      }
    }else{ // 索子: 竹スティック (1索=イーソウは鳥の専用デザイン・基本は緑一色で5索中央/9索中央列のみ赤の実物準拠)
      if(n===1){
        g.fillStyle=ink(MJ_GRN);
        g.beginPath();g.ellipse(cx,y+fh*.58,w*.27,fh*.3,0,0,TAU);g.fill(); // 胴体
        g.beginPath();g.ellipse(cx,y+fh*.25,w*.16,fh*.15,0,0,TAU);g.fill(); // 頭
        g.fillStyle=ink(MJ_RED);
        g.beginPath();g.moveTo(cx-w*.02,y+fh*.13);g.lineTo(cx+w*.12,y+fh*.17);g.lineTo(cx-w*.02,y+fh*.21);g.closePath();g.fill(); // くちばし
        g.fillStyle=ink('#e8c530'); // 黄: 胸元の差し色(小さめに留めて緑の胴体を主体に保つ)
        g.beginPath();g.ellipse(cx,y+fh*.62,w*.09,fh*.1,0,0,TAU);g.fill();
        g.strokeStyle=ink('#0d3d22');g.lineWidth=Math.max(1,w*.035);g.lineCap='round';
        g.beginPath();g.moveTo(cx-w*.2,y+fh*.5);g.quadraticCurveTo(cx-w*.34,y+fh*.68,cx-w*.15,y+fh*.88);g.stroke(); // 尾羽
        g.fillStyle='rgba(255,255,255,.55)';
        g.beginPath();g.arc(cx-w*.06,y+fh*.23,w*.035,0,TAU);g.fill(); // 目のハイライト
      }else{
        const SW=w*.15,SH=fh*.21,cols=MJ_SOU_COLORS[n-2];
        const pips=n===8?MJ_SOU_PIPS_8:MJ_PIPS[n-1]; // 8索は実物同様アーチ型の専用配置
        pips.forEach(([ux,uy],i)=>{
          const X=x+w*ux,Y=y+fh*(uy*.84+.08);
          g.fillStyle=ink(cols[i]);
          rr(g,X-SW/2,Y-SH/2,SW,SH,SW*.4);g.fill();
          g.fillStyle='rgba(255,255,255,.55)';g.fillRect(X-SW/2,Y-SH*.09,SW,SH*.18);
        });
      }
    }
  }
  g.restore();
}

    if(!MJ_SPEED[speed])speed='normal';
    let lastDiscSeat=-1,discHiT=0; // 直近の打牌ハイライト(1秒)
    const TW=27,TH=44,HX=8,HY=576;
    const RW=22,RH=28;                       // 自河 (6枚×4段・+N省略)
    const OW=14,OH=19;                       // 他家の河 (ミニ)
    const LP={x:W/2-105,y:330,w:210,h:214};  // ルーペ(Phase3で危険牌コーチング1行ぶん高さ追加)
    const FELT=(()=>{ // 卓 (フェルト+木目縁)。生成1回
      const c=document.createElement('canvas');c.width=W;c.height=H;
      const f=c.getContext('2d');
      const gr=f.createRadialGradient(W/2,H*.42,60,W/2,H*.5,H*.8);
      gr.addColorStop(0,'#2f7d4e');gr.addColorStop(1,'#1b5232');
      f.fillStyle=gr;f.fillRect(0,0,W,H);
      const rnd=mulberry32(7);
      f.globalAlpha=.05;
      for(let i=0;i<1600;i++){f.fillStyle=rnd()<.5?'#000':'#fff';f.fillRect(rnd()*W,rnd()*H,1.4,1.4);}
      f.globalAlpha=1;
      f.strokeStyle='#5d3f22';f.lineWidth=18;rr(f,3,3,W-6,H-6,22);f.stroke();
      f.strokeStyle='#7a5631';f.lineWidth=9;rr(f,8,8,W-16,H-16,17);f.stroke();
      f.strokeStyle='rgba(255,235,200,.18)';f.lineWidth=2;rr(f,11,11,W-22,H-22,15);f.stroke();
      f.strokeStyle='rgba(0,0,0,.3)';f.lineWidth=2;rr(f,17,17,W-34,H-34,12);f.stroke();
      return c;})();
    const BTNS=[
      {id:'hint',x:8,y:624,w:126,h:44,label:()=>hintOn?'💡ヒント中':'💡ヒント',
        on:()=>{if(!hintOn){hintOn=true;G.hintsUsed++;A.pop();}else{hintOn=false;A.tick();}}},
      {id:'riichi',x:142,y:624,w:126,h:44,label:()=>riichiArm?'リーチやめる':'リーチ！',
        // #Phase4b: 副露済み(鳴いた後)はリーチ不可(mj4CpuTurnの制約と同じ)
        able:()=>mjPhase==='select'&&!R.players[0].riichi&&R.players[0].melds.length===0&&an&&an.cands.some(c=>c.sh===0),
        on:()=>{riichiArm=!riichiArm;sel=-1;A.go();}},
      {id:'ted',x:276,y:624,w:136,h:44,label:()=>'🌗ツモぎり:'+(tedashiShow?'うすく':'同じ'),
        on:()=>{tedashiShow=!tedashiShow;store.set('pgp2_mj_tedashi',tedashiShow?'1':'0');A.tick();}},
      {id:'read',x:8,y:674,w:404,h:40,label:()=>readOn?'🔍読みオフ':'🔍よみ(危険牌をみる)',
        on:()=>{readOn=!readOn;A.tick();}},
    ];
    const me=()=>R.players[0];
    const handTiles=()=>{const o=[];for(let t=0;t<34;t++)for(let k=0;k<me().hand[t];k++)o.push(t);return o;};
    const gameStarted=()=>G.kyoku>0||R.players.some(p=>p.river.length>0);
    function callButtonsList(){ // #Phase4b: callChoice中に表示するボタン一覧(利用可能なものだけ・スルーは常時)
      if(!callChoice)return [];
      const list=[];
      if(callChoice.pon)list.push({type:'pon',label:'ポン'});
      if(callChoice.kan)list.push({type:'kan',label:'カン'});
      if(callChoice.chi)list.push({type:'chi',label:'チー'});
      list.push({type:'skip',label:'スルー'});
      const n=list.length,bw=Math.min(150,(W-16-(n-1)*8)/n),bx0=(W-(bw*n+8*(n-1)))/2;
      list.forEach((b,i)=>{b.x=bx0+i*(bw+8);b.y=624;b.w=bw;b.h=44;});
      return list;
    }

    function startMyTurn(){ // 自分の番: 壁チェック→ツモ→分析
      if(R.wall.length<=14){endKyoku();return;}
      const d=mj4Draw(R,0);
      drawn=d.tile;sel=-1;riichiArm=false;
      if(R.end){endKyoku();return;}
      an=mjAnalyze(me().hand,mj4SafetyView(R,0),
        {threat:mj4Threat(R,0),turn:R.turnNo,seatWind:mj4SeatWind(R,0),roundWind:R.roundWind});
      if(me().riichi){doDiscard(drawn,true);return;} // リーチ後ツモぎり
      mjPhase='select';
    }
    function doDiscard(t,auto){
      const chosen=an.cands.find(c=>c.tile===t);
      const kind=mjJudgeKind(chosen,an);
      const couldRiichi=!me().riichi&&an.cands.some(c=>c.sh===0);
      if(!auto)ctx.judge(kind,HX+7+handTiles().indexOf(t)*(TW+2),HY,
        kind==='perfect'?{sub:'さいてき！'}:undefined);
      const pushEval=mj4PushEval(R,t,an); // Phase3 押し引き採点: 危険牌を押した/よけたか(脅威なしならnull)
      G.log.push({n:R.turnNo,kyoku:mj4KyokuLabel(G),cut:t,kind,auto:!!auto,
        tscore:mjTurnScore(chosen,an),best:an.cands[0].tile,threat:mj4Threat(R,0),
        couldRiichi,riichied:riichiArm||!!me().riichi,
        myReason:mjReason(chosen,an,mj4Threat(R,0)),
        bestReason:mjReason(an.cands[0],an,mj4Threat(R,0)),
        pushedDanger:!!(pushEval&&pushEval.pushedDanger),avoidedDanger:!!(pushEval&&pushEval.avoidedDanger)});
      if(riichiArm&&chosen.sh===0){me().riichi=R.turnNo;A.fever();}
      riichiArm=false;sel=-1;
      const discRes=mj4Discard(R,0,t);
      lastDiscSeat=0;discHiT=1;
      if(discRes==='ron'){endKyoku();return;}
      mj4NextSeat(R,0);
      fb={chosen,an,auto:!!auto};
      mjPhase='fb';timer=auto?.5:0;
    }
    // #Phase4a/4b共通: discarderSeatの捨て牌tに対し、CPU間の鳴みを判定・適用するか、無ければ通常進行(次の家へ)
    function tryCpuCallOrAdvance(discarderSeat,t){
      const call=mj4CallCandidates(R,discarderSeat,t);
      if(call&&mj4WantsCall(R,call)){
        mj4ApplyCall(R,call);
        callInfo={seat:call.seat,type:call.type,from:call.from};
        // review must-fix(PR#57): 明カンは嶺上牌相当を1枚ツモしてから打牌(手牌枚数を保つ・嶺上ツモ和了も判定)
        if(call.type==='kan'){
          mj4Draw(R,call.seat);
          if(R.end){aiInfo={seat:call.seat,why:''};lastDiscSeat=call.seat;discHiT=1;endKyoku();return;}
        }
        const cr=mj4CpuDiscardAfterCall(R,call.seat); // 鳴いた家は即座に打牌
        aiInfo={seat:call.seat,why:cr.why};
        lastDiscSeat=call.seat;discHiT=1;
        A.bad(); // 鳴き演出音(リーチ宣言と同じ効果音を流用)
        if(R.end){endKyoku();return;}
        const nxc=mj4NextSeat(R,call.seat); // 手番は鳴いた家からの通常進行を再開(飛ばされた家はこの巡パスのまま)
        mjPhase='ai';
        if(nxc===0){mjPhase='draw';timer=MJ_SPEED[speed].trans;}
        else{aiSeat=nxc;timer=MJ_SPEED[speed].seat;}
        return;
      }
      const nx=mj4NextSeat(R,discarderSeat);
      mjPhase='ai';
      if(nx===0){mjPhase='draw';timer=MJ_SPEED[speed].trans;} // 次は自分
      else{aiSeat=nx;timer=MJ_SPEED[speed].seat;}
    }
    function stepAi(){ // AI1席ずつ進める (speed設定の秒数ずつ見せる)
      const s=aiSeat;
      if(R.wall.length<=14){endKyoku();return;}
      const r=mj4CpuTurn(R,s);
      aiInfo={seat:s,why:r.why||''};
      callInfo=null;
      if(r.cut!==undefined){lastDiscSeat=s;discHiT=1;} // 打牌があった時だけハイライト(ツモ和了時はcutなし)
      if(R.end){endKyoku();return;}
      if(r.why==='リーチ！')A.bad();
      if(r.cut!==undefined){
        // #Phase4b: 自分に鳴み選択肢があれば先にたずねる(数秒タイムアウト・未応答はスルー)
        const pOpts=mj4PlayerCallOptions(R,s,r.cut);
        if(pOpts){callChoice={...pOpts,timeLeft:CALL_TIMEOUT};mjPhase='callChoice';return;}
        tryCpuCallOrAdvance(s,r.cut); // #Phase4a: 他家同士の鳴み(自分=seat0の捨て牌には反応しない)
        return;
      }
      const nx=mj4NextSeat(R,s);
      if(nx===0){mjPhase='draw';timer=MJ_SPEED[speed].trans;} // 次は自分
      else{aiSeat=nx;timer=MJ_SPEED[speed].seat;}
    }
    function resolvePlayerCall(type){ // #Phase4b: 鳴み選択の確定(pon/chi/kan/skip)
      const cc=callChoice;callChoice=null;
      // review must-fix(PR#58)防御: リーチ後は鳴み選択自体をmj4PlayerCallOptionsで出さないが、
      // 万一の状態不整合に備えresolve側でも二重に拒否する
      if(type!=='skip'&&R.players[0].riichi){tryCpuCallOrAdvance(cc.from,cc.tile);return;}
      if(type==='skip'){tryCpuCallOrAdvance(cc.from,cc.tile);return;} // スルー→通常どおりCPU鳴み判定へ
      const call={seat:0,type,tile:cc.tile,from:cc.from};
      if(type==='chi')call.with=cc.chi[0]; // #Phase4b簡略化: 複数チー候補時は最初の組を採用
      mj4ApplyCall(R,call);
      callInfo={seat:0,type,from:cc.from};
      if(type==='kan'){
        mj4Draw(R,0);
        if(R.end){endKyoku();return;}
      }
      an=mjAnalyze(me().hand,mj4SafetyView(R,0),
        {threat:mj4Threat(R,0),turn:R.turnNo,seatWind:mj4SeatWind(R,0),roundWind:R.roundWind,numMelds:me().melds.length});
      sel=-1;drawn=-1;riichiArm=false;A.go(); // review nit(PR#58): drawnをリセットし旧ツモ牌位置の誤表示を防ぐ
      mjPhase='select';
    }
    function endKyoku(){
      kyokuMoves=mj4Settle(R);
      mjPhase='kyokuEnd';sel=-1;
      const e=G.results[G.results.length-1].end;
      const msg=e.type==='tsumo'?(e.seat===0?'ツモ和了！🎉':MJ4_NAMES[e.seat]+'のツモ')
        :e.type==='ron'?(e.seat===0?'ロン和了！🎉':(e.from===0?'ほうじゅう…！💥':MJ4_NAMES[e.seat]+'のロン'))
        :'流局';
      banner(msg,{small:true});
      (e.seat===0&&(e.type==='tsumo'||e.type==='ron'))?A.record():(e.type==='ron'&&e.from===0)?A.miss():A.ok();
    }
    function nextKyoku(){
      if(G.kyoku>=G.maxKyoku){finishGame();return;}
      R=mj4RoundNew(G);
      an=null;fb=null;aiSeat=R.turn===0?0:R.turn;
      if(R.turn===0){mjPhase='draw';timer=MJ_SPEED[speed].init;}
      else{mjPhase='ai';aiSeat=R.turn;timer=MJ_SPEED[speed].seat;}
    }
    function finishGame(){
      rep=mjReport({log:G.log,hintsUsed:G.hintsUsed,
        wins:G.results.filter(x=>x.end.seat===0&&(x.end.type==='tsumo'||x.end.type==='ron')).length,
        dealins:G.results.filter(x=>x.end.type==='ron'&&x.end.from===0).length,
        tenpaiRyu:G.results.filter(x=>x.end.type==='ryuukyoku'&&x.end.tenpai[0]).length});
      const rank=mj4Ranking(G).indexOf(0)+1;
      rep.rank4=rank;rep.finalScore=G.scores[0];page=0;
      statsRecordMatch('mahjong',rank===1?'win':'lose'); // #backlog1 きろく: 1局ごとでなく対局(半荘/東風)全体の最終順位で記録
      let hist=[];try{hist=JSON.parse(store.get('pgp2_mj_hist','[]'))||[];}catch(e){}
      hist.push({r:rep.rank[1],opt:rep.optRate,
        lateRi:G.log.filter(l=>l.couldRiichi&&!l.riichied&&!l.auto).length?1:0,
        dealin:G.results.some(x=>x.end.type==='ron'&&x.end.from===0)?1:0});
      store.set('pgp2_mj_hist',JSON.stringify(hist.slice(-20)));
      rep.weak=mjWeakness(hist);rep.hist=hist;
      mjPhase='report';
      banner(rank+'位！ コーチランク'+rep.rank[1],{small:true});
    }
    // 初期: 東1局は親=seat0 → 自分から
    mjPhase='draw';timer=MJ_SPEED[speed].init;

    const tile=(g,x,y,w,h,t,o)=>mjRenderTile(g,t,x,y,w,h,o&&o.dim?Object.assign({ghost:true},o):o);
    function river(g,list,x0,y0,w,h,cap,hiLast){ // 1行6枚・最新cap枚(+N)。hiLast=直近の1枚を1秒ハイライト
      const px=w+2,py=h+3,over=list.length-cap,show=over>0?list.slice(-cap):list;
      if(over>0)outlinedText(g,'+'+over,x0-6,y0+10,10,'#ffd77a','#12331f',3,1,'right');
      show.forEach((e,i)=>tile(g,x0+(i%6)*px,y0+((i/6)|0)*py,w,h,e.t,
        hiLast&&i===show.length-1?{sel:true}:tedashiShow&&!e.ted?{gray:true}:null));
    }
    function drawLoupe(g){
      rr(g,LP.x,LP.y,LP.w,LP.h,14);
      g.fillStyle='rgba(253,252,244,.97)';g.fill();

        else if(me().melds.length){ // #Phase4b: 自分の副露牌も相手パネルと同様にミニ表示

        if(mjPhase!=='report'&&mjPhase!=='kyokuEnd'){

              const idx=an.cands.indexOf(keep);
              if(idx<3)text(g,['◎','○','△'][idx],tx+TW/2,ty-9,13,['#e5a000','#7a9a3a','#5a86ad'][idx],'center');

              :b.id==='read'?(readOn?'#e57373':'#cfd8dc'):'#ffd77a';g.fill();

        if(mjPhase==='fb'&&fb&&!fb.auto){fb=null;mjPhase='ai';aiSeat=1;timer=MJ_SPEED[speed].trans;A.tick();return;}
        if(mjPhase==='kyokuEnd'){nextKyoku();A.pop();return;}
        if(mjPhase==='report'){reportTap(x,y);return;}
        if(!gameStarted()&&y>=144&&y<=176&&x>=W/2-102&&x<=W/2-2){ // 東風/半荘トグル (開始前のみ)

          an=null;fb=null;sel=-1;drawn=-1;riichiArm=false; // 配り直した局に合わせて手番状態も戻す
          mjPhase='draw';timer=MJ_SPEED[speed].init;
          banner(hanchan?'半荘(8局)にきりかえ・配りなおし':'東風(4局)にきりかえ・配りなおし',{small:true});
          A.pop();return;

        if(y>=144&&y<=176&&x>=(gameStarted()?W/2-70:W/2+2)&&x<=(gameStarted()?W/2+70:W/2+102)){ // 速度切替(いつでも可)
          speed=MJ_SPEED_ORDER[(MJ_SPEED_ORDER.indexOf(speed)+1)%MJ_SPEED_ORDER.length];
          store.set('pgp2_mj_speed',speed);A.tick();return;

        for(const b of BTNS)
          if(!(b.able&&!b.able())&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.on();return;}

        if(y>=HY-14&&y<=HY+TH+6){
          const tiles=handTiles();

          if(i>=0&&i<tiles.length){

              if(!c||c.sh!==0){A.bad();return;}}
            if(sel===t)doDiscard(t,false);
            else{sel=t;A.tick();}

          }

        if(sel>=0){sel=-1;A.tick();}
      },
      onFlick(f){
        if(mjPhase==='select'&&sel>=0&&f.dy<-40&&Math.abs(f.dy)>Math.abs(f.dx))doDiscard(sel,false);
      },
      onKey(code,down){

      destroy(){},

    function drawReport(g,px,py){

    function reportTap(x,y){
      const px=20,py=192;
      if(y>=py+228&&y<=py+272){

        if(x>=px+220&&x<=px+256){page=1;A.tick();return;}
        if(x>=px+270){ctx.finishGame({banner:rep.rank4+'位！ コーチランク'+rep.rank[1]});return;}

  }

/* ---- セルフテスト (?selftest で実行) ---- */
function runMahjongTests(){
  const {ck,done}=makeTest('mahjong');
  // シャンテン数: 既知ベクタ
  for(const[s,want]of[
    ['123m456p789s11222z',-1],['123m456p789s1122z',0],
    ['19m19p19s1234567z',0],['19m19p19s12345677z',-1],
    ['1122334455667m',0],['1112345678999m',0],
    ['147m258p369s1234z',6],['1199m1199p1199s1z',0]])
    ck('sh:'+s,MJ.shanten(MJ.parse(s))===want);
  // 受け入れ: 一貫性 (挙げた牌は必ずシャンテンが進み、他は進まない)
  {const rng=mulberry32(42);
   for(let n=0;n<12;n++){
     const wall=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);
     for(let i=wall.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[wall[i],wall[j]]=[wall[j],wall[i]];}
     const h=new Array(34).fill(0);
     for(let i=0;i<13;i++)h[wall[i]]++;
     const u=MJ.ukeire(h,null),s0=u.shanten;let good=true;
     for(let t=0;t<34;t++){
       if(h[t]>=4)continue;
       h[t]++;
       if((MJ.shanten(h)<s0)!==u.tiles.some(x=>x.tile===t))good=false;
       h[t]--;
     }
     ck('ukeire#'+n,good);
   }}
  // 役判定 (テーブル駆動)
  const yk=(hand,opts)=>MJ.judgeYaku(Object.assign({hand:MJ.parse(hand),menzen:true,
    riichi:false,tsumo:false,seatWind:27,roundWind:27,winTile:-1},opts))
    .yaku.map(y=>y.name).sort().join(',');
  ck('yaku:pinfu+tanyao',yk('234567m234p56788s',{winTile:24})===['断幺九','平和'].sort().join(','));

/* ============================================================
   ゲームF: チキンレース ～崖っぷちの勇気～ (versus / 対CPU・スコア無し)
   ------------------------------------------------------------
   コア非依存: ラウンド進行 / カウントダウン(3-2-1-GO) / 勝敗 / もう一度 を
   すべて canvas 内で完結 (ox・gomoku と同じ type:'versus' の作法)。
   物理は reference 960x540 系の world 座標で計算し、実canvas(縦 420x740)へ
   SX=W/960 で比率描画する → 仕様の CARS/SLOPES 物理定数をそのまま使える。
   純関数 stopDist / predictStop / roundScore / judgeRound / judgeMatch を
   module スコープに分離 (?selftest で runChickenTests / grip>g と境界を検証)。
   ============================================================ */
// 走路レイアウト (world / reference 960x540 基準)。走路長 ≒ EDGE-START-CAR_W = 648
const CHK_START_X=52, CHK_EDGE_X=796, CHK_CAR_W=96, CHK_CAR_H=46;
// 車種: 最高速 max / 加速 accel / 制動グリップ grip。停止距離 ≒ max^2/(2*grip)
const CARS={
  compact:{name:"コンパクト",trait:"扱いやすい",        max:5.2,accel:0.150,grip:0.085},
  dump:   {name:"ダンプ",    trait:"重く制動が長い",    max:6.0,accel:0.105,grip:0.050},
  sports: {name:"スポーツ",  trait:"速いが止まりにくい",max:7.0,accel:0.175,grip:0.072},
};
// 坂: g=重力(+で崖側) / tilt=見た目の傾き(rad)。必ず grip>g (下りでも止まれる)
const SLOPES={
  flat:{name:"平地",  icon:"➖",g: 0.000,tilt: 0.00 },
  up:  {name:"登り坂",icon:"⛰️",g:-0.026,tilt:-0.085}, // 止まりやすいが加速鈍く止まりすぎやすい
  down:{name:"下り坂",icon:"⤵️",g: 0.020,tilt: 0.10 }, // 止まりにくい→早めにオフ
};
// 3ラウンド固定 (後でランダム化も可)
const ROUND_PLAN=[
  {car:"compact",slope:"flat"}, // R1: 基準
  {car:"dump",   slope:"up"  }, // R2: 鈍い+止まりやすい → 攻めないと届かない
  {car:"sports", slope:"down"}, // R3: 速い+滑る → かなり手前で離す
];
const DIFF={
  easy:  {gap:44,spread:18,bias:[1.02,1.20]}, // よわい: 崖に寄せない+慎重
  normal:{gap:27,spread:14,bias:[0.96,1.12]},
  hard:  {gap:14,spread:8, bias:[0.90,1.06]}, // つよい: 崖に寄せる+攻め
};
// ── 純関数 (テスト対象) ──────────────────────────────────────
// 停止距離: アクセルオフ時の実効減速 = grip - g (>0 を保証)。停止距離 = v^2/(2*decel)
function stopDist(speed,grip,g){const d=Math.max(0.0001,grip-g);return speed*speed/(2*d);}
// CPU 予測停止距離 (bias<1=過信で時々自滅, >1=慎重)
function predictStop(speed,car,g,bias){const d=Math.max(0.02,car.grip-g);return speed*speed/(2*d)*bias;}
// ラウンド得点(近さ): 落下=0 / 崖0px=100 / 200px以遠=0
function roundScore(gap,fell){return fell?0:Math.round(100*(1-Math.min(gap,200)/200));}
// ラウンド勝者: 'p'|'c'|'draw'  (p,c = {fell,gap})。両落下=引分 / 片落下=相手 / 差<1.5px=引分
function judgeRound(p,c){
  if(p.fell&&c.fell)return'draw';
  if(p.fell)return'c'; if(c.fell)return'p';
  if(Math.abs(p.gap-c.gap)<1.5)return'draw';
  return p.gap<c.gap?'p':'c';
}
// マッチ勝者: 勝ち数 → 同数なら近さ得点合計 → それも同じなら draw
function judgeMatch(results){
  let pw=0,cw=0,ps=0,cs=0;
  for(const r of results){
    if(r.winner==='p')pw++; else if(r.winner==='c')cw++;
    ps+=r.pScore; cs+=r.cScore;
  }
  if(pw!==cw)return pw>cw?'p':'c';
  if(ps!==cs)return ps>cs?'p':'c';
  return'draw';
}

  ck(judgeRound({fell:true,gap:0},{fell:false,gap:50})==='c','片落下→相手勝ち(c)');
  ck(judgeRound({fell:false,gap:50},{fell:true,gap:0})==='p','片落下→自分勝ち(p)');
  ck(judgeRound({fell:true,gap:0},{fell:true,gap:0})==='draw','両落下→引分');
  ck(judgeRound({fell:false,gap:10},{fell:false,gap:40})==='p','近い方p');
  ck(judgeRound({fell:false,gap:40},{fell:false,gap:10})==='c','近い方c');
  ck(judgeRound({fell:false,gap:10},{fell:false,gap:11})==='draw','差<1.5=引分');
  // judgeMatch
  ck(judgeMatch([{winner:'p',pScore:1,cScore:0},{winner:'p',pScore:1,cScore:0},{winner:'c',pScore:0,cScore:1}])==='p','勝ち数多いp');
  ck(judgeMatch([{winner:'p',pScore:90,cScore:10},{winner:'c',pScore:10,cScore:90},{winner:'draw',pScore:50,cScore:40}])==='p','勝ち同数→得点合計p');
  ck(judgeMatch([{winner:'draw',pScore:50,cScore:50}])==='draw','完全同→引分');
  return done();
}
registerGame({
  id:'chicken', emoji:'🏁', title:'チキンレース',
  // 選択画面アイコン: チェッカーフラッグ🏁 + 鶏🐔 でチキンレースと分かるように (小サイズでも判別)
  iconHtml:`<span style="display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:6.8cqw">🏁<span style="margin-left:-1.4cqw">🐔</span></span>`,
  desc:'崖ギリギリで止めろ！CPUとの度胸試し',
  color:'#ff8a5c', type:'versus',   // duration は付けない (タイマー無し・3R対戦)
  howto:[
    ['🚗','アクセル長押しで加速、離すと慣性で減速'],
    ['🛑','崖ギリギリで止めるほど高得点！越えたら負け'],
    ['🏆','3ラウンド勝負。毎回 車種と坂が変わる'],
  ],
  create(ctx){
    const A=ctx.audio;
    const SX=W/960;                 // world(960幅) → 実canvas幅 への比率
    const wx=x=>x*SX;               // world x → screen x
    const EDGE_SX=wx(CHK_EDGE_X), CARW_S=CHK_CAR_W*SX;
    const COLP={car:'#ff5c6c',dark:'#a82a37',glow:'#ff97a2'}; // あなた=赤系
    const COLC={car:'#2fd6dc',dark:'#147b80',glow:'#86f2f6'}; // CPU=シアン系
    const LANE_C=326, LANE_P=452;   // レーン中心Y (縦canvas: 奥=CPU上 / 手前=Player下)
    // タイトルの難易度ボタン (タイトル局面のみ当たり判定)
    const DIFF_KEYS=['easy','normal','hard'], DIFF_LBL={easy:'よわい',normal:'ふつう',hard:'つよい'};
    const DB_W=104,DB_H=58,DB_GAP=12,DB_Y=452;
    const DB_X0=(W-(DB_W*3+DB_GAP*2))/2;
    const diffBtns=DIFF_KEYS.map((k,i)=>({k,x:DB_X0+i*(DB_W+DB_GAP),y:DB_Y,w:DB_W,h:DB_H}));
    // アクセルペダル (見た目。run中は画面どこでも加速＝ペダルは押下状態を表示)
    const PEDAL={x:30,y:600,w:W-60,h:118,r:26};

    let diff=store.get('pgp2_chk_diff','normal'); if(!DIFF[diff])diff='normal';
    let stPhase='title';            // title|count|run|rresult|mresult
    let round=0, results=[];
    let matchIsRec=false;   // #13 直近マッチでベスト更新したか (結果画面の「しんきろく！」表示用)
    let pCar=null, cCar=null, held=false, keyHeld=false; // held=ポインタ押下 / keyHeld=Space
    let cdT=0, cdIdx=-1, t=0, acc=0, resolveT=0, shakeT=0, flashT=0, runT=0;
    let skyGrad=null, abyssGrad=null;                    // 定数グラデはキャッシュ(毎フレーム再生成しない)
    const parts=new Particles();

    function mkCar(key){
      return {key,x:CHK_START_X,speed:0,moved:false,fell:false,fallY:0,fallVy:0,
              settled:false, gap:CHK_EDGE_X-(CHK_START_X+CHK_CAR_W)};
    }
    const planDef=()=>CARS[ROUND_PLAN[round].car];
    const planSlope=()=>SLOPES[ROUND_PLAN[round].slope];
    // アクセルは run 中のみ有効。ポインタ/Space の物理的な押下状態をそのまま反映
    // → カウントダウン中から押しっぱなしでも GO で即加速する (押し直し不要)
    const accelOn=()=> stPhase==='run' && (held||keyHeld);

    function setupRound(){
      pCar=mkCar('p'); cCar=mkCar('c');
      const D=DIFF[diff];
      cCar.target=Math.max(3, D.gap+rand(-1,1)*D.spread);
      cCar.bias=rand(D.bias[0],D.bias[1]);
      acc=0; resolveT=0; runT=0;
    }
    function beginCountdown(){ stPhase='count'; cdT=0; cdIdx=-1; }
    function startMatch(){ round=0; results=[]; matchIsRec=false; setupRound(); beginCountdown(); }
    function nextRound(){
      if(round>=ROUND_PLAN.length-1){   // 最終ラウンド後 → マッチ結果 (round は範囲内に保つ)
        stPhase='mresult';
        const w=judgeMatch(results);
        // #13 成績: マッチの近さ得点合計(pScore和)を チキンのベストとして記録
        let mps=0;for(const rr of results)mps+=rr.pScore;
        matchIsRec=mps>getInt('pgp2_best_chicken',0);
        if(matchIsRec)store.set('pgp2_best_chicken',String(mps));
        // #backlog1 レビュー対応: showResult()を経由しないためpgp2_plays_chickenもここで個別に加算(他ゲームと同様1試合1回)
        store.set('pgp2_plays_chicken',String(playsOf('chicken')+1));
        statsRecordPlay('chicken',mps); // きろく: 直近10回推移+今週のプレイ日数
        if(w==='p'){A.coin();confetti();vib([30,50,30,50,30]);}
        else if(w==='c'){A.bad();vib([60,40,60]);}
        else A.ok();
      }else{ round++; setupRound(); beginCountdown(); A.pop(); }
    }

    // ── 物理: 1/60 固定ステップ (仕様「毎フレーム x+=speed」を fps非依存に) ──
    function onFall(){ shakeT=Math.max(shakeT,0.45); flashT=0.32; vib([40,60,40]);
      A.tone({f:300,f2:60,type:'square',dur:.45,vol:.2}); A.noise({f:900,f2:120,dur:.5,vol:.18}); }
    function onSettle(){ A.ok(); }
    function stepOne(car,accelOn,def,g){
      if(car.settled)return;
      if(car.fell){ car.fallVy+=0.9; car.fallY+=car.fallVy; return; }
      let a=g;
      if(accelOn)a+=def.accel; else a-=def.grip;
      car.speed=clamp(car.speed+a,0,def.max);
      car.x+=car.speed;
      if(car.speed>0.3)car.moved=true;
      const front=car.x+CHK_CAR_W;
      if(front>CHK_EDGE_X){ car.fell=true; car.fallVy=Math.max(car.speed,3); car.gap=0; onFall(); return; }
      car.gap=CHK_EDGE_X-front;
      if(car.moved&&!accelOn&&car.speed<0.05){ car.settled=true; car.speed=0; onSettle(); }
    }
    function physicsStep(){
      const def=planDef(), g=planSlope().g;
      // CPU: 自分の予測停止距離からアクセルを離す
      let cAccel=false;
      if(!cCar.settled&&!cCar.fell){
        const predicted=predictStop(cCar.speed,def,g,cCar.bias);
        const dist=CHK_EDGE_X-(cCar.x+CHK_CAR_W);
        cAccel=(dist-predicted)>cCar.target && cCar.speed<def.max;
      }
      stepOne(pCar,accelOn(),def,g);
      stepOne(cCar,cAccel,def,g);
    }
    const carDone=c=>c.settled||(c.fell&&c.fallY>300);
    function resolveRound(){
      const p={fell:pCar.fell,gap:pCar.gap}, c={fell:cCar.fell,gap:cCar.gap};
      const winner=judgeRound(p,c);
      results.push({winner,pScore:roundScore(p.gap,p.fell),cScore:roundScore(c.gap,c.fell),
                    pGap:p.gap,cGap:c.gap,pFell:p.fell,cFell:c.fell});
      stPhase='rresult';
      if(winner==='p'){A.fever();vib([30,40,30]);}
      else if(winner==='c'){A.miss();vib([50]);}
      else A.good();
    }

    // ── 描画ヘルパ ──
    const roadY=(centerY,sxPos,tilt)=>centerY+(sxPos-EDGE_SX)*Math.tan(tilt); // 崖端で centerY
    function drawRoad(g,centerY,tilt,nearCol){
      const yL=roadY(centerY,0,tilt), yR=roadY(centerY,EDGE_SX,tilt), bandH=46;
      g.save();
      g.beginPath();
      g.moveTo(0,yL-bandH/2); g.lineTo(EDGE_SX,yR-bandH/2);
      g.lineTo(EDGE_SX,yR+bandH/2); g.lineTo(0,yL+bandH/2); g.closePath();
      g.fillStyle=nearCol; g.fill();
      // センターライン (破線)
      g.strokeStyle='rgba(255,236,180,.5)'; g.lineWidth=2; g.setLineDash([14,12]);
      g.beginPath(); g.moveTo(0,yL); g.lineTo(EDGE_SX,yR); g.stroke(); g.setLineDash([]);
      g.restore();
    }
    // #feedback4 6件目: 車種(コンパクト/ダンプ/スポーツ)ごとに形状から違いが分かるよう描き分ける
    // (性能特性: ダンプ=重量級で背が高く車輪も大きい/スポーツ=低くくさび形+スポイラー/コンパクト=従来の丸みボックス)
    function drawCar(g,car,col,centerY,tilt,carKey){
      const cx=wx(car.x+CHK_CAR_W/2);
      let cy=roadY(centerY,cx,tilt)-13;
      let rot=tilt;
      if(car.fell){ cy+=car.fallY; rot=tilt+Math.min(1.2,car.fallY/120); }
      const w=CARW_S, h=24;
      g.save(); g.translate(cx,cy); g.rotate(rot);
      // スピードライン (加速中・高速)
      if(!car.fell&&car.speed>1.4&&((car.key==='p'&&accelOn())||car.key==='c')){
        g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=2;
        for(let i=0;i<4;i++){const yy=-h/2+4+i*5; g.beginPath();
          g.moveTo(-w/2-6-car.speed*3,yy); g.lineTo(-w/2-2,yy); g.stroke();}
      }
      // 影
      g.save();g.globalAlpha=.25;g.fillStyle='#000';rr(g,-w/2,h/2-3,w,7,4);g.fill();g.restore();
      if(carKey==='dump'){ // ダンプ: 荷台が高く角ばった重量級シルエット・タイヤも大きめ
        g.fillStyle=col.car; rr(g,-w/2,-h/2-6,w*0.66,h+6,3); g.fill(); // 荷台
        g.fillStyle=col.dark; rr(g,w*0.1,-h/2+2,w*0.42,h-2,3); g.fill(); // キャブ側面
        g.fillStyle=col.glow; rr(g,w*0.14,-h/2-4,w*0.28,10,2); g.fill(); // 窓
        g.fillStyle='rgba(20,24,40,.85)'; rr(g,w*0.17,-h/2-2,w*0.22,6,2); g.fill();
        g.fillStyle='#1a1320';
        g.beginPath();g.arc(-w*0.3,h/2+1,6.5,0,TAU);g.fill();
        g.beginPath();g.arc(w*0.32,h/2+1,6.5,0,TAU);g.fill();
      }else if(carKey==='sports'){ // スポーツ: 低く前傾したくさび形+リアスポイラー
        g.beginPath();
        g.moveTo(-w/2,h/2-2); g.lineTo(-w/2+7,-h/2+7); g.lineTo(w*0.12,-h/2+1);
        g.lineTo(w/2-5,-h/2+9); g.lineTo(w/2,h/2-2); g.closePath();
        g.fillStyle=col.car; g.fill();
        g.fillStyle=col.dark; rr(g,-w/2,h/2-4,w,4,2); g.fill(); // 底面
        g.fillStyle=col.glow;
        g.beginPath(); g.moveTo(-w*0.06,-h/2+6); g.lineTo(w*0.24,-h/2+3); g.lineTo(w*0.19,-h/2+9); g.lineTo(-w*0.11,-h/2+9); g.closePath(); g.fill();
        g.fillStyle=col.dark; g.fillRect(-w/2-3,-h/2+3,4,9); // リアスポイラー
        g.fillStyle='#1a1320';
        g.beginPath();g.arc(-w*0.26,h/2,4.2,0,TAU);g.fill();
        g.beginPath();g.arc(w*0.3,h/2,4.2,0,TAU);g.fill();
      }else{ // コンパクト(既定): 丸みのあるボックス型
        g.fillStyle=col.car; rr(g,-w/2,-h/2,w,h,6); g.fill();
        g.fillStyle=col.dark; rr(g,-w/2,h/2-7,w,7,4); g.fill();
        g.fillStyle=col.glow; rr(g,-w*0.18,-h/2-9,w*0.5,12,4); g.fill();
        g.fillStyle='rgba(20,24,40,.85)'; rr(g,-w*0.12,-h/2-7,w*0.4,8,3); g.fill();
        g.fillStyle='#1a1320';
        g.beginPath();g.arc(-w*0.28,h/2,5,0,TAU);g.fill();
        g.beginPath();g.arc(w*0.28,h/2,5,0,TAU);g.fill();
      }
      g.restore();
    }
    function drawBtn(g,b,fill,stroke,label,sub){
      g.save();g.fillStyle=fill;rr(g,b.x,b.y,b.w,b.h,16);g.fill();
      if(stroke){g.lineWidth=3;g.strokeStyle=stroke;rr(g,b.x,b.y,b.w,b.h,16);g.stroke();}
      g.restore();
      outlinedText(g,label,b.x+b.w/2,b.y+b.h/2+(sub?-6:6),18,'#fff','#3a2233',5);
      if(sub)outlinedText(g,sub,b.x+b.w/2,b.y+b.h/2+14,11,'#ffe6d2','#3a2233',3);
    }

    function update(dt){
      t+=dt;

      parts.update(dt);
      if(stPhase==='count'){
        cdT+=dt;
        const idx=Math.floor(cdT/0.62);
        if(idx!==cdIdx){ cdIdx=idx; if(idx<3)A.tick(); else if(idx===3)A.go(); }
        if(cdT>=0.62*3+0.5){ stPhase='run'; }
      }else if(stPhase==='run'){
        acc+=dt; let guard=0;
        while(acc>=1/60 && guard<10){ acc-=1/60; physicsStep(); guard++; }
        if(accelOn()&&!pCar.fell&&!pCar.settled&&pCar.speed>1.2&&Math.random()<0.4){
          const cx=wx(pCar.x),cy=roadY(LANE_P,cx,planSlope().tilt);
          parts.add({x:cx-4,y:cy+6,vx:-rand(30,90),vy:-rand(5,30),grav:120,life:rand(.3,.5),r:rand(2,4),col:'#cfa882'});
        }
        runT+=dt;
        // 安全装置: 入力が無く一度も動かない車があっても必ず決着させる (versusはタイマー無し)
        if(runT>14){ for(const c of [pCar,cCar]) if(!c.settled&&!c.fell){ c.settled=true; c.speed=0; } }
        if(carDone(pCar)&&carDone(cCar)){ resolveT+=dt; if(resolveT>0.45)resolveRound(); }
      }
    }

    function draw(g){
      g.save();
      if(shakeT>0){const s=shakeT*16;g.translate(rand(-s,s),rand(-s,s));}
      // 夕暮れの空 (定数グラデは初回のみ生成してキャッシュ)
      if(!skyGrad){
        skyGrad=g.createLinearGradient(0,0,0,H);
        skyGrad.addColorStop(0,'#241a44'); skyGrad.addColorStop(0.34,'#5a2f63');
        skyGrad.addColorStop(0.52,'#b5476a'); skyGrad.addColorStop(0.62,'#e8743b'); skyGrad.addColorStop(0.7,'#3a2236');
        skyGrad.addColorStop(1,'#161029');
      }
      g.fillStyle=skyGrad; g.fillRect(0,0,W,H);
      // 夕日
      g.save();g.fillStyle='rgba(255,210,120,.9)';g.beginPath();g.arc(W*0.66,250,46,0,TAU);g.fill();
      g.globalAlpha=.25;g.beginPath();g.arc(W*0.66,250,70,0,TAU);g.fill();g.restore();

      const tilt=planSlope().tilt;
      // 路面 (奥=CPU, 手前=Player)。坂で傾けて怖さを演出
      if(stPhase!=='title'){
        drawRoad(g,LANE_C,tilt,'#3a3350');
        drawRoad(g,LANE_P,tilt,'#4a4360');
