/* =========================================================================
   🀄 まーじゃん なぜきり道場 — 打牌理由コーチング (1人用)
   牌表現: int[34] 枚数配列 (0-8:萬 9-17:筒 18-26:索 27-33:東南西北白發中)
   設計方針: シャンテンはスート別メモ化DP / 役・安全度・押し引きは全てテーブル駆動 /
             河の情報は増分更新。if分岐の羅列を避けコード量を圧縮する。
   ========================================================================= */
const MJ=(()=>{
  const HONOR=27;
  const NAMES=(()=>{const n=[];for(const[suf,b]of[['萬',0],['筒',9],['索',18]])
    for(let i=1;i<=9;i++)n[b+i-1]=i+suf;
    ['東','南','西','北','白','發','中'].forEach((z,i)=>n[HONOR+i]=z);return n;})();
  const YAOCHU=(()=>{const y=new Array(34).fill(false);
    [0,8,9,17,18,26].forEach(t=>y[t]=true);
    for(let t=HONOR;t<34;t++)y[t]=true;return y;})();
  function parse(str){ // "123m45p6z"→int[34] (テスト用)
    const h=new Array(34).fill(0);let d=[];
    for(const ch of str){
      if(ch>='1'&&ch<='9')d.push(+ch);
      else{const b={m:0,p:9,s:18,z:HONOR}[ch];if(b!==undefined){d.forEach(x=>h[b+x-1]++);d=[];}}
    }
    return h;
  }
  /* --- シャンテンDP: スート9種ベクトル→(面子,塔子)パレート集合をメモ化。
         手牌が1枚変わっても残り2スート+字牌はキャッシュヒット=実質差分計算 --- */
  const suitMemo=new Map();
  function pPush(list,m,t){
    for(let i=0;i<list.length;i++){const p=list[i];
      if(p[0]>=m&&p[1]>=t)return;
      if(m>=p[0]&&t>=p[1])list.splice(i--,1);
    }
    list.push([m,t]);
  }
  function enumSuit(c,i,out,m,t){
    while(i<9&&c[i]===0)i++;
    if(i>=9){pPush(out,m,t);return;}
    c[i]--;enumSuit(c,i,out,m,t);c[i]++;                                   // 孤立牌として除外
    if(c[i]>=3){c[i]-=3;enumSuit(c,i,out,m+1,t);c[i]+=3;}                  // 刻子
    if(i<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;
      enumSuit(c,i,out,m+1,t);c[i]++;c[i+1]++;c[i+2]++;}                   // 順子
    if(c[i]>=2){c[i]-=2;enumSuit(c,i,out,m,t+1);c[i]+=2;}                  // 対子
    if(i<=7&&c[i+1]>0){c[i]--;c[i+1]--;enumSuit(c,i,out,m,t+1);c[i]++;c[i+1]++;} // 両面/辺張
    if(i<=6&&c[i+2]>0){c[i]--;c[i+2]--;enumSuit(c,i,out,m,t+1);c[i]++;c[i+2]++;} // 嵌張
  }
  function suitPat(c9){
    const key=c9.join('');let v=suitMemo.get(key);
    if(!v){v=[];enumSuit(c9.slice(),0,v,0,0);suitMemo.set(key,v);}
    return v;
  }
  function bestMT(h){ // ブロック数(面子+塔子)≤4 で 2m+t 最大
    const hon=[[0,0]];let hm=0,ht=0;
    for(let i=HONOR;i<34;i++){if(h[i]>=3)hm++;else if(h[i]===2)ht++;}
    hon[0]=[hm,ht];
    let acc=[[0,0]];
    for(const list of[suitPat(h.slice(0,9)),suitPat(h.slice(9,18)),suitPat(h.slice(18,27)),hon]){
      const next=[];
      for(const a of acc)for(const b of list){
        const m=a[0]+b[0];if(m>4)continue;
        pPush(next,m,Math.min(a[1]+b[1],4-m));
      }
      acc=next;
    }
    let best=0;for(const[m,t]of acc)best=Math.max(best,2*m+t);
    return best;
  }
  const shCache=new Map(); // 手牌ハッシュ→シャンテン数
  function shanten(h){
    const key=h.join('');const hit=shCache.get(key);
    if(hit!==undefined)return hit;
    let std=8-bestMT(h);
    for(let hd=0;hd<34;hd++){ // 雀頭を固定して再計算
      if(h[hd]<2)continue;
      h[hd]-=2;std=Math.min(std,7-bestMT(h));h[hd]+=2;
    }
    let pairs=0,kinds=0,yK=0,yP=0;
    for(let i=0;i<34;i++){
      if(h[i]>0){kinds++;if(YAOCHU[i]){yK++;if(h[i]>=2)yP=1;}}
      if(h[i]>=2)pairs++;
    }
    const s=Math.min(std,6-pairs+Math.max(0,7-kinds),13-yK-yP); // 七対子/国士
    shCache.set(key,s);
    return s;
  }
  function ukeire(h,vis){ // 13枚手牌の有効牌: {shanten,tiles:[{tile,left}],count,kinds}
    const s0=shanten(h);const tiles=[];let count=0;
    for(let t=0;t<34;t++){
      const left=4-h[t]-(vis?vis[t]:0);
      if(left<=0)continue;
      h[t]++;
      if(shanten(h)<s0){tiles.push({tile:t,left});count+=left;}
      h[t]--;
    }
    return {shanten:s0,tiles,count,kinds:tiles.length};
  }
  function winTiles(h13){ // 和了牌リスト (聴牌でなければ空)
    const out=[];
    for(let t=0;t<34;t++){
      if(h13[t]>=4)continue;
      h13[t]++;if(shanten(h13)===-1)out.push(t);h13[t]--;
    }
    return out;
  }
  /* --- 和了形分解 (役判定用: 雀頭+面子の全分解と七対子) --- */
  function decompose(h){
    const res=[];
    let pr=0;for(let i=0;i<34;i++)if(h[i]===2)pr++;
    if(pr===7)res.push({chiitoi:true,pair:-1,sets:[]});
    for(let hd=0;hd<34;hd++){
      if(h[hd]<2)continue;
      h[hd]-=2;
      const sets=[];
      (function rec(i){
        while(i<34&&h[i]===0)i++;
        if(i>=34){res.push({pair:hd,sets:sets.slice()});return;}
        if(h[i]>=3){h[i]-=3;sets.push({type:'tri',tile:i});rec(i);sets.pop();h[i]+=3;}
        if(i<HONOR&&i%9<=6&&h[i+1]>0&&h[i+2]>0){
          h[i]--;h[i+1]--;h[i+2]--;sets.push({type:'run',tile:i});rec(i);
          sets.pop();h[i]++;h[i+1]++;h[i+2]++;}
      })(0);
      h[hd]+=2;
    }
    return res;
  }
  /* --- 役テーブル: 宣言的な条件記述子のみ。judgeOne 1関数で全役を評価 --- */
  const YAKU=[
    {name:'リーチ',han:1,menzenOnly:true,flag:'riichi'},
    {name:'門前清自摸和',han:1,menzenOnly:true,flag:'tsumo'},
    {name:'断幺九',han:1,tileTest:t=>!YAOCHU[t]},
    {name:'平和',han:1,menzenOnly:true,pinfu:true},
    {name:'役牌(白)',han:1,tripletOf:31},
    {name:'役牌(發)',han:1,tripletOf:32},
    {name:'役牌(中)',han:1,tripletOf:33},
    {name:'場風牌',han:1,tripletOf:'roundWind'},
    {name:'自風牌',han:1,tripletOf:'seatWind'},
    {name:'七対子',han:2,menzenOnly:true,chiitoi:true},
    {name:'対々和',han:2,setType:'tri'},
    {name:'一盃口',han:1,menzenOnly:true,iipeiko:true},
    {name:'混一色',han:3,suitLimit:'half'},
    {name:'清一色',han:6,suitLimit:'full'},
  ];
  function judgeOne(y,ctx,d){
    if(y.menzenOnly&&!ctx.menzen)return false;
    if(y.flag)return !!ctx[y.flag];
    if(y.chiitoi)return !!d.chiitoi;
    if(d.chiitoi&&(y.pinfu||y.setType||y.iipeiko||y.tripletOf!==undefined))return false;
    if(y.tileTest){for(let t=0;t<34;t++)if(ctx.hand[t]>0&&!y.tileTest(t))return false;return true;}
    if(y.tripletOf!==undefined){
      const tg=typeof y.tripletOf==='number'?y.tripletOf:ctx[y.tripletOf];
      return d.sets.some(s=>s.type==='tri'&&s.tile===tg);
    }
    if(y.setType)return d.sets.every(s=>s.type===y.setType);
    if(y.iipeiko){const r=d.sets.filter(s=>s.type==='run').map(s=>s.tile);
      return r.some((t,i)=>r.indexOf(t)<i);}
    if(y.suitLimit){
      const su=new Set();let hon=false;
      for(let i=0;i<34;i++)if(ctx.hand[i]>0){if(i<HONOR)su.add(i/9|0);else hon=true;}
      return su.size===1&&(y.suitLimit==='full'?!hon:hon);
    }
    if(y.pinfu){
      if(d.sets.length!==4||!d.sets.every(s=>s.type==='run'))return false;
      const p=d.pair;
      if(p>=31||p===ctx.seatWind||p===ctx.roundWind)return false;
      const w=ctx.winTile; // 両面待ち(辺張123の3/789の7を除外)
      return d.sets.some(s=>(w===s.tile&&s.tile%9<=5)||(w===s.tile+2&&s.tile%9>=1));
    }
    return false;
  }
  function judgeYaku(ctx){ // 全分解を試し最大翻の役リスト
    let best={han:0,yaku:[]};
    for(const d of decompose(ctx.hand)){
      const yaku=[];let han=0;
      for(const y of YAKU)if(judgeOne(y,ctx,d)){yaku.push(y);han+=y.han;}
      if(han>best.han)best={han,yaku,decomp:d};
    }
    return best;
  }
  return {HONOR,NAMES,YAOCHU,parse,shanten,ukeire,winTiles,decompose,YAKU,judgeYaku,
    clearCache(){suitMemo.clear();shCache.clear();}};
})();

/* ---- 河の情報 (現物・スジ・壁): 捨て牌1枚ごとの増分更新 ---- */
function mjRiverNew(){return {visible:new Array(34).fill(0),genbutsu:new Array(34).fill(false)};}
function mjSee(S,t){S.visible[t]++;}                 // 見えた牌を数えるだけ O(1)
function mjThreatDiscard(S,t){S.genbutsu[t]=true;mjSee(S,t);} // 警戒対象の捨て牌 O(1)
const mjSuji=(S,t)=>{ // スジ判定: 4切り→1・7 が通りやすい
  const n=t%9,b=t-n,g=k=>k>=0&&k<=8&&S.genbutsu[b+k];
  if(n<=2)return g(n+3);
  if(n>=6)return g(n-3);
  return g(n-3)&&g(n+3); // 4-6は中スジ(両側必要)
};
const mjWallCnt=(S,h,t)=>4-S.visible[t]-h[t];        // 自分から見えない残り枚数
const mjNoChance=(S,h,t)=>{ // 両面待ちが構成不能(壁): 下側・上側とも塔子が枯れている
  const n=t%9,b=t-n,dead=k=>k<0||k>8||mjWallCnt(S,h,b+k)<=0;
  return (dead(n-2)||dead(n-1))&&(dead(n+1)||dead(n+2));
};
/* 安全度テーブル: 上から順に最初に一致した行を採用 (現物100〜無スジ中央22) */
const MJ_SAFETY=[
  {label:'現物',pts:100,hit:(S,h,t)=>S.genbutsu[t]},
  {label:'字牌3枚見え',pts:90,hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]>=3},
  {label:'壁(ノーチャンス)',pts:80,hit:(S,h,t)=>t<MJ.HONOR&&mjNoChance(S,h,t)},
  {label:'スジの1・9',pts:75,hit:(S,h,t)=>t<MJ.HONOR&&(t%9===0||t%9===8)&&mjSuji(S,t)},
  {label:'字牌2枚見え',pts:70,hit:(S,h,t)=>t>=MJ.HONOR&&S.visible[t]+h[t]>=2},
  {label:'スジの2・8',pts:65,hit:(S,h,t)=>t<MJ.HONOR&&(t%9===1||t%9===7)&&mjSuji(S,t)},
  {label:'中スジ',pts:55,hit:(S,h,t)=>t<MJ.HONOR&&mjSuji(S,t)},
  {label:'生牌の字牌',pts:45,hit:(S,h,t)=>t>=MJ.HONOR},
  {label:'端の1・9',pts:40,hit:(S,h,t)=>t%9===0||t%9===8},
  {label:'2・8',pts:32,hit:(S,h,t)=>t%9===1||t%9===7},
  {label:'中央3-7(無スジ)',pts:22,hit:()=>true},
];
function mjSafety(S,h,t){for(const e of MJ_SAFETY)if(e.hit(S,h,t))return e;}

/* 役の芽テーブル: 13枚時点で「どの役に向かえるか」を宣言的に判定 */
const MJ_YAKU_EYES=[
  {label:'タンヤオ形',pts:8,hit:h=>{for(let t=0;t<34;t++)if(h[t]>0&&MJ.YAOCHU[t])return false;return true;}},
  {label:'役牌対子',pts:7,hit:(h,c)=>[31,32,33,c.seatWind,c.roundWind].some(t=>h[t]>=2)},
  {label:'七対子ねらい',pts:6,hit:h=>{let p=0;for(let t=0;t<34;t++)if(h[t]>=2)p++;return p>=4;}},
  {label:'ピンフ形',pts:5,hit:h=>{let tri=0;for(let t=0;t<34;t++)if(h[t]>=3)tri++;
    for(let t=MJ.HONOR;t<34;t++)if(h[t]>0&&t>=31)return false;return tri===0;}},
  {label:'染め手みこみ',pts:6,hit:h=>{const c=[0,0,0];let hon=0;
    for(let t=0;t<34;t++)if(h[t]>0){if(t<MJ.HONOR)c[t/9|0]+=h[t];else hon+=h[t];}
    return Math.max(...c)+hon>=11&&c.filter(x=>x>0).length<3;}},
];
function mjYakuEyes(h13,c){const out=[];let pts=0;
  for(const e of MJ_YAKU_EYES)if(e.hit(h13,c)){out.push(e.label);pts+=e.pts;}
  return {labels:out,pts};
}

/* 押し引きテーブル: 自シャンテン×脅威(リーチ有無)×巡目→効率/安全の重み */
const MJ_PUSH=[
  [{eff:1,safe:0},{eff:.65,safe:.35}], // 聴牌
  [{eff:1,safe:0},{eff:.35,safe:.65}], // 1シャンテン
  [{eff:1,safe:0},{eff:.12,safe:.88}], // 2シャンテン以上
];
function mjPushW(sh,threat,turn){
  const w=Object.assign({},MJ_PUSH[Math.min(Math.max(sh,0),2)][threat?1:0]);
  if(threat&&turn>=12){w.safe=Math.min(1,w.safe+.1);w.eff=1-w.safe;} // 終盤は降り寄り
  return w;
}

/* ---- 打牌候補の分析: 14枚→全候補の {効率/安全/役} スコアと理由 ---- */
function mjAnalyze(h14,S,c){ // c:{threat,turn,seatWind,roundWind}
  const cands=[];
  for(let t=0;t<34;t++){
    if(h14[t]===0)continue;
    h14[t]--;
    const u=MJ.ukeire(h14,S.visible);
    const eyes=mjYakuEyes(h14,c);
    cands.push({tile:t,sh:u.shanten,uke:u,eyes,safe:mjSafety(S,h14,t)});
    h14[t]++;
  }
  const shMin=Math.min(...cands.map(x=>x.sh));
  // 受け入れ枚数はシャンテン数が同じ候補どうしでしか比較できない(浅いほど母数が減る)。
  // 同一シャンテン帯内で正規化し、後退は1段ごとに-70点(帯内順位は保って理由説明に使う)
  const maxBySh={};
  for(const x of cands)maxBySh[x.sh]=Math.max(maxBySh[x.sh]||1,x.uke.count);
  const pw=mjPushW(shMin,c.threat,c.turn);
  for(const x of cands){
    x.eff=Math.max(0,Math.round(100*x.uke.count/maxBySh[x.sh]-70*(x.sh-shMin)));
    x.total=Math.round(pw.eff*x.eff+pw.safe*x.safe.pts+Math.min(12,x.eyes.pts)*.01*x.eff);
  }
  cands.sort((a,b)=>b.total-a.total||b.eff-a.eff);
  return {cands,shMin,maxBySh,weights:pw};
}
/* 理由テキスト: 出力例「①受け入れ6種18枚(最大) ②現物で安全 ③タンヤオ形を維持」 */
function mjReason(x,an,threat){
  const r=['①受け入れ'+x.uke.kinds+'種'+x.uke.count+'枚'+
    (x.sh>an.shMin?'(シャンテン後退!)':x.uke.count>=an.maxBySh[x.sh]?'(最大)':'')];
  if(threat)r.push('②'+x.safe.label+(x.safe.pts>=65?'で安全':x.safe.pts>=45?'(やや危険)':'(危険!)'));
  r.push((threat?'③':'②')+(x.eyes.labels.length?x.eyes.labels.slice(0,2).join('・')+'を維持':'役の芽なし(リーチ頼み)'));
  return r;
}

/* ---- CPU打牌 (B-8): プレイヤーと同じ分析器を使い、判断根拠もログに残す ---- */
function mjCpuDiscard(h14,S,c){
  const an=mjAnalyze(h14,S,c);
  const top=an.cands[0];
  const why=c.threat?(top.safe.pts>=65?'あんぜんな'+MJ.NAMES[top.tile]+'からきるよ'
      :'おりたいけど…'+MJ.NAMES[top.tile]+'がいちばんマシ')
    :'うけいれ'+top.uke.count+'まいで最大の'+MJ.NAMES[top.tile]+'をきるよ';
  return {tile:top.tile,why,an};
}

/* ---- 採点 (A-6): 1打ごとのロス→局全体をSS/S/A/B/Cへ (titleForと同形式のテーブル) ---- */
const MJ_RANKS=[[0,'C','#aab0c8'],[45,'B','#8fd0ff'],[65,'A','#7cf29c'],[80,'S','#ffb0d8'],[92,'SS','#ffd23f']];
function mjRankFor(score){let r=MJ_RANKS[0];for(const e of MJ_RANKS)if(score>=e[0])r=e;return r;}
function mjTurnScore(chosen,an){ // その巡の打牌採点 0-100
  return Math.max(0,100-(an.cands[0].total-chosen.total)*3);
}
function mjJudgeKind(chosen,an){ // コア共通JUDGE(スコア/コンボ)への写像
  const loss=an.cands[0].total-chosen.total;
  return loss<=0?'perfect':loss<=4?'great':loss<=12?'good':'miss';
}

/* ---- 局の進行 (UI非依存: セルフテストでヘッドレス実行できる) ---- */
function mjRoundNew(rng){
  const wall=[];
  for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);
  for(let i=wall.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));
    [wall[i],wall[j]]=[wall[j],wall[i]];}
  const my=new Array(34).fill(0),cp=new Array(34).fill(0);
  for(let i=0;i<13;i++){my[wall.pop()]++;cp[wall.pop()]++;}
  return {wall,my,cp,myRiver:[],cpRiver:[],
    S:mjRiverNew(),   // 自分視点: genbutsu=CPUの河
    Sc:mjRiverNew(),  // CPU視点: genbutsu=自分の河
    turn:1,myRiichi:0,cpRiichi:0,cpWin:[],end:null,log:[],hintsUsed:0,noYaku:0,
    seatWind:27,roundWind:27};
}
const mjWinCtx=(R,hand,winTile,riichi,tsumo)=>({hand,winTile,menzen:true,
  riichi:!!riichi,tsumo,seatWind:R.seatWind,roundWind:R.roundWind});
function mjDrawSelf(R){ // 自分のツモ → {tile,win:{han,yaku}|null}
  const t=R.wall.pop();R.my[t]++;
  if(MJ.shanten(R.my)===-1){
    const w=MJ.judgeYaku(mjWinCtx(R,R.my,t,R.myRiichi,true));
    if(w.han>0){R.end='tsumo';return {tile:t,win:w};}
    R.noYaku++; // 役なし: あがれない教材ポイント
  }
  return {tile:t,win:null};
}
function mjPlayerDiscard(R,t){ // 打牌の共通処理 → 'dealin'|null
  R.my[t]--;R.myRiver.push(t);
  mjSee(R.S,t);mjThreatDiscard(R.Sc,t);
  if(R.cpRiichi&&R.cpWin.indexOf(t)>=0){R.end='dealin';R.dealinTile=t;return 'dealin';}
  return null;
}
function mjCpuTurn(R){ // CPUのツモ〜打牌 → {cut,why,declared,win,ron}
  const t=R.wall.pop();R.cp[t]++;
  if(MJ.shanten(R.cp)===-1){
    const w=MJ.judgeYaku(mjWinCtx(R,R.cp,t,R.cpRiichi,true));
    if(w.han>0){R.end='cpuTsumo';return {win:w,cut:-1};}
  }
  let cut=t,why='リーチちゅうはツモぎり！';
  if(!R.cpRiichi){
    const d=mjCpuDiscard(R.cp,R.Sc,{threat:!!R.myRiichi,turn:R.turn,
      seatWind:R.seatWind,roundWind:R.roundWind});
    cut=d.tile;why=d.why;
  }
  R.cp[cut]--;R.cpRiver.push(cut);
  mjThreatDiscard(R.S,cut);mjSee(R.Sc,cut);
  let declared=false;
  if(!R.cpRiichi&&MJ.shanten(R.cp)===0){R.cpRiichi=R.turn;declared=true;why='テンパイ！リーチ！';}
  if(R.cpRiichi)R.cpWin=MJ.winTiles(R.cp);
  // 自分のロン判定 (フリテンなし・役ありのみ)
  let ron=null;
  if(MJ.shanten(R.my)===0){
    const myWin=MJ.winTiles(R.my);
    const furiten=myWin.some(w=>R.myRiver.indexOf(w)>=0);
    if(!furiten&&myWin.indexOf(cut)>=0){
      R.my[cut]++;
      const w=MJ.judgeYaku(mjWinCtx(R,R.my,cut,R.myRiichi,false));
      if(w.han>0){R.end='ron';ron=w;}else R.my[cut]--;
    }
  }
  return {cut,why,declared,win:null,ron};
}
/* ---- 局後レポート (A-6) ---- */
const MJ_ADJ=[ // 加減点テーブル
  {label:'和了ボーナス',pts:6,count:R=>R.end==='tsumo'||R.end==='ron'?1:0},
  {label:'流局時テンパイ',pts:3,count:R=>R.end==='ryuukyoku'&&MJ.shanten(R.my)===0?1:0},
  {label:'ほうじゅう',pts:-6,count:R=>R.end==='dealin'?1:0},
  {label:'リーチみのがし',pts:-3,count:R=>Math.min(3,R.log.filter(l=>l.couldRiichi&&!l.riichied&&!l.auto).length)},
  {label:'ヒントにたよった',pts:-1,count:R=>Math.min(5,R.hintsUsed)},
];
function mjReport(R){
  const judged=R.log.filter(l=>!l.auto);
  const opt=judged.filter(l=>l.kind==='perfect').length;
  let sc=judged.length?judged.reduce((a,l)=>a+l.tscore,0)/judged.length:70;
  const adj=[];
  for(const a of MJ_ADJ){const n=a.count(R);
    if(n){adj.push({label:a.label,pts:a.pts*n});sc+=a.pts*n;}}
  sc=clamp(Math.round(sc),0,100);
  const worst=judged.filter(l=>l.kind!=='perfect')
    .sort((a,b)=>a.tscore-b.tscore).slice(0,4);
  return {score:sc,rank:mjRankFor(sc),opt,total:judged.length,adj,worst,
    optRate:judged.length?opt/judged.length:1};
}
/* 成長トラッキング (B-9): 直近の局から弱点を1つ提案 (gameHintと同じ思想のテーブル) */
const MJ_WEAK=[
  {hit:h=>h.avgOpt<0.45,label:'きるまえに「うけいれ何枚?」をくらべるクセをつけよう'},
  {hit:h=>h.lateRi>=2,label:'テンパイしたら まずリーチをけんとうしよう'},
  {hit:h=>h.dealin>=2,label:'リーチには 現物→スジ のじゅんでおりよう'},
  {hit:()=>true,label:'この調子！SSランクをめざそう'},
];
function mjWeakness(hist){
  const h5=hist.slice(-5);
  if(!h5.length)return MJ_WEAK[MJ_WEAK.length-1].label;
  const agg={avgOpt:h5.reduce((a,x)=>a+x.opt,0)/h5.length,
    lateRi:h5.reduce((a,x)=>a+(x.lateRi||0),0),
    dealin:h5.reduce((a,x)=>a+(x.dealin||0),0)};
  for(const w of MJ_WEAK)if(w.hit(agg))return w.label;
}

/* ---- ここからUI ---- */
registerGame({
  id:'mahjong',emoji:'🀄',title:'なぜきり麻雀どうじょう',
  desc:'「なぜその牌をきる？」りゆうを学べる1人用コーチ',
  color:'#b8e0d2',duration:null,
  howto:[
    ['🀄','ツモって1まいすてる をくりかえそう'],
    ['🎯','コーチが1打ごとに「なぜ？」を採点してくれる'],
    ['💡','まよったらヒントで受け入れ枚数をみられる'],
    ['🤖','CPUがリーチしたら 現物・スジでおりるれんしゅう！'],
    ['📊','局がおわると SS〜C の添削レポート！'],
  ],
  create(ctx){
    const A=ctx.audio,RNG=ctx.rng;
    const R=mjRoundNew(RNG);
    let mjPhase='draw',sel=-1,an=null,drawn=-1,fb=null,timer=0;
    let hintOn=ctx.rookie,riichiArm=false,endInfo=null,rep=null,page=0,cpuWhy='はじめよう！';
    const TW=27,TH=40,HX=8,HY=572;                       // 手牌レイアウト
    const RW=18,RH=24;                                   // 河レイアウト (12枚×2段=最大24打)
    const BTNS=[ // 画面下ボタン (onDownでヒットテスト)
      {id:'hint',x:8,y:626,w:128,h:44,label:()=>hintOn?'💡ヒント中':'💡ヒント',
        on:()=>{if(!hintOn){hintOn=true;R.hintsUsed++;A.pop();}else{hintOn=false;A.tick();}}},
      {id:'riichi',x:146,y:626,w:128,h:44,label:()=>riichiArm?'リーチやめる':'リーチ！',
        able:()=>mjPhase==='select'&&!R.myRiichi&&an&&an.cands.some(c=>c.sh===0),
        on:()=>{riichiArm=!riichiArm;sel=-1;A.go();}},
    ];
    const handTiles=()=>{const o=[];for(let t=0;t<34;t++)for(let k=0;k<R.my[t];k++)o.push(t);return o;};
    function startTurn(){
      if(R.wall.length<=14){R.end='ryuukyoku';finishRound();return;}
      const d=mjDrawSelf(R);
      drawn=d.tile;sel=-1;riichiArm=false;
      if(R.end){endInfo=d.win;finishRound();return;}
      an=mjAnalyze(R.my,R.S,{threat:!!R.cpRiichi,turn:R.turn,
        seatWind:R.seatWind,roundWind:R.roundWind});
      if(R.myRiichi){ // リーチ後はツモぎり
        doDiscard(drawn,true);
        return;
      }
      mjPhase='select';
    }
    function doDiscard(t,auto){
      const chosen=an.cands.find(c=>c.tile===t);
      const kind=mjJudgeKind(chosen,an);
      const couldRiichi=!R.myRiichi&&an.cands.some(c=>c.sh===0);
      if(!auto){
        ctx.judge(kind,HX+7+handTiles().indexOf(t)*(TW+2),HY,
          kind==='perfect'?{sub:'さいてき！'}:undefined);
      }
      R.log.push({n:R.turn,cut:t,kind,auto:!!auto,tscore:mjTurnScore(chosen,an),
        best:an.cands[0].tile,threat:!!R.cpRiichi,couldRiichi,
        riichied:riichiArm||!!R.myRiichi,
        myReason:mjReason(chosen,an,!!R.cpRiichi),
        bestReason:mjReason(an.cands[0],an,!!R.cpRiichi)});
      if(riichiArm&&chosen.sh===0){R.myRiichi=R.turn;A.fever();}
      riichiArm=false;sel=-1;
      const res=mjPlayerDiscard(R,t);
      if(res==='dealin'){finishRound();return;}
      fb={chosen,an:an,auto:!!auto};
      mjPhase='fb';timer=auto?.55:0;
    }
    function cpuStep(){
      if(R.wall.length<=14){R.end='ryuukyoku';finishRound();return;}
      const r=mjCpuTurn(R);
      if(R.end){endInfo=r.win||r.ron;finishRound();return;}
      cpuWhy=r.why;
      if(r.declared)A.bad();
      R.turn++;
      startTurn();
    }
    function finishRound(){
      rep=mjReport(R);page=0;
      rep.finalSh=MJ.shanten(R.my);sel=-1;
      // 成長履歴 (直近20局)
      let hist=[];try{hist=JSON.parse(store.get('pgp2_mj_hist','[]'))||[];}catch(e){}
      hist.push({r:rep.rank[1],opt:rep.optRate,
        lateRi:R.log.filter(l=>l.couldRiichi&&!l.riichied&&!l.auto).length?1:0,
        dealin:R.end==='dealin'?1:0});
      store.set('pgp2_mj_hist',JSON.stringify(hist.slice(-20)));
      rep.weak=mjWeakness(hist);rep.hist=hist;
      mjPhase='end';timer=0;
      const msg={tsumo:'ツモ和了！🎉',ron:'ロン和了！🎉',dealin:'ほうじゅう…！💥',
        cpuTsumo:'CPUのツモ和了…',ryuukyoku:MJ.shanten(R.my)<=0?'流局(テンパイ)':'流局'}[R.end];
      banner(msg);
      (R.end==='tsumo'||R.end==='ron')?A.record():A.miss();
    }
    startTurn();
    /* ---- 描画 (rr は共通ヘルパーを使用) ---- */
    const SUIT_COL=['#c0392b','#2166ac','#2a7a3a'];
    function tile(g,x,y,w,h,t,o){
      o=o||{};
      g.save();if(o.dim)g.globalAlpha=.38;
      rr(g,x,y,w,h,Math.min(5,w*.18));

    function text(g,s,x,y,px,col,align){

      g.textAlign=align||'left';g.textBaseline='middle';g.fillText(s,x,y);

    function panel(g,x,y,w,h){rr(g,x,y,w,h,12);g.fillStyle='rgba(255,255,255,.88)';g.fill();

    function candRow(g,x,y,c,idx,threat){
      tile(g,x,y,24,33,c.tile);
      const bx=x+32;
      text(g,['◎','○','△'][idx]||'△',bx,y+8,15,['#e5a000','#7a9a3a','#888'][idx]||'#888');

        river(g,R.cpRiver,112,84);
        text(g,'🤖「'+cpuWhy+'」',12,152,11.5,'#5a7a6a');
        // コーチパネル
        panel(g,8,164,W-16,292);
        const px=20,py=180;
        if(an&&!R.end)text(g,(an.shMin===0?'テンパイ！':an.shMin+'シャンテン'),W-28,py+4,14,

        if(mjPhase==='select'){

          if(R.noYaku)text(g,'※役がないと和了できないよ',px,py+42,11.5,'#8a6a2a');

          }else{

        }else if(mjPhase==='fb'&&fb){

              px,py+110,15,same?'#e5a000':'#c0392b');
            if(!same)mjReason(b,fb.an,!!R.cpRiichi).forEach((s,i)=>

        }else if(mjPhase==='end'&&rep){
          text(g,'きょくしゅうりょう！',px,py+10,16,'#3a3f52');

          text(g,'リーチ！',44,490,12,'#fff','center');}
        // 手牌
        if(!R.end){
          const tiles=handTiles();
          tiles.forEach((t,i)=>{
            const isDrawn=mjPhase==='select'&&i===tiles.lastIndexOf(drawn);
            const keep=an&&an.cands.find(c=>c.tile===t);
            tile(g,HX+i*(TW+2)+(isDrawn?3:0),HY-(sel===t?8:0),TW,TH,t,
              {sel:sel===t,dim:riichiArm&&keep&&keep.sh!==0}); // リーチ時: 聴牌が崩れる牌は暗転
          });

        // ボタン
        if(mjPhase==='select'){

      onDown(x,y){

        if(mjPhase==='report'){reportTap(x,y);return;}

        for(const b of BTNS)
          if(!(b.able&&!b.able())&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.on();return;}

      destroy(){},
    };
    function drawReport(g,px,py){

        text(g,'📊 コーチレポート',px,py+6,15,'#3a3f52');

        for(const a of rep.adj)L.push([a.label,(a.pts>0?'+':'')+a.pts+'てん']);
        L.forEach(([k,v],i)=>{text(g,k,px+140,py+40+i*24,12.5,'#555');
          text(g,v,px+380,py+40+i*24,12.5,'#3a3f52','right');});
        text(g,'💡 '+rep.weak,px,py+200,12.5,'#7a5a2a');
        text(g,'直近の成績: '+rep.hist.slice(-5).map(h=>h.r).join(' → '),px,py+224,12,'#999');
      }else{
        text(g,'📝 みなおしポイント',px,py+6,15,'#3a3f52');
        if(!rep.worst.length)text(g,'ミスなし！かんぺき！',px,py+40,14,'#e5a000');
        rep.worst.forEach((l,i)=>{
          const y=py+34+i*52;
          text(g,l.n+'じゅんめ: '+MJ.NAMES[l.cut]+'ぎり → 最適は'+MJ.NAMES[l.best],px,y,13,'#c0392b');
          text(g,l.bestReason.join(' '),px+8,y+19,11,'#555');
        });
      }
      // ページャ+終了ボタン
      text(g,(page+1)+'/2',px+185,py+250,12,'#999');
      [['◀',px+130],['▶',px+220]].forEach(([s,x])=>{
        rr(g,x,py+236,36,28,8);g.fillStyle='#eee6d6';g.fill();text(g,s,x+18,py+250,13,'#555','center');});
      rr(g,px+270,py+232,110,36,12);g.fillStyle='#ff8fb8';g.fill();

    function reportTap(x,y){

        if(x>=px+270){ctx.finishGame({banner:'コーチランク '+rep.rank[1]+'！'});return;}
      }
    }
  }
});

/* ---- セルフテスト (?selftest で実行) ---- */
function runMahjongTests(){
  const {ck,done}=makeTest('mahjong');
  // シャンテン数: 既知ベクタ
  for(const[s,want]of[
    ['123m456p789s11222z',-1],['123m456p789s1122z',0],
    ['19m19p19s1234567z',0],['19m19p19s12345677z',-1],
    ['1122334455667m',0],['1112345678999m',0],
    ['147m258p369s1234z',6],['1199m1199p1199s1z',0]])
    ck('sh:'+s,MJ.shanten(MJ.parse(s))===want);
  // 受け入れ: 一貫性 (挙げた牌は必ずシャンテンが進み、他は進まない)
  {const rng=mulberry32(42);
   for(let n=0;n<12;n++){
     const wall=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);
     for(let i=wall.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[wall[i],wall[j]]=[wall[j],wall[i]];}
     const h=new Array(34).fill(0);
     for(let i=0;i<13;i++)h[wall[i]]++;
     const u=MJ.ukeire(h,null),s0=u.shanten;let good=true;
     for(let t=0;t<34;t++){
       if(h[t]>=4)continue;
       h[t]++;
       if((MJ.shanten(h)<s0)!==u.tiles.some(x=>x.tile===t))good=false;
       h[t]--;
     }
     ck('ukeire#'+n,good);
   }}
  // 役判定 (テーブル駆動)
  const yk=(hand,opts)=>MJ.judgeYaku(Object.assign({hand:MJ.parse(hand),menzen:true,
    riichi:false,tsumo:false,seatWind:27,roundWind:27,winTile:-1},opts))
    .yaku.map(y=>y.name).sort().join(',');
  ck('yaku:pinfu+tanyao',yk('234567m234p56788s',{winTile:24})===['断幺九','平和'].sort().join(','));
  ck('yaku:kanchan-no-pinfu',yk('234567m234p56788s',{winTile:23})==='断幺九');
  ck('yaku:haku',yk('123m456p78999s555z',{winTile:25})==='役牌(白)');
  ck('yaku:chiitoi',yk('1122m3344p5566s77z',{})==='七対子');
  ck('yaku:toitoi',yk('111m222p333s44455z',{})==='対々和');
  ck('yaku:honitsu-winds',yk('123m789m11122233z',{roundWind:27,seatWind:28})
    ===['場風牌','混一色','自風牌'].sort().join(','));
  ck('yaku:iipeiko-pinfu',yk('112233m456p789s99s',{winTile:26})===['一盃口','平和'].sort().join(','));
  ck('yaku:chinitsu',yk('111222333789m99m',{})===['一盃口','清一色'].sort().join(','));
  // 安全度テーブル (現物>スジ>無スジ、壁)
  {const S=mjRiverNew(),h=new Array(34).fill(0);
   mjThreatDiscard(S,12);            // 4p切り → 1p/7pがスジ
   ck('safe:genbutsu',mjSafety(S,h,12).pts===100);
   ck('safe:suji19',mjSafety(S,h,9).label==='スジの1・9');
   ck('safe:suji-not-mid',mjSafety(S,h,13).pts<50); // 5pは中スジ未成立
   ck('safe:order',mjSafety(S,h,12).pts>mjSafety(S,h,9).pts&&
     mjSafety(S,h,9).pts>mjSafety(S,h,4).pts);      // 現物>スジ>無スジ中央
   for(let k=0;k<4;k++)mjSee(S,2);   // 3m4枚見え → 1m壁(ノーチャンス)
   ck('safe:kabe',mjSafety(S,h,0).label==='壁(ノーチャンス)');
   for(let k=0;k<3;k++)mjSee(S,27);  // 東3枚見え
   ck('safe:honor3',mjSafety(S,h,27).pts===90);}
  // 押し引きテーブル: 脅威で安全重み増、シャンテン深いほど降り
  ck('push:no-threat',mjPushW(1,false,5).eff===1);
  ck('push:threat-deep',mjPushW(2,true,5).safe>mjPushW(0,true,5).safe);
  // 分析: 聴牌を保つ打牌が最上位に来る
  {const h=MJ.parse('1112345678999m1z');
   const an=mjAnalyze(h,mjRiverNew(),{threat:false,turn:5,seatWind:27,roundWind:27});
   ck('analyze:best-keeps-tenpai',an.cands[0].tile===27&&an.cands[0].sh===0);
   ck('analyze:judge-perfect',mjJudgeKind(an.cands[0],an)==='perfect');
   ck('analyze:reason-text',mjReason(an.cands[0],an,false)[0].indexOf('受け入れ')>=0);}
  // 回帰: 脅威なしでは最上位候補が必ずシャンテン最小を保つ (受け入れ枚数は帯内比較)
  {const rng=mulberry32(9);let good=true;
   for(let n=0;n<10;n++){
     const R=mjRoundNew(rng);
     R.my[R.wall.pop()]++; // 14枚目
     const an=mjAnalyze(R.my,R.S,{threat:false,turn:3,seatWind:27,roundWind:27});
     if(an.cands[0].sh!==an.shMin)good=false;
   }
   ck('analyze:top-is-min-shanten',good);}
  // 採点ランク境界
  ck('rank:SS',mjRankFor(95)[1]==='SS');
  ck('rank:C',mjRankFor(10)[1]==='C');
  // 局を通しでヘッドレス実行 (両者CPUポリシー) → 必ず終局しレポートが出る
  for(const seed of[7,99,2024]){
    const R=mjRoundNew(mulberry32(seed));
    let guard=0;
    while(!R.end&&guard++<60){
      if(R.wall.length<=14){R.end='ryuukyoku';break;}
      mjDrawSelf(R);
      if(R.end)break;
      const an=mjAnalyze(R.my,R.S,{threat:!!R.cpRiichi,turn:R.turn,seatWind:27,roundWind:27});
      const top=an.cands[0];
      R.log.push({n:R.turn,cut:top.tile,kind:mjJudgeKind(top,an),auto:false,
        tscore:mjTurnScore(top,an),best:top.tile,threat:!!R.cpRiichi,
        couldRiichi:an.cands.some(c=>c.sh===0),riichied:!!R.myRiichi,
        myReason:[],bestReason:mjReason(top,an,!!R.cpRiichi)});
      if(!R.myRiichi&&top.sh===0)R.myRiichi=R.turn;
      if(mjPlayerDiscard(R,top.tile))break;
      mjCpuTurn(R);
      R.turn++;
    }
    ck('round-ends#'+seed,!!R.end);
    const rep=mjReport(R);
    ck('round-rank#'+seed,['SS','S','A','B','C'].indexOf(rep.rank[1])>=0);
    ck('round-score#'+seed,rep.score>=0&&rep.score<=100);
  }
  return done();
}
SELFTESTS.push(runMahjongTests);

/* ============================================================
   ゲームF: チキンレース ～崖っぷちの勇気～ (versus / 対CPU・スコア無し)
   ------------------------------------------------------------
   コア非依存: ラウンド進行 / カウントダウン(3-2-1-GO) / 勝敗 / もう一度 を
   すべて canvas 内で完結 (ox・gomoku と同じ type:'versus' の作法)。
   物理は reference 960x540 系の world 座標で計算し、実canvas(縦 420x740)へ
   SX=W/960 で比率描画する → 仕様の CARS/SLOPES 物理定数をそのまま使える。
   純関数 stopDist / predictStop / roundScore / judgeRound / judgeMatch を
   module スコープに分離 (?selftest で runChickenTests / grip>g と境界を検証)。
   ============================================================ */
// 走路レイアウト (world / reference 960x540 基準)。走路長 ≒ EDGE-START-CAR_W = 648
const CHK_START_X=52, CHK_EDGE_X=796, CHK_CAR_W=96, CHK_CAR_H=46;
// 車種: 最高速 max / 加速 accel / 制動グリップ grip。停止距離 ≒ max^2/(2*grip)
const CARS={
  compact:{name:"コンパクト",trait:"扱いやすい",        max:5.2,accel:0.150,grip:0.085},
  dump:   {name:"ダンプ",    trait:"重く制動が長い",    max:6.0,accel:0.105,grip:0.050},
  sports: {name:"スポーツ",  trait:"速いが止まりにくい",max:7.0,accel:0.175,grip:0.072},
};
// 坂: g=重力(+で崖側) / tilt=見た目の傾き(rad)。必ず grip>g (下りでも止まれる)
const SLOPES={
  flat:{name:"平地",  icon:"➖",g: 0.000,tilt: 0.00 },
  up:  {name:"登り坂",icon:"⛰️",g:-0.026,tilt:-0.085}, // 止まりやすいが加速鈍く止まりすぎやすい
  down:{name:"下り坂",icon:"⤵️",g: 0.020,tilt: 0.10 }, // 止まりにくい→早めにオフ
};
// 3ラウンド固定 (後でランダム化も可)
const ROUND_PLAN=[
  {car:"compact",slope:"flat"}, // R1: 基準
  {car:"dump",   slope:"up"  }, // R2: 鈍い+止まりやすい → 攻めないと届かない
  {car:"sports", slope:"down"}, // R3: 速い+滑る → かなり手前で離す
];
const DIFF={
  easy:  {gap:44,spread:18,bias:[1.02,1.20]}, // よわい: 崖に寄せない+慎重
  normal:{gap:27,spread:14,bias:[0.96,1.12]},
  hard:  {gap:14,spread:8, bias:[0.90,1.06]}, // つよい: 崖に寄せる+攻め
};
// ── 純関数 (テスト対象) ──────────────────────────────────────
// 停止距離: アクセルオフ時の実効減速 = grip - g (>0 を保証)。停止距離 = v^2/(2*decel)
function stopDist(speed,grip,g){const d=Math.max(0.0001,grip-g);return speed*speed/(2*d);}
// CPU 予測停止距離 (bias<1=過信で時々自滅, >1=慎重)
function predictStop(speed,car,g,bias){const d=Math.max(0.02,car.grip-g);return speed*speed/(2*d)*bias;}
// ラウンド得点(近さ): 落下=0 / 崖0px=100 / 200px以遠=0
function roundScore(gap,fell){return fell?0:Math.round(100*(1-Math.min(gap,200)/200));}
// ラウンド勝者: 'p'|'c'|'draw'  (p,c = {fell,gap})。両落下=引分 / 片落下=相手 / 差<1.5px=引分
function judgeRound(p,c){
  if(p.fell&&c.fell)return'draw';
  if(p.fell)return'c'; if(c.fell)return'p';
  if(Math.abs(p.gap-c.gap)<1.5)return'draw';
  return p.gap<c.gap?'p':'c';
}
// マッチ勝者: 勝ち数 → 同数なら近さ得点合計 → それも同じなら draw
function judgeMatch(results){
  let pw=0,cw=0,ps=0,cs=0;
  for(const r of results){
    if(r.winner==='p')pw++; else if(r.winner==='c')cw++;
    ps+=r.pScore; cs+=r.cScore;
  }
  if(pw!==cw)return pw>cw?'p':'c';
  if(ps!==cs)return ps>cs?'p':'c';
  return'draw';
}
function runChickenTests(){
  const {ckr:ck,done}=makeTest('chicken'); // 旧ck(cond,msg)互換
  // 全 車種×坂 で grip>g (下り坂でも止まれる) を厳守
  for(const ckey in CARS)for(const skey in SLOPES)
    ck(CARS[ckey].grip>SLOPES[skey].g, 'grip<=g 破綻: '+ckey+'/'+skey);
  // stopDist: 速いほど長い / 下りで伸び / 登りで縮む / 値の妥当性
  ck(stopDist(5,0.085,0)>stopDist(2,0.085,0),'stopDist 速さ単調増');
  ck(stopDist(5,0.085,0.02)>stopDist(5,0.085,0),'下り坂で停止距離↑');
  ck(stopDist(5,0.085,-0.026)<stopDist(5,0.085,0),'登り坂で停止距離↓');
  ck(Math.abs(stopDist(5,0.085,0)-25/(2*0.085))<1e-6,'stopDist 値');
  ck(stopDist(0,0.085,0)===0,'停止中は0');
  // roundScore 境界
  ck(roundScore(0,false)===100,'gap0=100');
  ck(roundScore(200,false)===0,'gap200=0');
  ck(roundScore(300,false)===0,'gap>200 clamp=0');
  ck(roundScore(100,false)===50,'gap100=50');
  ck(roundScore(10,true)===0,'fell=0');
  // predictStop: bias 大ほど予測長い / 下りで予測伸びる
  ck(predictStop(5,CARS.compact,0,1.2)>predictStop(5,CARS.compact,0,1.0),'bias大→予測長');
  ck(predictStop(5,CARS.sports,0.02,1)>predictStop(5,CARS.sports,0,1),'下り→予測長');
  // judgeRound
  ck(judgeRound({fell:true,gap:0},{fell:false,gap:50})==='c','片落下→相手勝ち(c)');
  ck(judgeRound({fell:false,gap:50},{fell:true,gap:0})==='p','片落下→自分勝ち(p)');
  ck(judgeRound({fell:true,gap:0},{fell:true,gap:0})==='draw','両落下→引分');
  ck(judgeRound({fell:false,gap:10},{fell:false,gap:40})==='p','近い方p');
  ck(judgeRound({fell:false,gap:40},{fell:false,gap:10})==='c','近い方c');
  ck(judgeRound({fell:false,gap:10},{fell:false,gap:11})==='draw','差<1.5=引分');
  // judgeMatch
  ck(judgeMatch([{winner:'p',pScore:1,cScore:0},{winner:'p',pScore:1,cScore:0},{winner:'c',pScore:0,cScore:1}])==='p','勝ち数多いp');
  ck(judgeMatch([{winner:'p',pScore:90,cScore:10},{winner:'c',pScore:10,cScore:90},{winner:'draw',pScore:50,cScore:40}])==='p','勝ち同数→得点合計p');
  ck(judgeMatch([{winner:'draw',pScore:50,cScore:50}])==='draw','完全同→引分');
  return done();
}
registerGame({
  id:'chicken', emoji:'🏁', title:'チキンレース',
  // 選択画面アイコン: チェッカーフラッグ🏁 + 鶏🐔 でチキンレースと分かるように (小サイズでも判別)
  iconHtml:`<span style="display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:6.8cqw">🏁<span style="margin-left:-1.4cqw">🐔</span></span>`,
  desc:'崖ギリギリで止めろ！CPUとの度胸試し',
  color:'#ff8a5c', type:'versus',   // duration は付けない (タイマー無し・3R対戦)
  howto:[
    ['🚗','アクセル長押しで加速、離すと慣性で減速'],
    ['🛑','崖ギリギリで止めるほど高得点！越えたら負け'],
    ['🏆','3ラウンド勝負。毎回 車種と坂が変わる'],
  ],
  create(ctx){
    const A=ctx.audio;
    const SX=W/960;                 // world(960幅) → 実canvas幅 への比率
    const wx=x=>x*SX;               // world x → screen x
    const EDGE_SX=wx(CHK_EDGE_X), CARW_S=CHK_CAR_W*SX;
    const COLP={car:'#ff5c6c',dark:'#a82a37',glow:'#ff97a2'}; // あなた=赤系
    const COLC={car:'#2fd6dc',dark:'#147b80',glow:'#86f2f6'}; // CPU=シアン系
    const LANE_C=326, LANE_P=452;   // レーン中心Y (縦canvas: 奥=CPU上 / 手前=Player下)
    // タイトルの難易度ボタン (タイトル局面のみ当たり判定)
    const DIFF_KEYS=['easy','normal','hard'], DIFF_LBL={easy:'よわい',normal:'ふつう',hard:'つよい'};
    const DB_W=104,DB_H=58,DB_GAP=12,DB_Y=452;
    const DB_X0=(W-(DB_W*3+DB_GAP*2))/2;
    const diffBtns=DIFF_KEYS.map((k,i)=>({k,x:DB_X0+i*(DB_W+DB_GAP),y:DB_Y,w:DB_W,h:DB_H}));
    // アクセルペダル (見た目。run中は画面どこでも加速＝ペダルは押下状態を表示)
    const PEDAL={x:30,y:600,w:W-60,h:118,r:26};

    let diff=store.get('pgp2_chk_diff','normal'); if(!DIFF[diff])diff='normal';
    let stPhase='title';            // title|count|run|rresult|mresult
    let round=0, results=[];
    let matchIsRec=false;   // #13 直近マッチでベスト更新したか (結果画面の「しんきろく！」表示用)
    let pCar=null, cCar=null, held=false, keyHeld=false; // held=ポインタ押下 / keyHeld=Space
    let cdT=0, cdIdx=-1, t=0, acc=0, resolveT=0, shakeT=0, flashT=0, runT=0;
    let skyGrad=null, abyssGrad=null;                    // 定数グラデはキャッシュ(毎フレーム再生成しない)
    const parts=new Particles();

    function mkCar(key){
      return {key,x:CHK_START_X,speed:0,moved:false,fell:false,fallY:0,fallVy:0,
              settled:false, gap:CHK_EDGE_X-(CHK_START_X+CHK_CAR_W)};
    }
    const planDef=()=>CARS[ROUND_PLAN[round].car];
    const planSlope=()=>SLOPES[ROUND_PLAN[round].slope];
    // アクセルは run 中のみ有効。ポインタ/Space の物理的な押下状態をそのまま反映
    // → カウントダウン中から押しっぱなしでも GO で即加速する (押し直し不要)
    const accelOn=()=> stPhase==='run' && (held||keyHeld);

    function setupRound(){
      pCar=mkCar('p'); cCar=mkCar('c');
      const D=DIFF[diff];
      cCar.target=Math.max(3, D.gap+rand(-1,1)*D.spread);
      cCar.bias=rand(D.bias[0],D.bias[1]);
      acc=0; resolveT=0; runT=0;
    }
    function beginCountdown(){ stPhase='count'; cdT=0; cdIdx=-1; }
    function startMatch(){ round=0; results=[]; matchIsRec=false; setupRound(); beginCountdown(); }
    function nextRound(){
      if(round>=ROUND_PLAN.length-1){   // 最終ラウンド後 → マッチ結果 (round は範囲内に保つ)
        stPhase='mresult';
        const w=judgeMatch(results);
        // #13 成績: マッチの近さ得点合計(pScore和)を チキンのベストとして記録
        let mps=0;for(const rr of results)mps+=rr.pScore;
        matchIsRec=mps>getInt('pgp2_best_chicken',0);
        if(matchIsRec)store.set('pgp2_best_chicken',String(mps));
        if(w==='p'){A.coin();confetti();vib([30,50,30,50,30]);}
        else if(w==='c'){A.bad();vib([60,40,60]);}
        else A.ok();
      }else{ round++; setupRound(); beginCountdown(); A.pop(); }
    }

    // ── 物理: 1/60 固定ステップ (仕様「毎フレーム x+=speed」を fps非依存に) ──
    function onFall(){ shakeT=Math.max(shakeT,0.45); flashT=0.32; vib([40,60,40]);
      A.tone({f:300,f2:60,type:'square',dur:.45,vol:.2}); A.noise({f:900,f2:120,dur:.5,vol:.18}); }
    function onSettle(){ A.ok(); }
    function stepOne(car,accelOn,def,g){
      if(car.settled)return;
      if(car.fell){ car.fallVy+=0.9; car.fallY+=car.fallVy; return; }
      let a=g;
      if(accelOn)a+=def.accel; else a-=def.grip;
      car.speed=clamp(car.speed+a,0,def.max);
      car.x+=car.speed;
      if(car.speed>0.3)car.moved=true;
      const front=car.x+CHK_CAR_W;
      if(front>CHK_EDGE_X){ car.fell=true; car.fallVy=Math.max(car.speed,3); car.gap=0; onFall(); return; }
      car.gap=CHK_EDGE_X-front;
      if(car.moved&&!accelOn&&car.speed<0.05){ car.settled=true; car.speed=0; onSettle(); }
    }
    function physicsStep(){
      const def=planDef(), g=planSlope().g;
      // CPU: 自分の予測停止距離からアクセルを離す
      let cAccel=false;
      if(!cCar.settled&&!cCar.fell){
        const predicted=predictStop(cCar.speed,def,g,cCar.bias);
        const dist=CHK_EDGE_X-(cCar.x+CHK_CAR_W);
        cAccel=(dist-predicted)>cCar.target && cCar.speed<def.max;
      }
      stepOne(pCar,accelOn(),def,g);
      stepOne(cCar,cAccel,def,g);
    }
    const carDone=c=>c.settled||(c.fell&&c.fallY>300);
    function resolveRound(){
      const p={fell:pCar.fell,gap:pCar.gap}, c={fell:cCar.fell,gap:cCar.gap};
      const winner=judgeRound(p,c);
      results.push({winner,pScore:roundScore(p.gap,p.fell),cScore:roundScore(c.gap,c.fell),
                    pGap:p.gap,cGap:c.gap,pFell:p.fell,cFell:c.fell});
      stPhase='rresult';
      if(winner==='p'){A.fever();vib([30,40,30]);}
      else if(winner==='c'){A.miss();vib([50]);}
      else A.good();
    }

    // ── 描画ヘルパ ──
    const roadY=(centerY,sxPos,tilt)=>centerY+(sxPos-EDGE_SX)*Math.tan(tilt); // 崖端で centerY
    function drawRoad(g,centerY,tilt,nearCol){
      const yL=roadY(centerY,0,tilt), yR=roadY(centerY,EDGE_SX,tilt), bandH=46;
      g.save();
      g.beginPath();
      g.moveTo(0,yL-bandH/2); g.lineTo(EDGE_SX,yR-bandH/2);
      g.lineTo(EDGE_SX,yR+bandH/2); g.lineTo(0,yL+bandH/2); g.closePath();
      g.fillStyle=nearCol; g.fill();
      // センターライン (破線)
      g.strokeStyle='rgba(255,236,180,.5)'; g.lineWidth=2; g.setLineDash([14,12]);
      g.beginPath(); g.moveTo(0,yL); g.lineTo(EDGE_SX,yR); g.stroke(); g.setLineDash([]);
      g.restore();
    }
    function drawCar(g,car,col,centerY,tilt){
      const cx=wx(car.x+CHK_CAR_W/2);
      let cy=roadY(centerY,cx,tilt)-13;
      let rot=tilt;
      if(car.fell){ cy+=car.fallY; rot=tilt+Math.min(1.2,car.fallY/120); }
      const w=CARW_S, h=24;
      g.save(); g.translate(cx,cy); g.rotate(rot);
      // スピードライン (加速中・高速)
      if(!car.fell&&car.speed>1.4&&((car.key==='p'&&accelOn())||car.key==='c')){
        g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=2;
        for(let i=0;i<4;i++){const yy=-h/2+4+i*5; g.beginPath();
          g.moveTo(-w/2-6-car.speed*3,yy); g.lineTo(-w/2-2,yy); g.stroke();}
      }
      // 影
      g.save();g.globalAlpha=.25;g.fillStyle='#000';rr(g,-w/2,h/2-3,w,7,4);g.fill();g.restore();
      // ボディ
      g.fillStyle=col.car; rr(g,-w/2,-h/2,w,h,6); g.fill();
      g.fillStyle=col.dark; rr(g,-w/2,h/2-7,w,7,4); g.fill();
      // キャビン
      g.fillStyle=col.glow; rr(g,-w*0.18,-h/2-9,w*0.5,12,4); g.fill();
      g.fillStyle='rgba(20,24,40,.85)'; rr(g,-w*0.12,-h/2-7,w*0.4,8,3); g.fill();
      // タイヤ
      g.fillStyle='#1a1320';
      g.beginPath();g.arc(-w*0.28,h/2,5,0,TAU);g.fill();
      g.beginPath();g.arc(w*0.28,h/2,5,0,TAU);g.fill();
      g.restore();
    }
    function drawBtn(g,b,fill,stroke,label,sub){
      g.save();g.fillStyle=fill;rr(g,b.x,b.y,b.w,b.h,16);g.fill();
      if(stroke){g.lineWidth=3;g.strokeStyle=stroke;rr(g,b.x,b.y,b.w,b.h,16);g.stroke();}
      g.restore();
      outlinedText(g,label,b.x+b.w/2,b.y+b.h/2+(sub?-6:6),18,'#fff','#3a2233',5);
      if(sub)outlinedText(g,sub,b.x+b.w/2,b.y+b.h/2+14,11,'#ffe6d2','#3a2233',3);
    }

    function update(dt){
      t+=dt;
      shakeT=Math.max(0,shakeT-dt); flashT=Math.max(0,flashT-dt);
      parts.update(dt);
      if(stPhase==='count'){
        cdT+=dt;
        const idx=Math.floor(cdT/0.62);
        if(idx!==cdIdx){ cdIdx=idx; if(idx<3)A.tick(); else if(idx===3)A.go(); }
        if(cdT>=0.62*3+0.5){ stPhase='run'; }
      }else if(stPhase==='run'){
        acc+=dt; let guard=0;
        while(acc>=1/60 && guard<10){ acc-=1/60; physicsStep(); guard++; }
        if(accelOn()&&!pCar.fell&&!pCar.settled&&pCar.speed>1.2&&Math.random()<0.4){
          const cx=wx(pCar.x),cy=roadY(LANE_P,cx,planSlope().tilt);
          parts.add({x:cx-4,y:cy+6,vx:-rand(30,90),vy:-rand(5,30),grav:120,life:rand(.3,.5),r:rand(2,4),col:'#cfa882'});
        }
        runT+=dt;
        // 安全装置: 入力が無く一度も動かない車があっても必ず決着させる (versusはタイマー無し)
        if(runT>14){ for(const c of [pCar,cCar]) if(!c.settled&&!c.fell){ c.settled=true; c.speed=0; } }
        if(carDone(pCar)&&carDone(cCar)){ resolveT+=dt; if(resolveT>0.45)resolveRound(); }
      }
    }

    function draw(g){
      g.save();
      if(shakeT>0){const s=shakeT*16;g.translate(rand(-s,s),rand(-s,s));}
      // 夕暮れの空 (定数グラデは初回のみ生成してキャッシュ)
      if(!skyGrad){
        skyGrad=g.createLinearGradient(0,0,0,H);
        skyGrad.addColorStop(0,'#241a44'); skyGrad.addColorStop(0.34,'#5a2f63');
        skyGrad.addColorStop(0.52,'#b5476a'); skyGrad.addColorStop(0.62,'#e8743b'); skyGrad.addColorStop(0.7,'#3a2236');
        skyGrad.addColorStop(1,'#161029');
      }
      g.fillStyle=skyGrad; g.fillRect(0,0,W,H);
      // 夕日
      g.save();g.fillStyle='rgba(255,210,120,.9)';g.beginPath();g.arc(W*0.66,250,46,0,TAU);g.fill();
      g.globalAlpha=.25;g.beginPath();g.arc(W*0.66,250,70,0,TAU);g.fill();g.restore();

      const tilt=planSlope().tilt;
      // 路面 (奥=CPU, 手前=Player)。坂で傾けて怖さを演出
      if(stPhase!=='title'){
        drawRoad(g,LANE_C,tilt,'#3a3350');
        drawRoad(g,LANE_P,tilt,'#4a4360');
        // 崖の奈落 (EDGE より右は暗い。定数グラデはキャッシュ)
        if(!abyssGrad){
          abyssGrad=g.createLinearGradient(EDGE_SX,0,W,0);
          abyssGrad.addColorStop(0,'rgba(10,6,20,.0)'); abyssGrad.addColorStop(0.25,'rgba(8,4,16,.92)'); abyssGrad.addColorStop(1,'#05030d');
        }
        g.fillStyle=abyssGrad; g.fillRect(EDGE_SX,150,W-EDGE_SX,H-150);
        // 危険ライン
        const blink=0.55+0.45*Math.sin(t*7);
        g.save();g.strokeStyle=`rgba(255,60,70,${blink})`;g.lineWidth=4;
        g.beginPath();g.moveTo(EDGE_SX,168);g.lineTo(EDGE_SX,H-150);g.stroke();
        g.fillStyle=`rgba(255,60,70,${blink*0.5})`;
        for(let y=176;y<H-150;y+=18){g.beginPath();g.moveTo(EDGE_SX-7,y);g.lineTo(EDGE_SX,y+5);g.lineTo(EDGE_SX,y-5);g.closePath();g.fill();}
        g.restore();
        // 車
        drawCar(g,cCar,COLC,LANE_C,tilt);
        drawCar(g,pCar,COLP,LANE_P,tilt);
      }
      parts.draw(g);

      // タイトル + スコア
      outlinedText(g,'🏁 チキンレース',W/2,46,26,'#ffd9a0','#3a1f1a',7);
      const pw=results.filter(r=>r.winner==='p').length, cw=results.filter(r=>r.winner==='c').length;
      if(stPhase!=='title'){
        outlinedText(g,'あなた',W/2-92,84,15,COLP.car,'#2a1020',4);
        outlinedText(g,pw+' – '+cw,W/2,86,28,'#fff','#2a1020',6);
        outlinedText(g,'CPU',W/2+92,84,15,COLC.car,'#06262a',4);
        // 条件バー: 🚗 車種(特徴) ｜ 坂
        const def=planDef(), sl=planSlope();
        outlinedText(g,'🚗 '+def.name+'('+def.trait+')  '+sl.icon+sl.name,W/2,114,13,'#ffe6cf','#2a1530',4);
        outlinedText(g,'ラウンド '+(round+1)+' / '+ROUND_PLAN.length,W/2,134,12,'#cbb8e8','#241636',3);
      }

      // ── 局面オーバーレイ ──
      if(stPhase==='title'){
        outlinedText(g,'～崖っぷちの勇気～',W/2,150,16,'#ffb38a','#3a1f1a',5);
        outlinedText(g,'🏅 ベスト '+getInt('pgp2_best_chicken',0)+'pt',W/2,178,14,'#ffd9a0','#3a1f1a',4); // #13 成績表示
        outlinedText(g,'アクセル長押しで加速、離して',W/2,300,15,'#fff','#2a1530',4);
        outlinedText(g,'崖ギリギリで止めろ！越えたら負け',W/2,324,15,'#fff','#2a1530',4);
        outlinedText(g,'むずかしさ',W/2,422,15,'#cbb8e8','#241636',4);
        for(const b of diffBtns){
          const on=b.k===diff;
          drawBtn(g,b,on?'#ff7a4d':'rgba(40,30,60,.7)',on?'#ffd9a0':'rgba(255,255,255,.25)',DIFF_LBL[b.k]);
        }
        const sb={x:W/2-120,y:540,w:240,h:64};
        g.save();g.fillStyle='#ff4d5e';rr(g,sb.x,sb.y,sb.w,sb.h,20);g.fill();g.restore();
        const bl=0.7+0.3*Math.sin(t*4);
        outlinedText(g,'▶ スタート',W/2,540+38,26,'#fff','#7a1020',7,bl);
        outlinedText(g,'タップ / Space',W/2,632,13,'#cbb8e8','#241636',3);
      }
      else if(stPhase==='count'){
        const seq=['3','2','1','GO!'], i=Math.min(cdIdx,3);
        if(i>=0){
          const sub=(cdT-i*0.62)/0.62;
          const sc=1+(1-Math.min(1,sub))*0.6;
          g.save();g.translate(W/2,360);g.scale(sc,sc);
          outlinedText(g,seq[i],0,0,seq[i]==='GO!'?64:78,seq[i]==='GO!'?'#7cff9c':'#ffd23f','#3a2a10',10);
          g.restore();
        }
      }
      else if(stPhase==='run'){
        // アクセルペダル (画面どこ押しでも加速。状態を表示)
        const on=accelOn();
        g.save();
        g.fillStyle=on?'#ff4d5e':'rgba(40,28,54,.82)';
        rr(g,PEDAL.x,PEDAL.y,PEDAL.w,PEDAL.h,PEDAL.r);g.fill();
        g.lineWidth=3;g.strokeStyle=on?'#ffd9a0':'rgba(255,120,90,.5)';
        rr(g,PEDAL.x,PEDAL.y,PEDAL.w,PEDAL.h,PEDAL.r);g.stroke();
        g.restore();
        outlinedText(g,on?'🔥 アクセル全開！':'⛽ アクセル (長押し)',W/2,PEDAL.y+50,22,'#fff',on?'#7a1020':'#3a2233',6);
        outlinedText(g,'離して崖ギリで止めろ',W/2,PEDAL.y+86,14,'#ffe6cf','#3a2233',4);
      }
      else if(stPhase==='rresult'||stPhase==='mresult'){
        g.save();g.fillStyle='rgba(10,6,22,.7)';g.fillRect(0,150,W,H-150);g.restore();
        const r=results[results.length-1];
        if(stPhase==='rresult'){
          const wtxt=r.winner==='p'?'あなたの勝ち！':r.winner==='c'?'CPUの勝ち':'引き分け';
          const wc=r.winner==='p'?COLP.car:r.winner==='c'?COLC.car:'#ffd23f';
          outlinedText(g,'ラウンド'+(round+1)+' 結果',W/2,210,18,'#cbb8e8','#241636',5);
          outlinedText(g,wtxt,W/2,256,30,wc,'#fff',8);
          const cm=v=>Math.round(v);
          outlinedText(g,'あなた: '+(r.pFell?'転落…':'崖まで '+cm(r.pGap)+'cm'),W/2,330,18,COLP.glow,'#2a1020',5);
          outlinedText(g,'CPU  : '+(r.cFell?'転落…':'崖まで '+cm(r.cGap)+'cm'),W/2,366,18,COLC.glow,'#06262a',5);
          outlinedText(g,'得点  あなた '+r.pScore+' / CPU '+r.cScore,W/2,410,15,'#fff','#241636',4);
          const nb={x:W/2-120,y:560,w:240,h:62};
          g.save();g.fillStyle='#ff4d5e';rr(g,nb.x,nb.y,nb.w,nb.h,20);g.fill();g.restore();
          outlinedText(g,round>=ROUND_PLAN.length-1?'▶ 最終結果へ':'▶ 次のラウンド',W/2,560+38,22,'#fff','#7a1020',6);
        }else{
          const mw=judgeMatch(results);
          const wtxt=mw==='p'?'🏆 あなたの勝利！':mw==='c'?'CPUの勝利…':'引き分け';
          const wc=mw==='p'?COLP.car:mw==='c'?COLC.car:'#ffd23f';
          outlinedText(g,'マッチ結果',W/2,206,20,'#cbb8e8','#241636',5);
          outlinedText(g,wtxt,W/2,252,30,wc,'#fff',8);
          let ps=0,cs=0;for(const rr2 of results){ps+=rr2.pScore;cs+=rr2.cScore;}
          outlinedText(g,'勝ち数  あなた '+pw+' – '+cw+' CPU',W/2,316,18,'#fff','#241636',5);
          outlinedText(g,'近さ得点合計  '+ps+' – '+cs,W/2,350,15,'#ffe6cf','#241636',4);
          // #13 ベスト成績 + 新記録表示
          outlinedText(g,'🏅 ベスト '+getInt('pgp2_best_chicken',0)+'pt'+(matchIsRec?'  🎉しんきろく！':''),W/2,374,14,matchIsRec?'#ffe93d':'#ffd9a0','#241636',4);
          let ry=402;
          results.forEach((rr2,i)=>{
            const s=rr2.winner==='p'?'あなた':rr2.winner==='c'?'CPU':'引分';
            outlinedText(g,'R'+(i+1)+': '+s+'  ('+(rr2.pFell?'転落':rr2.pScore+'pt')+' vs '+(rr2.cFell?'転落':rr2.cScore+'pt')+')',W/2,ry,13,'#cbb8e8','#241636',3);
            ry+=26;
          });
          const nb={x:W/2-120,y:560,w:240,h:62};
          g.save();g.fillStyle='#ff4d5e';rr(g,nb.x,nb.y,nb.w,nb.h,20);g.fill();g.restore();
          outlinedText(g,'▶ もう いちど',W/2,560+38,22,'#fff','#7a1020',6);
          outlinedText(g,'タップ / Space',W/2,636,12,'#cbb8e8','#241636',3);
        }
      }

      // 転落の赤フラッシュ
      if(flashT>0){g.save();g.globalAlpha=flashT*1.4;g.fillStyle='#ff2030';g.fillRect(0,0,W,H);g.restore();}
      g.restore();
    }

    return {
      onDown(x,y){
        held=true;                       // ポインタ押下を記録 (run中は accelOn が拾う)
        if(stPhase==='title'){
          for(const b of diffBtns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){diff=b.k;store.set('pgp2_chk_diff',b.k);A.pop();return;}
          startMatch(); A.pop(); return;
        }
        if(stPhase==='run'){ A.tone({f:150,f2:96,type:'square',dur:.05,vol:.08}); return; }
        if(stPhase==='rresult'){ nextRound(); return; }
        if(stPhase==='mresult'){ startMatch(); A.pop(); return; }
        // count 中は加速対象外 (held は run 開始まで保持され GO で発火)
      },
      onUp(){ held=false; },
      onKey(code,down){
        if(code!=='Space')return;
        if(down){
          keyHeld=true;
          if(stPhase==='title'){startMatch();A.pop();}
          else if(stPhase==='rresult'){nextRound();}
          else if(stPhase==='mresult'){startMatch();A.pop();}
          // run中は keyHeld=true を accelOn が拾って加速
        }else{ keyHeld=false; }
      },
      update,
      draw,
      hudInfo(){
        if(stPhase==='title')return 'むずかしさ: '+DIFF_LBL[diff];
        if(stPhase==='count')return 'R'+(round+1)+'/'+ROUND_PLAN.length+' よーい';
        if(stPhase==='run'){
          const cm=Math.max(0,Math.round(pCar.gap));
          return 'R'+(round+1)+'/'+ROUND_PLAN.length+' 崖'+cm+'cm';
        }
        if(stPhase==='rresult')return 'R'+(round+1)+'/'+ROUND_PLAN.length+' けっか';
        return 'マッチ終了';
      },
    };
  }
});
// 純ロジックの自動テスト公開 (?selftest で実行・core boot は不変更)
if(typeof window!=='undefined'){
  window.runChickenTests=runChickenTests;
  SELFTESTS.push(runChickenTests);
}

/* ============================================================
   起動
   ============================================================ */
boot();
</script>
