<style>
/* ============================================================
   プチゲー★パーク v2  共通スタイル（cqw/cqhでスケール）
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Hiragino Maru Gothic ProN','Hiragino Maru Gothic Pro','Hiragino Kaku Gothic ProN','M PLUS Rounded 1c',sans-serif;
  background:#221d3f;
  background-image:radial-gradient(circle at 25% 30%, #2d2752 0 2px, transparent 3px),
                   radial-gradient(circle at 75% 70%, #2d2752 0 2px, transparent 3px);
  background-size:34px 34px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  height:100dvh;
}
#stage{
  position:relative;
  width:min(450px, 100vw, calc(100dvh * 0.5675));
  aspect-ratio:420/740;
  container-type:size;
  border-radius:24px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 0 0 9px #110e26, 0 0 0 11px #4b4280, 0 26px 70px rgba(0,0,0,.55);
  touch-action:manipulation;
}
@media (pointer:coarse){
  #stage{border-radius:0;box-shadow:none;width:min(100vw, calc(100dvh * 0.5675))}
}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transform:translateY(10px) scale(.985);
  transition:opacity .22s ease, transform .22s ease}
.screen.active{opacity:1;pointer-events:auto;transform:none}

/* ---- title ---- */
#scr-title{background:linear-gradient(165deg,#ffd93d 0%,#ffab4c 45%,#ff6f91 100%);justify-content:center;gap:3.4cqw}
.float-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}

@keyframes logoBop{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
@keyframes starSpin{0%,70%{transform:rotate(0)}85%{transform:rotate(180deg) scale(1.4)}100%{transform:rotate(360deg)}}
.logo-sub{font-size:4cqw;font-weight:800;color:#7a4326;background:#fff8ec;border-radius:99px;

  box-shadow:0 .6cqw 0 rgba(150,90,0,.5)}

/* ---- game screen ---- */
#scr-game{background:#222}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:2cqw;

#hudMid{flex:1;display:flex;flex-direction:column;align-items:center;gap:.6cqw;pointer-events:none}
#hudScore{font-size:7.4cqw;font-weight:800;color:#fff;line-height:1;

#hudScore.bump{animation:bump .22s ease}

#hudTime.warn{color:#ffd23f;animation:pulse .5s ease-in-out infinite}
#hudTimeBar{width:13cqw;height:2cqw;background:rgba(20,16,40,.4);border-radius:99px;overflow:hidden;border:.4cqw solid rgba(255,255,255,.45)}
#hudTimeBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7cf29c,#41d97c);border-radius:99px}
#hudTimeBar.warn i{background:linear-gradient(90deg,#ffb44c,#ff5b5b)}

/* ---- overlays ---- */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;

.overlay.hidden{display:none}
#howtoCard{width:84cqw;background:#fffdf6;border:1cqw solid #3a2d56;border-radius:7cqw;padding:5cqw;

.hline{display:flex;gap:2.6cqw;align-items:flex-start;font-size:3.8cqw;font-weight:700;color:#564b73;line-height:1.45}
.hline .he{flex:none;font-size:4.8cqw;line-height:1.1}
#countdown{background:rgba(20,15,42,.25)}
#cdNum{font-size:30cqw;font-weight:800;color:#fff;-webkit-text-stroke:2.4cqw #4636a0;paint-order:stroke fill;

#cdNum.pop{animation:cdPop .5s ease forwards}

#banner{background:transparent;pointer-events:none}
#bannerText{font-size:10.5cqw;font-weight:800;color:#fff;-webkit-text-stroke:2cqw #b8336e;paint-order:stroke fill;
  text-shadow:0 1.6cqw 0 rgba(120,20,70,.5);white-space:nowrap}
#bannerText.pop{animation:bannerPop 1.05s ease forwards}
@keyframes bannerPop{0%{transform:scale(.2) rotate(-8deg);opacity:0}25%{transform:scale(1.1) rotate(2deg);opacity:1}
  45%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}

/* ---- サウンド確認ダイアログ ---- */
#soundAsk{z-index:60}
#sndCard{width:78cqw;background:#fffdf6;border:1cqw solid #3a2d56;border-radius:7cqw;padding:6cqw 5cqw;

  animation:popIn .38s cubic-bezier(.34,1.56,.64,1)}
#sndCard .q{font-size:5cqw;font-weight:800;color:#39304f;text-align:center;line-height:1.4}

#scr-result{background:linear-gradient(170deg,#ffe29a,#ffa99a 55%,#ff8fab);justify-content:center;gap:2.6cqw;padding:4cqw 0}

#resGameName{font-size:4.6cqw;font-weight:800;color:#fff;-webkit-text-stroke:1cqw #8a4a28;paint-order:stroke fill}
#resDaily{font-size:3cqw;font-weight:800;color:#7a5200;background:linear-gradient(180deg,#ffe9a8,#ffd23f);

#resRecord.hidden{display:none}

<div id="stage">

  <section id="scr-title" class="screen active">

    <div class="hint">タップ ／ フリック ／ ⌨️スペースでもOK</div>
  </section>

  <section id="scr-select" class="screen">
    <h2>ゲームを えらぼう！</h2>
    <div id="menuTabs">
      <button class="mtab" data-tab="solo">🎯 ひとりであそぶ <span class="tcount" id="tcount-solo"></span></button>
      <button class="mtab" data-tab="versus">⚔️ たいせん <span class="tcount" id="tcount-versus"></span></button>
    </div>
    <div id="cardList"></div>
    <button class="text-btn" id="btnBackTitle">← タイトルへ</button>
  </section>

  <section id="scr-game" class="screen">
    <canvas id="cv"></canvas>
    <div id="hud">
      <button id="btnQuit">✕</button>
      <div id="hudMid">
        <div id="hudScore">0</div>
        <div id="hudBest">BEST 0</div>
      </div>
      <div id="hudRight">
        <span id="hudTime"></span>
        <div id="hudTimeBar"><i></i></div>
      </div>
    </div>
    <div id="howto" class="overlay hidden">
      <div id="howtoCard">
        <div id="howtoTitle"></div>
        <div id="howtoLines"></div>
        <button class="big-btn" id="btnHowtoStart">スタート！</button>
      </div>
    </div>
    <div id="countdown" class="overlay hidden"><span id="cdNum"></span></div>
    <div id="banner" class="overlay hidden"><span id="bannerText"></span></div>
  </section>

  <section id="scr-result" class="screen">
    <div id="resHead"><span id="resGameName"></span><span id="resDaily" class="hidden">📅 デイリー</span></div>

<script>
'use strict';
/* ============================================================
   ユーティリティ
   ============================================================ */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const TAU=Math.PI*2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const FONT="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',sans-serif";
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const getInt=(k,d)=>parseInt(store.get(k,String(d)),10)||d;
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
/* seed付き乱数 (デイリーチャレンジ/譜面生成用) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function todayLabel(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()}
/* 計測ラッパー (GA4/Plausibleがあれば送る。なければ何もしない) */
function track(ev,params){
  try{
    if(window.gtag)window.gtag('event',ev,params||{});
    else if(window.plausible)window.plausible(ev,{props:params||{}});
  }catch(e){}
}
/* 計測: PGP_CONFIG.analytics が設定されている時だけタグを動的ロードする */
function setupAnalytics(){
  const c=(window.PGP_CONFIG||{}).analytics||{};
  if(!c.provider||!c.id)return;
  if(c.provider==='ga4'){
    const s=document.createElement('script');s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(c.id);
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){window.dataLayer.push(arguments)};
    window.gtag('js',new Date());window.gtag('config',c.id);
  }else if(c.provider==='plausible'){
    const s=document.createElement('script');s.defer=true;
    s.dataset.domain=c.id;s.src='https://plausible.io/js/script.js';
    document.head.appendChild(s);
  }
}
/* ランキングAPI: PGP_CONFIG.rankingBase 未設定なら no-op。
   実装は同リポジトリの ranking-worker/ (Cloudflare Workers + KV) を参照 */
window.PGP_RANKING={
  async submitScore(gameId,score,opts){
    const base=(window.PGP_CONFIG||{}).rankingBase;
    if(!base||!(score>0))return null;
    opts=opts||{};
    const res=await fetch(base.replace(/\/$/,'')+'/score',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({gameId,score,mode:opts.daily?'daily':'free',date:opts.date||todaySeed()})
    });
    return res.ok?res.json():null;
  },
  async fetchTop(gameId,opts){
    const base=(window.PGP_CONFIG||{}).rankingBase;
    if(!base)return null;
    opts=opts||{};
    const res=await fetch(`${base.replace(/\/$/,'')}/top?game=${encodeURIComponent(gameId)}&date=${opts.date||todaySeed()}&mode=${opts.mode||'daily'}`);
    return res.ok?res.json():null;
  }
};

function rr(g,x,y,w,h,r){
  g.beginPath();
  if(g.roundRect){g.roundRect(x,y,w,h,r);return}
  r=Math.min(r,w/2,h/2);
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function outlinedText(g,txt,x,y,size,fill,stroke,lw,alpha,align){
  g.save();
  g.globalAlpha*=(alpha==null?1:alpha);
  g.font=`800 ${size}px ${FONT}`;
  g.textAlign=align||'center';g.textBaseline='middle';
  g.lineJoin='round';
  g.lineWidth=(lw==null?Math.max(3,size/4.5):lw);
  g.strokeStyle=stroke||'#3a2a4a';
  g.strokeText(txt,x,y);
  g.fillStyle=fill||'#fff';
  g.fillText(txt,x,y);
  g.restore();
}
function emojiText(g,txt,x,y,size,alpha){
  g.save();
  g.globalAlpha*=(alpha==null?1:alpha);
  g.font=`${size}px ${FONT}`;
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(txt,x,y);
  g.restore();
}
function drawStar(g,x,y,r,rot,col){
  g.save();g.translate(x,y);g.rotate(rot||0);
  g.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5;
    const rr2=(i%2===0)?r:r*0.46;
    g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
  }
  g.closePath();g.fillStyle=col||'#ffd23f';g.fill();
  g.restore();
}
class Floaties{
  constructor(){this.list=[]}
  add(txt,x,y,col,size,life){this.list.push({txt,x,y,col:col||'#fff',size:size||20,life:life||0.9,t:0})}
  update(dt){this.list=this.list.filter(f=>(f.t+=dt)<f.life)}
  draw(g){
    for(const f of this.list){
      const k=f.t/f.life;
      const yy=f.y-easeOutCubic(k)*36;
      const a=1-Math.max(0,(k-0.55)/0.45);
      outlinedText(g,f.txt,f.x,yy,f.size,f.col,'#3a2a4a',null,a);
    }
  }
}
class Particles{
  constructor(){this.list=[]}
  add(o){this.list.push(Object.assign({x:0,y:0,vx:0,vy:0,grav:0,life:.6,t:0,r:4,col:'#fff',shape:'circle',vr:0,rot:0},o))}
  burst(x,y,n,opt){
    for(let i=0;i<n;i++){
      const a=rand(0,TAU),sp=rand(60,240);
      this.add(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grav:300,life:rand(.4,.8),r:rand(3,6)},opt));
    }
  }
  update(dt){
    this.list=this.list.filter(p=>(p.t+=dt)<p.life);
    for(const p of this.list){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;
      if(p.shape==='ring')p.r+=p.vr*dt;else p.rot+=p.vr*dt;
    }
  }
  draw(g){
    for(const p of this.list){
      const a=clamp(1-p.t/p.life,0,1);
      g.save();g.globalAlpha=a;
      if(p.shape==='star'){drawStar(g,p.x,p.y,p.r,p.rot,p.col)}
      else if(p.shape==='ring'){g.strokeStyle=p.col;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,Math.max(1,p.r),0,TAU);g.stroke()}
      else{g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill()}
      g.restore();
    }
  }
}

/* ============================================================
   サウンド (WebAudio 全合成・外部ファイルなし)
   ============================================================ */
const AudioKit={
  ctx:null,master:null,noiseBuf:null,_pour:null,_prox:null,
  muted:store.get('pgp2_muted','0')==='1',
  ensure(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.master.gain.value=this.muted?0:0.85;
    this.master.connect(this.ctx.destination);
    const len=this.ctx.sampleRate;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=buf;
  },
  now(){return this.ctx?this.ctx.currentTime:performance.now()/1000},
  setMuted(m){
    this.muted=m;store.set('pgp2_muted',m?'1':'0');
    if(this.master)this.master.gain.value=m?0:0.85;
    const b=$('muteBtn');if(b)b.textContent=m?'🔇':'🔊';
  },
  tone(o){
    if(!this.ctx)return;
    const f=o.f||440,dur=o.dur||0.15,type=o.type||'sine',vol=o.vol||0.18,when=o.when||0;
    const t0=this.ctx.currentTime+when;
    const osc=this.ctx.createOscillator(),gn=this.ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(f,t0);
    if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(o.f2,1),t0+dur);
    gn.gain.setValueAtTime(0.0001,t0);
    gn.gain.linearRampToValueAtTime(vol,t0+0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gn);gn.connect(this.master);
    osc.start(t0);osc.stop(t0+dur+0.06);
  },
  noise(o){
    if(!this.ctx)return;
    const dur=o.dur||0.2,vol=o.vol||0.2,when=o.when||0;
    const t0=this.ctx.currentTime+when;
    const src=this.ctx.createBufferSource();
    src.buffer=this.noiseBuf;src.loop=true;
    const fl=this.ctx.createBiquadFilter();
    fl.type=o.type||'lowpass';
    fl.frequency.setValueAtTime(o.f||1000,t0);
    if(o.f2)fl.frequency.exponentialRampToValueAtTime(Math.max(o.f2,1),t0+dur);
    fl.Q.value=o.q||0.9;
    const gn=this.ctx.createGain();
    gn.gain.setValueAtTime(0.0001,t0);
    gn.gain.linearRampToValueAtTime(vol,t0+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(fl);fl.connect(gn);gn.connect(this.master);
    src.start(t0);src.stop(t0+dur+0.06);
  },
  pop(){this.tone({f:520,f2:860,type:'square',dur:.07,vol:.12})},
  tick(){this.tone({f:1150,dur:.05,vol:.14})},
  go(){this.tone({f:660,dur:.12,vol:.2});this.tone({f:990,when:.1,dur:.2,vol:.18})},
  ok(){this.tone({f:520,type:'triangle',dur:.1,vol:.15})},
  good(){this.tone({f:620,dur:.08,vol:.18});this.tone({f:930,when:.07,dur:.1,vol:.16})},
  perfect(){
    this.tone({f:660,dur:.12,vol:.18});this.tone({f:880,when:.06,dur:.12,vol:.18});
    this.tone({f:1320,when:.12,dur:.16,vol:.2});
    this.noise({type:'highpass',f:7000,dur:.22,vol:.07,when:.05});
  },
  fever(){
    [660,830,990,1320,1660].forEach((f,i)=>this.tone({f,when:i*.07,dur:.14,vol:.16}));
    this.noise({type:'highpass',f:6000,dur:.4,vol:.08});
  },
  record(){
    [523,659,784,1047,1319,1568].forEach((f,i)=>this.tone({f,when:i*.09,dur:.22,vol:.17}));
    this.noise({type:'highpass',f:5500,dur:.5,vol:.08,when:.2});
  },
  bad(){this.tone({f:230,f2:150,type:'triangle',dur:.16,vol:.13})},
  miss(){this.tone({f:190,f2:140,type:'square',dur:.12,vol:.09})},
  splash(){
    this.noise({type:'lowpass',f:900,f2:300,dur:.35,vol:.3});
    this.tone({f:320,f2:80,dur:.3,vol:.12});
  },
  whoosh(){this.noise({type:'bandpass',f:700,f2:2600,dur:.14,vol:.2,q:1.4})},
  coin(){this.tone({f:880,type:'square',dur:.06,vol:.1});this.tone({f:1320,type:'square',when:.05,dur:.12,vol:.12})},
  kick(when){this.tone({f:150,f2:46,dur:.13,vol:.5,when:when||0})},
  hat(when,vol){this.noise({type:'highpass',f:6500,dur:.035,vol:vol==null?0.09:vol,when:when||0})},
  bass(when,f){this.tone({f:f||87.3,type:'triangle',dur:.2,vol:.18,when:when||0})},
  pourStart(){
    if(!this.ctx||this._pour)return;
    const src=this.ctx.createBufferSource();
    src.buffer=this.noiseBuf;src.loop=true;
    const fl=this.ctx.createBiquadFilter();
    fl.type='bandpass';fl.frequency.value=450;fl.Q.value=1.1;
    const gn=this.ctx.createGain();
    gn.gain.setValueAtTime(0.0001,this.ctx.currentTime);
    gn.gain.linearRampToValueAtTime(0.13,this.ctx.currentTime+0.08);
    src.connect(fl);fl.connect(gn);gn.connect(this.master);
    src.start();
    this._pour={src,fl,gn};
  },
  pourLevel(r){if(this._pour)this._pour.fl.frequency.value=430+clamp(r,0,1.1)*900},
  pourStop(){
    if(!this._pour)return;
    const p=this._pour;this._pour=null;
    try{
      p.gn.gain.linearRampToValueAtTime(0.0001,this.ctx.currentTime+0.08);
      p.src.stop(this.ctx.currentTime+0.1);
    }catch(e){}
  },
  /* スポットライト接近音 (近いほど大きく・高く) */
  proxStart(){
    if(!this.ctx||this._prox)return;
    const osc=this.ctx.createOscillator(),gn=this.ctx.createGain();
    osc.type='sine';osc.frequency.value=600;
    gn.gain.value=0.0001;
    osc.connect(gn);gn.connect(this.master);
    osc.start();
    this._prox={osc,gn};
  },
  proxSet(closeness){ /* 0(遠い)〜1(重なり) */
    if(!this._prox)return;
    const c=clamp(closeness,0,1);
    this._prox.gn.gain.setTargetAtTime(c*c*0.07,this.ctx.currentTime,0.03);
    this._prox.osc.frequency.setTargetAtTime(500+c*700,this.ctx.currentTime,0.03);
  },
  proxStop(){
    if(!this._prox)return;
    const p=this._prox;this._prox=null;
    try{
      p.gn.gain.linearRampToValueAtTime(0.0001,this.ctx.currentTime+0.06);
      p.osc.stop(this.ctx.currentTime+0.1);
    }catch(e){}
  }
};

/* ============================================================
   コア (画面遷移・ループ・入力集約・共通判定・フィーバー・記録)
   ============================================================ */
const W=420,H=740;
const cv=$('cv'), g2d=cv.getContext('2d');
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

const GAMES=[];
function registerGame(def){GAMES.push(def)}
// メニュー分類: versus=たいせん / それ以外=ひとり (新規ゲームも type で自動振り分け)
const soloGames=()=>GAMES.filter(g=>g.type!=='versus');
const versusGames=()=>GAMES.filter(g=>g.type==='versus');
// デイリー抽選は「ひとり(非versus)」プールのみから選ぶ (versusはスコア競争にならないため除外)
const dailyDef=()=>{const s=soloGames();return s[todaySeed()%s.length]};
let menuTab=store.get('pgp2_menutab','solo')==='versus'?'versus':'solo'; // アクティブタブ (localStorage復元)

/* ---- 段階判定テーブル (全ゲーム共通) ----
   success:true の判定だけがコンボ+スコア。失敗系は減点なし(コンボ解除のみ) */
const JUDGE={
  perfect:{label:'PERFECT!!',pts:100,col:'#ffd23f',stroke:'#7a4a00',sfx:'perfect',vib:[22],success:true},
  great:  {label:'GREAT!',   pts:60, col:'#7cf29c',stroke:'#1c6a3a',sfx:'good',vib:[12],success:true},
  good:   {label:'GOOD',     pts:30, col:'#8fd0ff',stroke:'#1c4a7a',sfx:'ok',vib:[8],success:true},
  early:  {label:'EARLY…',   pts:0,  col:'#bcd6ff',stroke:'#3a4a6a',sfx:'miss'},
  late:   {label:'LATE…',    pts:0,  col:'#bcd6ff',stroke:'#3a4a6a',sfx:'miss'},
  miss:   {label:'MISS',     pts:0,  col:'#aab0c8',stroke:'#444a66',sfx:'miss'},
  few:    {label:'すくない…', pts:0,  col:'#bcd6ff',stroke:'#3a4a6a',sfx:'miss'},
  over:   {label:'あふれた！', pts:0,  col:'#ffb3b3',stroke:'#7a2a2a',sfx:'splash'},
  wrong:  {label:'ちがう！',  pts:0,  col:'#ffb3b3',stroke:'#7a2a2a',sfx:'bad'},
};
const FEVER_AT=8, FEVER_DUR=6;
const TITLES=[[0,'みならいプレイヤー'],[10,'いっちょまえ'],[30,'たつじん'],[80,'でんせつ']];
const UNLOCKS=[
  {game:'tea', at:5, name:'まっちゃカラー'},{game:'tea', at:15,name:'よぞらカラー'},
  {game:'lane',at:5, name:'ゆうやけレーン'},{game:'lane',at:15,name:'ネオンレーン'},
  {game:'spot',at:5, name:'ピンクライト'},{game:'spot',at:15,name:'レインボーライト'},
];

let curDef=null,game=null,phase='idle',elapsed=0,rafId=0,lastTs=0;
let lastSec=-1,lastHudScore=null;
let score=0,combo=0,maxCombo=0,judgeCounts={},feverT=0,feverCount=0;
let isDaily=false,seed=0,bestKey='',best=0,bestBeaten=false;
let judgePop=null,resultInfo=null;
const coreFlo=new Floaties(),coreParts=new Particles();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
}
function resizeCanvas(){
  const r=cv.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
}
window.addEventListener('resize',()=>{resizeCanvas()});

function playsOf(id){return getInt('pgp2_plays_'+id,0)}
function skinLevelFor(id){
  const p=playsOf(id);
  const lv=p>=15?2:p>=5?1:0;
  return randi(0,lv); // 解放済みからランダム適用
}
function titleFor(total){
  let t=TITLES[0][1];
  for(const [at,name] of TITLES)if(total>=at)t=name;
  return t;
}
function curMult(){return (1+Math.min(Math.max(combo-1,0),20)*0.05)*(feverT>0?2:1)}

/* ---- 共通判定: ゲームはこれを呼ぶだけ ---- */
function coreJudge(kind,x,y,opts){
  opts=opts||{};
  const j=JUDGE[kind];if(!j)return 0;
  judgeCounts[kind]=(judgeCounts[kind]||0)+1;
  let pts=0;
  if(j.success){
    combo++;maxCombo=Math.max(maxCombo,combo);
    pts=Math.round(j.pts*curMult());
    score+=pts;
    AudioKit[j.sfx]();
    if(j.vib)vib(j.vib);
    if(kind==='perfect'){
      coreParts.burst(x,y,12,{shape:'star',col:'#ffd23f',grav:150});
      coreParts.add({x,y,shape:'ring',r:18,vr:320,life:.4,col:'#ffd23f'});
    }else if(kind==='great'){
      coreParts.burst(x,y,7,{shape:'star',col:'#7cf29c',grav:200});
    }else{
      coreParts.burst(x,y,5,{col:'#8fd0ff',grav:240});
    }
    coreFlo.add('+'+pts,x,y-34,'#fff',20);
    if(combo>0&&combo%FEVER_AT===0)startFever();
    if(!bestBeaten&&best>0&&score>best){
      bestBeaten=true;
      coreFlo.add('BEST こうしん！！',W/2,300,'#ffd23f',24,1.3);
      coreParts.add({x:W/2,y:300,shape:'ring',r:30,vr:380,life:.5,col:'#ffd23f'});
      AudioKit.fever();vib([30,40,30]);
    }
  }else{
    combo=0;
    AudioKit[j.sfx]();
  }
  judgePop={kind,t:0,sub:opts.sub||null};
  return pts;
}
function startFever(){
  feverT=FEVER_DUR;feverCount++;
  AudioKit.fever();vib([30,50,30,50,30]);
  coreFlo.add('⚡FEVER TIME ×2⚡',W/2,260,'#ffe93d',26,1.4);
  track('fever',{game:curDef&&curDef.id});
}

function makeCtx(def,rng,plays){
  return {
    W,H,audio:AudioKit,duration:def.duration,type:def.type,
    rng,seed,daily:isDaily,
    rookie:plays<3,
    skinLevel:skinLevelFor(def.id),
    judge:coreJudge,
    comboBreak:()=>{combo=0},
    flo:coreFlo,
    isFever:()=>feverT>0,
    score:()=>score,combo:()=>combo,
    getElapsed:()=>elapsed,
    finishGame(o){finishFromGame(o||{})}
  };
}

function openGame(def,opts){
  opts=opts||{};
  curDef=def;isDaily=!!opts.daily;

function startCountdown(quick){
  $('howto').classList.add('hidden');
  if(curDef&&curDef.type==='versus'){ // versusは制限時間なし: カウントダウン省略で即プレイ
    phase='play';lastTs=performance.now();
    return;
  }
  phase='count';
  const ov=$('countdown'),num=$('cdNum');
  ov.classList.remove('hidden');
  const seq=quick?['GO!']:['3','2','1','GO!'];
  let i=0;
  const step=()=>{
    if(phase!=='count')return;
    num.textContent=seq[i];
    num.classList.remove('pop');void num.offsetWidth;num.classList.add('pop');
    if(seq[i]==='GO!')AudioKit.go();else AudioKit.tick();
    i++;
    if(i<seq.length){setTimeout(step,500)}
    else setTimeout(()=>{
      if(phase!=='count')return;
      ov.classList.add('hidden');
      phase='play';lastTs=performance.now();
    },quick?420:500);
  };
  step();
}
function startLoop(){
  cancelAnimationFrame(rafId);
  lastTs=performance.now();
  const step=ts=>{
    rafId=requestAnimationFrame(step);
    const dt=clamp((ts-lastTs)/1000,0,0.05);
    lastTs=ts;
    if(phase==='play'){
      elapsed+=dt;
      feverT=Math.max(0,feverT-dt);
      if(feverT>0&&Math.random()<0.35) // フィーバー中: 画面下から星が噴き上がる
        coreParts.add({x:rand(10,W-10),y:H+12,vx:rand(-25,25),vy:-rand(170,300),
          shape:'star',col:`hsl(${randi(0,360)},90%,65%)`,life:rand(.7,1.2),r:rand(4,8),vr:rand(-4,4)});
      game.update(dt);
      if(curDef.duration&&elapsed>=curDef.duration)timeUp();
    }
    if(phase==='play'||phase==='over'){
      if(judgePop&&(judgePop.t+=dt)>0.62)judgePop=null;
      coreFlo.update(dt);coreParts.update(dt);
    }
    hudUpdate();
    drawFrame();
  };
  rafId=requestAnimationFrame(step);
}
function stopLoop(){cancelAnimationFrame(rafId)}
function drawFrame(){

/* コア共通オーバーレイ: フィーバー枠・判定ポップ・コンボ・ニアベスト */
function drawCoreOverlay(g){
  if(feverT>0){
    const hue=(performance.now()/5)%360;
    g.save();
    // 背景全体がうっすら虹色に脈動
    g.globalAlpha=0.08+0.04*Math.sin(performance.now()/170);
    g.fillStyle=`hsl(${hue},90%,60%)`;
    g.fillRect(0,0,W,H);
    g.globalAlpha=1;
    g.lineWidth=20;g.strokeStyle=`hsla(${hue},95%,70%,.3)`;
    rr(g,8,8,W-16,H-16,26);g.stroke();
    g.lineWidth=8;g.strokeStyle=`hsla(${hue},95%,62%,.9)`;
    rr(g,5,5,W-10,H-10,24);g.stroke();
    outlinedText(g,'⚡FEVER ×2⚡',W/2,98,20,`hsl(${hue},95%,72%)`,'#3a2a4a',6);
    g.restore();
  }
  if(combo>=2&&phase==='play'){
    const m=curMult();
    outlinedText(g,`🔥${combo}コンボ ×${m.toFixed(2)}`,W/2,128,16,'#ffd23f','#5a3a10',5);
    // つぎのフィーバーまでゲージ
    const k=(combo%FEVER_AT)/FEVER_AT;
    g.save();
    g.fillStyle='rgba(20,16,40,.4)';rr(g,W/2-52,140,104,6,3);g.fill();
    g.fillStyle='#ffd23f';rr(g,W/2-52,140,104*(k===0?1:k),6,3);g.fill();
    g.restore();
  }
  if(judgePop){
    const j=JUDGE[judgePop.kind];
    const k=judgePop.t/0.62;
    const sc=k<0.2?easeOutBack(k/0.2):1;
    const al=k>0.7?1-(k-0.7)/0.3:1;
    g.save();
    g.translate(W/2,196);g.scale(sc,sc);
    outlinedText(g,j.label,0,0,j.success?36:28,j.col,j.stroke,8,al);
    if(judgePop.sub)outlinedText(g,judgePop.sub,0,34,15,'#fff','#3a2a4a',4,al);
    g.restore();
  }
  if(phase==='play'&&!bestBeaten&&best>0){
    const diff=best-score;
    if(diff>0&&diff<=60){
      const blink=0.6+0.4*Math.sin(performance.now()/150);
      outlinedText(g,`BESTまで あと${diff}てん！`,W/2,H-46,16,'#ffd23f','#5a3a10',5,blink);
    }
  }
  coreParts.draw(g);coreFlo.draw(g);
}
function hudUpdate(){

/* ---- 結果画面 ---- */
/* ゲーム別「つぎのいって」: 判定内訳から弱点を1つ提案する (必ず文字列を返す) */
function gameHint(def,c,mx){
  c=c||{};
  if(def.id==='tea'){
    if((c.over||0)>=2)return '0.1びょう はやく はなして あふれゼロ';
    if(!(c.perfect>0))return 'キンいろ どまんなかで PERFECT';
    if((c.few||0)>=2)return 'ラインぎりぎりまで ねばろう';
    return 'PERFECT を もう1かい';
  }
  if(def.id==='lane'){
    if((mx||0)<3)return 'つづけて 3コンボ';
    if((c.wrong||0)>=2)return 'おだい いがいは スルーしよう';
    if(!(c.perfect>0))return 'まんなかゾーンで PERFECT';
    return 'ジャストPERFECT を ふやそう';
  }
  if(def.id==='spot'){
    const e=c.early||0,l=c.late||0;
    if(e+l>0)return e>=l?'すこし まって EARLYをGOODに':'すこし はやめに LATEをGOODに';
    if((c.miss||0)>=3)return 'ひかりが かさなるまで まとう';
    if(!(c.perfect>0))return 'どまんなかで PERFECT';
    return 'PERFECT を もう1かい';
  }
  return 'PERFECT を 1かい';
}
/* 結果画面の目標文言。0点どうし/ベストタイ/あと0点を明示的に処理 */
function goalText(def,score,best,isRec,c,mx,last){
  const hint=gameHint(def,c,mx);
  if(score===0&&best===0){
    return {tea:'🍵 まずは1ぱい そそいでみよう！',
            lane:'🍣 まずは1こ ゲットしてみよう！',
            spot:'💡 まずは1かい あわせてみよう！'}[def.id]||'🎯 まずは1こ ゲットしよう！';
  }
  if(!isRec&&score===best&&score>0)return '🤝 ベストタイ！あと1てんで しんきろく！';
  if(isRec)return `🎉 しんきろく！つぎは「${hint}」`;
  if(best-score<=80)return `😆 おしい！あと${best-score}てん：${hint}`;
  if(last>=0&&score>last)return `📈 まえより+${score-last}てん！つぎは「${hint}」`;
  return `🎯 ${hint}`;
}

/* きょうのランキング表示 (デイリー結果画面)。エントリが無ければ何も出さない */

/* ---- 入力 (コアに集約: ゲームはフックを実装するだけ) ---- */
function evtXY(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
let ptr=null;
cv.addEventListener('pointerdown',e=>{
  AudioKit.ensure();
  if(phase!=='play'||!game)return;
  const p=evtXY(e);
  ptr={id:e.pointerId,x0:p.x,y0:p.y,t0:performance.now(),flicked:false};
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  if(game.onDown)game.onDown(p.x,p.y);
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id||!game)return;
  const p=evtXY(e);
  if(game.onMove)game.onMove(p.x,p.y);
  if(!ptr.flicked){
    const dx=p.x-ptr.x0,dy=p.y-ptr.y0;
    const dt=(performance.now()-ptr.t0)/1000;
    if(Math.hypot(dx,dy)>44&&dt<0.34){
      ptr.flicked=true;
      if(phase==='play'&&game.onFlick)game.onFlick({x0:ptr.x0,y0:ptr.y0,x:p.x,y:p.y,dx,dy,dt});
    }
  }
});
function ptrUp(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  const p=evtXY(e);
  const info={heldMs:performance.now()-ptr.t0,flicked:ptr.flicked};
  ptr=null;
  if(phase==='play'&&game&&game.onUp)game.onUp(p.x,p.y,info);
}
cv.addEventListener('pointerup',ptrUp);
cv.addEventListener('pointercancel',ptrUp);

document.addEventListener('keydown',e=>{
  AudioKit.ensure();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'){
    if($('scr-game').classList.contains('active'))quitGame();
    else if($('scr-result').classList.contains('active'))show('scr-select');
    return;
  }
  if($('scr-result').classList.contains('active')&&(e.code==='Space'||e.code==='Enter')){
    if(!e.repeat)$('btnRetryBig').click();
    return;
  }
  if(phase==='howto'&&(e.code==='Space'||e.code==='Enter')){startCountdown(false);AudioKit.pop();return}
  if(e.repeat)return;
  if(phase==='play'&&game&&game.onKey)game.onKey(e.code,true);
});

  $('titleRank').textContent='🏅 '+titleFor(getInt('pgp2_plays_total',0))+'（'+getInt('pgp2_plays_total',0)+'プレイ）';
}

      <span class="ds">きょうは みんな おなじもんだい！</span>

    dc.addEventListener('click',()=>{AudioKit.ensure();AudioKit.pop();openGame(ddef,{daily:true})});

        : `<span class="bs" id="best-${def.id}">ベスト 0</span>`}</span>
      <span class="qbtn" data-q="${def.id}">?</span>`;

     &&!['localhost','127.0.0.1'].includes(location.hostname)){

/* ============================================================
   ▼▼▼ ミニゲーム登録ゾーン ▼▼▼
   registerGame({...}) を追加するだけで選択画面に並ぶ。
   create(ctx) の ctx には W,H,audio,rng,seed,daily,rookie,skin,
   judge(),isFever(),score(),combo(),finishGame() が入る。
   入力はコアが集約: ゲームは onDown/onUp/onFlick/onKey を実装する
   (自前で addEventListener しないこと)
   ============================================================ */
/* ============================================================
   ゲームA: おちゃそそぎ名人 (ゲージ制御 / 25秒)
   ============================================================ */
registerGame({
  id:'tea', emoji:'🍵', title:'おちゃそそぎ名人',
  desc:'ながおしで キンいろゾーンを ねらえ！',
  color:'#b7e4a0', duration:25,
  howto:[
    ['🫖','ながおし（おしっぱなし）で おちゃをそそぐ'],
    ['🏆','キンいろゾーンで はなすと PERFECT 100てん！'],
    ['💦','ラインをこえると あふれ（0てん）。へらないから あんしん'],
    ['🔥','れんぞくせいこうで ばいりつ＆フィーバー！'],
    ['⌨️','スペースキー ながおしでもOK'],
  ],
  create(ctx){
    const A=ctx.audio,RNG=ctx.rng;
    const SKINS=[
      {bgT:'#fdf3da',bgB:'#eed5a3',tatami:'#d9c283',cols:['#9ed0e8','#f2eede','#ffb3a7','#8d92ff','#d6f0fc'],moon:false},
      {bgT:'#eaf5d8',bgB:'#cfe8b5',tatami:'#b5cf8a',cols:['#bfe3b2','#f4f0e0','#9fd8a8','#7fc97f','#e2f3d2'],moon:false},
      {bgT:'#2c2a55',bgB:'#1c1a3d',tatami:'#3d3a6e',cols:['#7f8ad6','#cdd3ff','#9aa3e8','#5d68c4','#b9c2ff'],moon:true},
    ];
    const skin=SKINS[ctx.skinLevel]||SKINS[0];
    const CUPS=[
      {name:'ゆのみ',     topW:104,botW:84, h:110,line:.78,fill:1.6, deco:'band'},
      {name:'おちょこ',   topW:80, botW:58, h:62, line:.74,fill:.9,  deco:'dot'},
      {name:'マグカップ', topW:106,botW:100,h:116,line:.82,fill:1.8, deco:'flower',handle:true},
      {name:'どんぶり',   topW:182,botW:104,h:120,line:.85,fill:2.4, deco:'band'},
      {name:'ロンググラス',topW:90,botW:76, h:150,line:.86,fill:2.0, deco:'none',glass:true},
    ];
    CUPS.forEach((c,i)=>c.col=skin.cols[i]);
    const CX=232,BASE=566;
    const K=ctx.rookie?{p:.95,g1:.89,g2:.80}:{p:.97,g1:.92,g2:.85}; // 判定しきい値(初心者は広め)
    let cup=null,lastIdx=-1,cupNum=0;
    let pouring=false,holdT=0,pourVis=0,lastM=0;
    let t=0,phaseT=0,wavePhase=0,shakeT=0,zoneDinged=false;
    const flo=new Floaties(),parts=new Particles();

    function newCup(slideIn){
      cupNum++;
      let i;
      if(cupNum===1)i=0; // 1個目はゆのみ固定・速度固定
      else{do{i=Math.floor(RNG()*CUPS.length)}while(i===lastIdx)}
      lastIdx=i;
      const d=CUPS[i];
      let fillTime;
      if(cupNum===1)fillTime=ctx.rookie?1.95:1.6;
      else{
        const speedUp=lerp(1,0.66,clamp(t/25,0,1))*(ctx.rookie?1.22:1);
        fillTime=d.fill*speedUp*(0.92+RNG()*0.18);
      }
      cup={d,fill:0,state:slideIn?'in':'ready',x:slideIn?W+150:CX,spd:1/fillTime};
      phaseT=0;zoneDinged=false;
    }
    newCup(false);

    function surfaceY(){
      const innerH=cup.d.h-14;
      const fillH=Math.min(innerH,innerH*cup.d.line*cup.fill);
      return BASE-6-fillH;
    }
    function startPour(){
      if(!cup||cup.state!=='ready')return;
      cup.state='pour';pouring=true;holdT=0;
      A.pourStart();
    }
    function endPour(){
      if(!cup||cup.state!=='pour')return;
      pouring=false;A.pourStop();
      judgePour();
    }
    function judgePour(){
      const r=cup.fill;
      const topY=BASE-cup.d.h-40;
      if(r<0.05){cup.state='ready';flo.add('ながおしで そそごう！',CX,400,'#fff',18);return}
      if(r>=1.0){
        const overSec=(r-1.0)/cup.spd;
        const sub=overSec<0.15?`あと ${Math.max(0.02,overSec).toFixed(2)}びょう はやければ…！`:null;
        ctx.judge('over',CX,topY,{sub});
        shakeT=0.35;
        for(let i=0;i<16;i++)parts.add({x:CX+rand(-cup.d.topW/2,cup.d.topW/2),y:surfaceY(),
          vx:rand(-130,130),vy:rand(-220,-40),grav:640,life:rand(.5,.9),r:rand(3,5.5),col:pick(['#b9d96d','#9cc653'])});
      }else if(r>=K.p){
        ctx.judge('perfect',CX,topY);
      }else if(r>=K.g1){
        ctx.judge('great',CX,topY);
      }else if(r>=K.g2){
        ctx.judge('good',CX,topY);
      }else{
        const lack=Math.round((K.g2-r)*100);
        ctx.judge('few',CX,topY,{sub:lack<=8?`あと ${lack}% だった…！`:`あと ${lack}% たりない`});
      }
      cup.state='judge';phaseT=0;
    }

    function cupPath(g,x,by,tw2,bw2,h){
      g.beginPath();
      g.moveTo(x-tw2,by-h);
      g.lineTo(x-bw2,by-10);
      g.quadraticCurveTo(x-bw2,by,x-bw2+10,by);
      g.lineTo(x+bw2-10,by);
      g.quadraticCurveTo(x+bw2,by,x+bw2,by-10);
      g.lineTo(x+tw2,by-h);
      g.closePath();
    }
    function potTip(tilt){
      const c=Math.cos(tilt),s=Math.sin(tilt);
      return {x:150+62*c+30*s,y:352+62*s-30*c};
    }
    function drawPot(g,tilt){
      g.save();g.translate(150,352);g.rotate(tilt);
      g.lineWidth=4;g.strokeStyle='#3c5236';
      g.fillStyle='#5f7d54';
      g.beginPath();g.moveTo(8,-18);g.lineTo(62,-34);g.lineTo(66,-24);g.lineTo(14,-2);g.closePath();
      g.fill();g.stroke();
      g.beginPath();g.ellipse(-26,2,46,36,0,0,TAU);g.fill();g.stroke();
      g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=5;
      g.beginPath();g.ellipse(-26,10,40,24,0,0.15*Math.PI,0.85*Math.PI);g.stroke();
      g.lineWidth=4;g.strokeStyle='#3c5236';
      g.fillStyle='#4c6a45';
      g.beginPath();g.ellipse(-26,-30,26,10,0,0,TAU);g.fill();g.stroke();
      g.fillStyle='#8aa37d';g.beginPath();g.arc(-26,-40,8,0,TAU);g.fill();g.stroke();
      g.save();g.translate(-68,-12);g.rotate(-0.55);
      g.fillStyle='#c9a36b';rr(g,-36,-9,40,18,9);g.fill();
      g.strokeStyle='#8a6a3a';g.lineWidth=4;g.stroke();
      g.restore();
      g.fillStyle='#2e3d2a';
      g.beginPath();g.arc(-38,-4,3.4,0,TAU);g.fill();
      g.beginPath();g.arc(-14,-4,3.4,0,TAU);g.fill();
      g.strokeStyle='#2e3d2a';g.lineWidth=3;
      g.beginPath();g.arc(-26,4,6,0.15*Math.PI,0.85*Math.PI);g.stroke();
      g.restore();
    }
    function drawCup(g,c){
      const d=c.d,x=c.x;
      const tw2=d.topW/2,bw2=d.botW/2,h=d.h,topY=BASE-h;
      const innerH=h-14,lineH=innerH*d.line,lineY=BASE-6-lineH;
      const inZone=c.fill>=K.g2&&c.fill<1.0;
      g.fillStyle='rgba(0,0,0,.13)';
      g.beginPath();g.ellipse(x,BASE+9,bw2+18,9,0,0,TAU);g.fill();
      cupPath(g,x,BASE,tw2,bw2,h);
      g.fillStyle=d.glass?'rgba(220,242,252,.65)':d.col;
      g.fill();
      g.lineWidth=5;g.strokeStyle='#4a3b2a';g.stroke();
      g.save();
      cupPath(g,x,BASE,tw2,bw2,h);g.clip();
      if(d.deco==='band'){g.fillStyle='rgba(255,255,255,.4)';g.fillRect(x-tw2,BASE-h*0.58,d.topW,14)}
      else if(d.deco==='dot'){g.fillStyle='rgba(90,140,200,.5)';
        for(let i=-1;i<=1;i++){g.beginPath();g.arc(x+i*22,BASE-h*0.5,5,0,TAU);g.fill()}}
      else if(d.deco==='flower'){emojiText(g,'🌸',x,BASE-h*0.5,18)}
      if(d.glass){g.fillStyle='rgba(255,255,255,.55)';rr(g,x-tw2+10,topY+12,9,h-30,5);g.fill()}
      // 判定ゾーン帯 (GOOD帯=みどり, PERFECT帯=きん)
      const zy=(rr01)=>BASE-6-lineH*rr01;
      g.fillStyle='rgba(120,220,140,.3)';
      g.fillRect(x-tw2,zy(1),d.topW,zy(K.g2)-zy(1));
      g.fillStyle=inZone?'rgba(255,210,63,.65)':'rgba(255,210,63,.4)';
      g.fillRect(x-tw2,zy(1),d.topW,zy(K.p)-zy(1));
      // おちゃ (ゾーン内はキンいろに変化)
      const fillH=Math.min(innerH,lineH*c.fill);
      if(fillH>0.5){
        const sy=BASE-6-fillH;
        g.fillStyle=inZone?'#e8c84f':'#b9d96d';
        g.fillRect(x-tw2,sy,d.topW,fillH+8);
        const hw=Math.max(4,lerp(bw2,tw2,(fillH+6)/h)-6);
        const bob=(c.state==='pour')?Math.sin(wavePhase*7)*1.8:0;
        g.fillStyle=inZone?'#ffe9a0':'#dcefa6';
        g.beginPath();g.ellipse(x,sy+bob,hw,4.5,0,0,TAU);g.fill();
      }
      g.restore();
      g.beginPath();g.ellipse(x,topY,tw2,6,0,0,TAU);
      g.strokeStyle='#4a3b2a';g.lineWidth=5;g.stroke();
      // まんタンライン (ゾーン内は点滅)
      const lw2=Math.max(8,lerp(bw2,tw2,(lineH+6)/h)-3);
      g.save();g.setLineDash([7,5]);
      const blink=inZone&&Math.sin(performance.now()/70)>0;
      g.strokeStyle=blink?'#ffd23f':'#ff5252';g.lineWidth=blink?4:3;
      g.beginPath();g.moveTo(x-lw2,lineY);g.lineTo(x+lw2,lineY);g.stroke();
      g.restore();
      outlinedText(g,'ここまで',x+tw2+44,lineY,13,inZone?'#ffd23f':'#ff6b6b','#fff',3);
      if(d.handle){
        g.beginPath();g.arc(x+tw2+10,BASE-h*0.5,20,-1.15,1.15);
        g.lineWidth=10;g.strokeStyle='#4a3b2a';g.stroke();
        g.lineWidth=5;g.strokeStyle=d.col;g.stroke();
      }
      outlinedText(g,d.name,x,BASE+30,15,'#fff','#7a5a36',4);
    }

    const self={
      update(dt){
        t+=dt;phaseT+=dt;
        wavePhase+=dt*(pouring?9:3);
        shakeT=Math.max(0,shakeT-dt);
        pourVis+=((pouring?1:0)-pourVis)*Math.min(1,dt*11);
        if(cup){
          if(cup.state==='in'){
            cup.x+=(CX-cup.x)*Math.min(1,dt*10);
            if(Math.abs(cup.x-CX)<2&&phaseT>0.18){cup.x=CX;cup.state='ready'}
          }else if(cup.state==='pour'){
            holdT+=dt;
            lastM=Math.min(1,Math.pow(holdT/0.38,1.3));
            cup.fill+=dt*lastM*cup.spd;
            A.pourLevel(cup.fill);
            if(cup.fill>=K.g2&&!zoneDinged){
              zoneDinged=true;
              A.tone({f:1240,dur:.09,vol:.15});A.tone({f:1560,when:.07,dur:.1,vol:.13});
            }
            if(Math.random()<0.45)
              parts.add({x:CX+rand(-8,8),y:surfaceY(),vx:rand(-50,50),vy:rand(-90,-20),
                grav:500,life:.3,r:rand(1.5,2.8),col:'#cfe78e'});
            if(cup.fill>=1.05){pouring=false;A.pourStop();judgePour()}
          }else if(cup.state==='judge'){
            if(phaseT>0.62){cup.state='out';phaseT=0}
          }else if(cup.state==='out'){
            cup.x-=dt*1000;
            if(cup.x<-170)newCup(true);
          }
        }
        flo.update(dt);parts.update(dt);
      },
      draw(g){
        g.save();
        if(shakeT>0)g.translate(rand(-3.5,3.5),rand(-3.5,3.5));
        const bg=g.createLinearGradient(0,0,0,H);
        bg.addColorStop(0,skin.bgT);bg.addColorStop(1,skin.bgB);
        g.fillStyle=bg;g.fillRect(-8,-8,W+16,H+16);
        if(skin.moon){
          g.fillStyle='#ffe9a0';g.beginPath();g.arc(350,120,30,0,TAU);g.fill();
          g.fillStyle=skin.bgT;g.beginPath();g.arc(338,112,26,0,TAU);g.fill();
          g.fillStyle='rgba(255,255,255,.6)';
          for(let i=0;i<10;i++){g.beginPath();g.arc((i*97+30)%W,(i*53)%200+40,1.6,0,TAU);g.fill()}
        }else{
          g.fillStyle='rgba(255,255,255,.4)';
          for(let i=0;i<6;i++){g.beginPath();g.arc(40+i*70,100+(i%2)*510,26,0,TAU);g.fill()}
        }
        g.fillStyle=skin.tatami;g.fillRect(-8,620,W+16,H-612);
        g.strokeStyle='rgba(80,60,30,.3)';g.lineWidth=2;
        for(let i=0;i<5;i++){g.beginPath();g.moveTo(i*105,620);g.lineTo(i*105,H);g.stroke()}
        g.fillStyle='#8a5a36';rr(g,CX-128,BASE+2,256,26,12);g.fill();
        g.strokeStyle='#6a421f';g.lineWidth=4;g.stroke();
        if(cup)drawCup(g,cup);
        const tilt=pourVis*0.45;
        drawPot(g,tilt);
        if(pourVis>0.03&&cup&&(cup.state==='pour'||pourVis>0.1)){
          const tip=potTip(tilt);
          const sy=surfaceY();
          const tx=CX+Math.sin(wavePhase*6)*2.5;
          const sw=8*pourVis*(0.35+0.65*lastM);
          if(sw>0.6){
            const inZone=cup.fill>=K.g2;
            g.strokeStyle=inZone?'rgba(232,200,79,.95)':'rgba(167,207,93,.92)';
            g.lineCap='round';g.lineWidth=sw;
            g.beginPath();g.moveTo(tip.x,tip.y);
            g.quadraticCurveTo(tip.x+(tx-tip.x)*0.22,tip.y+(sy-tip.y)*0.55,tx,sy);
            g.stroke();
            g.strokeStyle='rgba(255,240,190,.9)';g.lineWidth=sw*0.4;
            g.beginPath();g.moveTo(tip.x,tip.y);
            g.quadraticCurveTo(tip.x+(tx-tip.x)*0.22,tip.y+(sy-tip.y)*0.55,tx,sy);
            g.stroke();
          }
        }
        if(cup&&cup.fill>0.5){
          g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=4;g.lineCap='round';
          for(let i=0;i<2;i++){
            const sx=CX-14+i*28,ph=wavePhase*1.5+i*2;
            g.beginPath();
            g.moveTo(sx,BASE-cup.d.h-14);
            g.bezierCurveTo(sx+Math.sin(ph)*8,BASE-cup.d.h-34,sx-Math.sin(ph)*8,BASE-cup.d.h-52,sx+Math.sin(ph*0.8)*10,BASE-cup.d.h-70);
            g.stroke();
          }
        }
        parts.draw(g);flo.draw(g);
        if(cup&&cup.state==='ready'&&cupNum===1&&t<6)
          outlinedText(g,'ながおしで キンいろを ねらえ！',CX,408,17,'#fff','#caa04a',5);
        g.restore();
      },
      onDown(){startPour()},
      onUp(){endPour()},
      onKey(code,down){
        if(code==='Space'||code==='Enter'){down?startPour():endPour()}
      },
      onTimeUp(){if(pouring){pouring=false;A.pourStop()}},
      finish(){A.pourStop();return {}},
      destroy(){A.pourStop()},
    };
    return self;
  }
});

/* ============================================================
   ゲームB: くるくるレーン (スワイプ仕分け / 25秒)
   まんなかの「ジャストゾーン」で取るほど高判定
   ============================================================ */
registerGame({
  id:'lane', emoji:'🍣', title:'くるくるレーン',
  desc:'おだいのものを まんなかで 上フリック！',
  color:'#ffd6a5', duration:25,
  howto:[
    ['📋','うえの「おだい」に あうものだけ 上にフリック！'],
    ['🎯','まんなかの キンいろゾーンで とると PERFECT！'],
    ['🙅','ちがうものは ほうっておく（とると コンボがきれる）'],
    ['⚡','れんぞくせいこうで フィーバー！ぜんぶ せいかいになる！'],
    ['⌨️','↑キー ＝ まんなかのものを とる'],
  ],
  create(ctx){
    const A=ctx.audio,RNG=ctx.rng;
    const SKINS=[
      {wallT:'#fff3df',wallM:'#ffe3b8',wallB:'#ffd49a',counter:'#c98a5b',noren:'#ff8a5c',night:false},
      {wallT:'#ffd9a8',wallM:'#ff9a6c',wallB:'#e2607a',counter:'#8a4a4a',noren:'#d4544f',night:false},
      {wallT:'#1c1a3d',wallM:'#2c2a55',wallB:'#3d2a5e',counter:'#2a2348',noren:'#ff4d94',night:true},
    ];
    const skin=SKINS[ctx.skinLevel]||SKINS[0];
    const CATS=[
      {name:'くだもの', col:'#ff5c8a', items:['🍎','🍌','🍇','🍓','🍊','🍑']},
      {name:'やさい',   col:'#3fa34d', items:['🥕','🍆','🥦','🌽','🧅']},
      {name:'おかし',   col:'#9b5de5', items:['🍩','🍪','🍰','🍭','🧁']},
      {name:'うみのさち',col:'#2a9df0', items:['🐟','🦐','🦀','🐙','🦑']},
    ];
    const PLATES=['#ff9aa2','#a0e7e5','#ffdac1','#b5ead7','#c7ceea'];
    const BELT_Y=486;
    const ZONE_P=42,ZONE_G=95; // ジャストゾーン半径
    const ODAI_SPAN=8;
    // お題順を seed で決める (デイリーは全員同じ)
    const odaiOrder=CATS.slice();
    for(let i=odaiOrder.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[odaiOrder[i],odaiOrder[j]]=[odaiOrder[j],odaiOrder[i]]}
    let odaiIdx=0,odai=odaiOrder[0],odaiT=ODAI_SPAN,bannerT=0,cdLast=99;
    let items=[],flying=[];
    let t=0,dist=0,sinceSpawn=999,nextGap=130,noTargetRun=0,missed=0;
    const flo=new Floaties(),parts=new Particles();

    function rpick(arr){return arr[Math.floor(RNG()*arr.length)]}
    function spawnItem(x){
      let cat;
      if(ctx.isFever())cat=odai;            // フィーバー中は せいかい だけ
      else if(noTargetRun>=3)cat=odai;
      else cat=RNG()<0.45?odai:rpick(CATS.filter(c=>c!==odai));
      noTargetRun=(cat===odai)?0:noTargetRun+1;
      items.push({x,e:rpick(cat.items),cat,plate:PLATES[Math.floor(RNG()*PLATES.length)],ph:RNG()*TAU,lift:0});
    }
    spawnItem(W*0.62);spawnItem(W*0.95);
    function speed(){
      let s=(95+t*2)*(t<5?0.5:1)*(ctx.rookie?0.85:1);
      if(ctx.isFever())s*=1.1;
      return s;
    }
    function changeOdai(){
      for(const it of items)parts.burst(it.x,BELT_Y-28,5,{col:'#fff',grav:120,life:.4});
      items=[];sinceSpawn=0;
      odaiIdx++;odai=odaiOrder[odaiIdx%odaiOrder.length];
      odaiT=ODAI_SPAN;bannerT=0.9;cdLast=99;
      A.pop();A.tone({f:780,when:.08,dur:.12,vol:.15});
    }
    function grab(it,fvx){
      const idx=items.indexOf(it);
      if(idx<0)return;
      items.splice(idx,1);
      const ok=(it.cat===odai);
      flying.push({x:it.x,y:BELT_Y-28,vx:clamp(fvx,-260,260),vy:-1150,rot:0,
                   vr:rand(-7,7),e:it.e,plate:it.plate,ok,t:0});
      if(ok){
        const d=Math.abs(it.x-W/2);
        if(d<=ZONE_P)ctx.judge('perfect',it.x,BELT_Y-70,{sub:'ジャスト！'});
        else if(d<=ZONE_G)ctx.judge('great',it.x,BELT_Y-70);
        else ctx.judge('good',it.x,BELT_Y-70,{sub:'はしっこ…'});
        A.whoosh();
      }else{
        ctx.judge('wrong',it.x,BELT_Y-70);

    }
    function grabNearest(x){
      let best=null,bd=1e9;
      for(const it of items){
        if(it.x<26||it.x>W-12)continue;
        const d=Math.abs(it.x-x);

      }
      if(best)grab(best,0);

    const self={
      update(dt){
        t+=dt;
        bannerT=Math.max(0,bannerT-dt);
        const sp=speed()*(bannerT>0?0.25:1);

        if(bannerT<=0){

          // チェンジ3秒前カウントダウン
          const cd=Math.ceil(odaiT);
          if(odaiT<=3&&cd!==cdLast&&cd>=1){cdLast=cd;A.tick()}
          if(odaiT<=0)changeOdai();
          sinceSpawn+=sp*dt;
          if(sinceSpawn>=nextGap){spawnItem(W+60);sinceSpawn=0;nextGap=110+RNG()*60}
        }
        for(const it of items){it.x-=sp*dt;it.lift*=Math.pow(0.0001,dt)}
        for(let i=items.length-1;i>=0;i--){
          const it=items[i];
          if(it.x<-60){
            items.splice(i,1);
            if(it.cat===odai){
              missed++;
              flo.add('みのがし…',46,BELT_Y-80,'#bcd6ff',14,0.6);
            }

        }
        for(const f of flying){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt}
        flying=flying.filter(f=>f.t<0.7&&f.y>-90);
        flo.update(dt);parts.update(dt);
      },
      draw(g){
        const bg=g.createLinearGradient(0,0,0,H);
        bg.addColorStop(0,skin.wallT);bg.addColorStop(.62,skin.wallM);bg.addColorStop(1,skin.wallB);
        g.fillStyle=bg;g.fillRect(0,0,W,H);
        if(skin.night){
          for(let i=0;i<12;i++){
            const a=0.3+0.5*Math.abs(Math.sin(t*2+i*1.7));
            g.fillStyle=`rgba(255,220,120,${a*0.5})`;
            g.beginPath();g.arc((i*89+20)%W,(i*47)%160+210,2,0,TAU);g.fill();
          }
        }else{
          g.fillStyle='rgba(255,255,255,.5)';
          for(let i=0;i<7;i++){g.beginPath();g.arc(30+i*60,(i%2?200:320)+Math.sin(i*1.7)*20,17,0,TAU);g.fill()}
        }
        g.fillStyle=skin.noren;
        for(let i=0;i<7;i++){rr(g,i*62-4,64,56,26,8);g.fill()}
        // おだいボード (常時・大きく)
        const bw=330,bx=(W-bw)/2,by=152; // コアのコンボ/FEVER表示帯(y96-150)を避ける
        const flash=odaiT<=3&&bannerT<=0&&Math.sin(performance.now()/110)>0;
        g.fillStyle='rgba(0,0,0,.12)';rr(g,bx+4,by+6,bw,100,16);g.fill();
        g.fillStyle=flash?'#c9924f':'#a9744f';rr(g,bx,by,bw,100,16);g.fill();
        g.strokeStyle='#7a4a26';g.lineWidth=4;g.stroke();
        g.fillStyle='#fff8ec';rr(g,bx+8,by+8,bw-16,84,11);g.fill();
        outlinedText(g,'おだい',bx+46,by+26,15,'#fff','#e2526f',4);
        outlinedText(g,'「'+odai.name+'」',bx+bw/2+24,by+32,30,odai.col,'#4a3b2a',7);
        emojiText(g,odai.items.slice(0,4).join(' '),bx+bw/2,by+70,26);
        g.fillStyle='rgba(0,0,0,.15)';rr(g,bx+30,by+106,bw-60,9,5);g.fill();
        g.fillStyle=odai.col;rr(g,bx+30,by+106,(bw-60)*clamp(odaiT/ODAI_SPAN,0,1),9,5);g.fill();
        if(odaiT<=3&&bannerT<=0)
          outlinedText(g,'チェンジまで '+Math.ceil(odaiT),W/2,by+132,16,'#ffd23f','#7a4a16',5);
        // カウンター
        g.fillStyle=skin.counter;g.fillRect(0,BELT_Y+30,W,H-BELT_Y-30);
        g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=3;
        for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,BELT_Y+78+i*46);g.lineTo(W,BELT_Y+78+i*46);g.stroke()}
        // 回転ギア
        for(const gx of [10,W-10]){
          g.save();g.translate(gx,BELT_Y+12);g.rotate(dist/30);
          g.fillStyle='#5a5564';g.beginPath();g.arc(0,0,34,0,TAU);g.fill();
          g.strokeStyle='#3c3845';g.lineWidth=4;g.stroke();
          g.strokeStyle='#8b8698';g.lineWidth=5;
          for(let i=0;i<3;i++){g.beginPath();g.moveTo(0,0);
            g.lineTo(Math.cos(i*TAU/3)*26,Math.sin(i*TAU/3)*26);g.stroke()}
          g.fillStyle='#8b8698';g.beginPath();g.arc(0,0,8,0,TAU);g.fill();
          g.restore();
        }
        // ベルト
        g.fillStyle='#6d6875';rr(g,-12,BELT_Y-12,W+24,52,10);g.fill();
        g.strokeStyle='#4a4554';g.lineWidth=4;g.stroke();
        g.save();
        rr(g,-12,BELT_Y-12,W+24,52,10);g.clip();
        g.fillStyle='#857f93';g.fillRect(-12,BELT_Y-12,W+24,16);
        const xoff=-(dist%34);
        g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=7;
        for(let x=xoff-34;x<W+34;x+=34){
          g.beginPath();g.moveTo(x+18,BELT_Y-8);g.lineTo(x,BELT_Y+36);g.stroke();
        }
        g.restore();
        // ジャストゾーン
        const zglow=0.5+0.5*Math.abs(Math.sin(t*3));
        g.save();
        g.globalAlpha=0.25;
        g.fillStyle='#7cf29c';g.fillRect(W/2-ZONE_G,BELT_Y-58,ZONE_G*2,86);
        g.globalAlpha=0.3+zglow*0.25;
        g.fillStyle='#ffd23f';g.fillRect(W/2-ZONE_P,BELT_Y-58,ZONE_P*2,86);
        g.globalAlpha=0.9;
        g.strokeStyle='#ffd23f';g.lineWidth=3;g.setLineDash([6,5]);
        g.strokeRect(W/2-ZONE_P,BELT_Y-58,ZONE_P*2,86);
        g.restore();
        outlinedText(g,'🎯ジャスト',W/2,BELT_Y-70,13,'#ffd23f','#7a4a16',4);
        // アイテム
        const warm=t<5; // 開始5秒は せいかい が ひかる
        for(const it of items){
          const bob=Math.sin(it.ph+t*3)*2;
          const ey=BELT_Y-28-it.lift+bob;
          g.fillStyle='rgba(0,0,0,.15)';
          g.beginPath();g.ellipse(it.x,BELT_Y+1,38,9,0,0,TAU);g.fill();
          if((warm||ctx.isFever())&&it.cat===odai){
            g.save();g.globalAlpha=0.4+zglow*0.4;
            g.strokeStyle='#ffd23f';g.lineWidth=5;
            g.beginPath();g.ellipse(it.x,BELT_Y-6,46,17,0,0,TAU);g.stroke();
            g.restore();
          }
          g.fillStyle='#fff';
          g.beginPath();g.ellipse(it.x,BELT_Y-6,40,13,0,0,TAU);g.fill();
          g.strokeStyle=it.plate;g.lineWidth=5;g.stroke();
          emojiText(g,it.e,it.x,ey,44);
          if(it.cat===odai){
            const tw=1+Math.sin(t*6+it.ph)*0.15;
            drawStar(g,it.x+26,ey-26,6*tw,t*2,'#ffd23f');
          }
        }
        for(const f of flying){
          const a=clamp(1-(f.t-0.35)/0.35,0,1);
          g.save();g.globalAlpha=a;
          g.translate(f.x,f.y);g.rotate(f.rot);
          g.fillStyle='#fff';
          g.beginPath();g.ellipse(0,16,36,11,0,0,TAU);g.fill();
          g.strokeStyle=f.plate;g.lineWidth=5;g.stroke();
          emojiText(g,f.e,0,-8,44);
          if(!f.ok)emojiText(g,'❌',0,-8,30);
          g.restore();

        parts.draw(g);flo.draw(g);
        if(bannerT>0){
          const k=1-bannerT/0.9;
          const sc=k<0.17?easeOutCubic(k/0.17):1;
          const al=bannerT<0.22?bannerT/0.22:1;
          g.save();g.globalAlpha=al;
          g.translate(W/2,330);g.scale(sc,sc);
          outlinedText(g,'おだいチェンジ！',0,-20,30,'#fff','#e2526f',7);
          outlinedText(g,'→「'+odai.name+'」',0,22,26,odai.col,'#4a3b2a',6);
          g.restore();
        }
        if(t<5)
          outlinedText(g,'ひかってるものを 上フリック！',W/2,BELT_Y-128,17,'#fff','#caa04a',5);
      },
      onFlick(f){
        if(f.dy<-40&&Math.abs(f.dy)>=Math.abs(f.dx)*0.8){
          let best=null,bd=1e9;
          for(const it of items){
            const d=Math.abs(it.x-f.x0);
            if(d<=56&&f.y0>BELT_Y-120&&f.y0<BELT_Y+55&&d<bd){bd=d;best=it}
          }
          if(best)grab(best,f.dx*4);
        }
      },
      onDown(x,y){
        for(const it of items)
          if(Math.abs(it.x-x)<=50&&Math.abs(y-(BELT_Y-28))<=70)it.lift=10;
      },
      onKey(code,down){
        if(down&&(code==='ArrowUp'||code==='Space'||code==='KeyW'))grabNearest(W/2);
      },
      finish(){return {stats:[['💨 みのがし',missed]]}},
    };
    return self;
  }
});

/* ============================================================
   ゲームC: スポットライト☆ダンス (一点タイミング / 22ノーツ ≈24秒)
   譜面は seed 生成 (デイリーは全員同じ・通常は毎回ちがう)
   ============================================================ */
registerGame({
  id:'spot', emoji:'💡', title:'スポットライト☆ダンス',
  desc:'ひかりが かさなった しゅんかんに タップ！',
  color:'#cdb4f6', duration:null,
  howto:[
    ['💡','スポットライトが ダンサーに ちかづいてくる！'],
    ['👆','わっかに ぴったり かさなった しゅんかんに タップ！'],
    ['⏱','はやいと EARLY・おそいと LATE。つぎで ちょうせいしよう'],
    ['🎧','ちかづくほど 音が大きくなるよ。耳でも あわせてみて'],
    ['⌨️','スペースキーでもOK'],
  ],
  create(ctx){
    const A=ctx.audio,RNG=ctx.rng;
    const R=66;
    const KK=ctx.rookie?1.35:1;
    const P_W=0.35*KK,G1_W=0.7*KK,G2_W=1.05*KK,CON_W=1.5*KK;
    // ---- 譜面生成 (seed依存) ----
    const sections=[
      {bpm:92+RNG()*8,n:7},
      {bpm:108+RNG()*8,n:7},
      {bpm:122+RNG()*10,n:8},
    ];
    const notes=[],beats=[];
    let cur=2.6;
    {
      const bd0=60/sections[0].bpm;
      for(let i=4;i>=1;i--)beats.push({t:cur-i*bd0,kick:i%2===0});
      for(const s of sections){
        const bd=60/s.bpm;
        for(let i=0;i<s.n;i++){
          notes.push({t:cur,bpm:s.bpm,judged:false});
          beats.push({t:cur,kick:true},{t:cur+bd,kick:false});
          cur+=bd*2;
        }
        cur+=bd*2;
      }
    }
    const total=notes.length;
    const ANG=[0,Math.PI,Math.PI/4,Math.PI*3/4,Math.PI/2,-Math.PI/4,-Math.PI*3/4,-Math.PI/2];
    let prevPos={x:210,y:440};
    for(let i=0;i<total;i++){
      const n=notes[i];
      if(i===0)n.pos={x:210,y:440};
      else{
        let p,guard=0;
        do{p={x:95+RNG()*230,y:330+RNG()*225};guard++}
        while(Math.hypot(p.x-prevPos.x,p.y-prevPos.y)<100&&guard<20);
        n.pos=p;
      }
      prevPos=n.pos;
      n.ang=ANG[Math.floor(RNG()*ANG.length)];
      n.v=235*n.bpm/96;
      n.late=CON_W*R/n.v+0.02;
      const prev=notes[i-1];
      n.hopT=Math.max(n.t-1.15,prev?prev.t+prev.late+0.06:0.45);
      n.visFrom=Math.max(n.t-1.05,n.hopT+0.12);
    }
    const BASS=[87.31,87.31,116.54,98.0];
    // ---- 状態 (曲時間はフレーム積算) ----
    let now=0;
    let beatIdx=0,visIdx=0,kickCount=0;
    let actIdx=0,resolved=0;
    let charFrom={...notes[0].pos},charTo=notes[0].pos,hopStartT=-9,charPos={...notes[0].pos},charLift=0;
    let face='normal',faceT=0,tapCd=0;
    let ended=false,endAt=0,sentFinish=false,proxOn=false;
    const flo=new Floaties(),parts=new Particles();

    function lightPos(n){
      const off=(n.t-now)*n.v;
      return {x:n.pos.x+Math.cos(n.ang)*off,y:n.pos.y+Math.sin(n.ang)*0.5*off};
    }
    function lightTint(a){
      if(ctx.isFever())return `rgba(255,215,90,${a})`;
      if(ctx.skinLevel===1)return `rgba(255,170,215,${a})`;
      if(ctx.skinLevel===2){const hue=(now*120)%360;return `hsla(${hue},90%,75%,${a})`}
      return `rgba(255,245,180,${a})`;
    }
    function resolve(n,kind,sub){
      n.judged=true;resolved++;
      const x=n.pos.x,y=n.pos.y-100;
      ctx.judge(kind,x,y,{sub});
      if(kind==='perfect'){face='happy';faceT=0.55}
      else if(kind==='great'||kind==='good'){face='happy';faceT=0.35}
      else{face='sad';faceT=0.6}
      if(resolved>=total&&!ended){ended=true;endAt=now}
    }
    function tap(){
      if(tapCd>0)return;
      tapCd=0.18;
      const n=notes[actIdx];
      if(!n||n.judged||now<n.visFrom){stray();return}
      const dtv=now-n.t;
      const d=Math.abs(dtv)*n.v/R;
      const dir=dtv<-0.02?'ちょい はやめ':dtv>0.02?'ちょい おそめ':null;
      if(d<=P_W)resolve(n,'perfect');
      else if(d<=G1_W)resolve(n,'great',dir);
      else if(d<=G2_W)resolve(n,'good',dir);
      else if(d<=CON_W)resolve(n,dtv<0?'early':'late',`${Math.abs(dtv).toFixed(2)}びょう ${dtv<0?'はやい':'おそい'}`);
      else stray();
    }
    function stray(){
      ctx.comboBreak();
      flo.add('まだ！',charPos.x,charPos.y-110,'#ff9ad5',16);
      A.miss();
    }
    function beatInfo(){
      while(visIdx<beats.length&&beats[visIdx].t<=now)visIdx++;
      const a=beats[visIdx-1]?beats[visIdx-1].t:0;
      const b=beats[visIdx]?beats[visIdx].t:a+0.5;
      return {phase:clamp((now-a)/Math.max(0.001,b-a),0,1),count:visIdx};
    }
    function drawChar(g,fx,fy,L,bi){
      const bounce=Math.abs(Math.sin(bi.phase*Math.PI))*7;
      const sq=Math.sin(bi.phase*TAU)*0.05;
      const by=fy-36-L-bounce;
      g.fillStyle='rgba(0,0,0,.3)';
      const shw=lerp(30,20,clamp(L/40,0,1));
      g.beginPath();g.ellipse(fx,fy+3,shw,8,0,0,TAU);g.fill();
      g.save();
      g.translate(fx,by);
      g.scale(1+sq,1-sq);
      const wave=Math.sin(bi.count*Math.PI+bi.phase*Math.PI);
      g.fillStyle='#8a3e5e';
      g.beginPath();g.ellipse(-12,30,8,6,0,0,TAU);g.fill();
      g.beginPath();g.ellipse(12,30,8,6,0,0,TAU);g.fill();
      g.strokeStyle='#ff9fc0';g.lineWidth=10;g.lineCap='round';
      g.beginPath();g.moveTo(-22,0);g.lineTo(-36,-14*wave-6);g.stroke();
      g.beginPath();g.moveTo(22,0);g.lineTo(36,14*wave-6);g.stroke();
      g.fillStyle='#ff9fc0';
      g.beginPath();g.ellipse(0,0,28,26,0,0,TAU);g.fill();
      g.strokeStyle='#8a3e5e';g.lineWidth=4;g.stroke();
      g.fillStyle='#ffe3ee';
      g.beginPath();g.ellipse(0,10,16,12,0,0,TAU);g.fill();
      g.strokeStyle='#8a3e5e';g.lineWidth=3.5;
      g.beginPath();g.moveTo(0,-25);g.quadraticCurveTo(4,-36,0,-42);g.stroke();

      }

    const self={
      hudInfo(){return '♪ のこり '+(total-resolved)},
      update(dt){

        while(actIdx<total&&notes[actIdx].judged)actIdx++;
        const n=notes[actIdx];
        if(n&&!n.judged&&now>n.t+n.late)resolve(n,'miss');
        // 接近音 (近いほど大きい)
        if(n&&!n.judged&&now>=n.visFrom){
          const d=Math.abs(n.t-now)*n.v/R;
          A.proxSet(clamp(1-d/2.2,0,1));
        }else A.proxSet(0);
        if(n&&charTo!==n.pos&&now>=n.hopT){
          charFrom={...charPos};charTo=n.pos;hopStartT=now;
          A.tone({f:520,f2:760,dur:.1,vol:.08});
        }
        const hk=clamp((now-hopStartT)/0.24,0,1);
        charPos={x:lerp(charFrom.x,charTo.x,hk),y:lerp(charFrom.y,charTo.y,hk)};
        charLift=Math.sin(hk*Math.PI)*36;
        if(ended&&!sentFinish&&now>endAt+1.0){
          sentFinish=true;
          A.proxStop();
          ctx.finishGame({banner:'フィニッシュ！！🎉'});

        flo.update(dt);parts.update(dt);
      },

        const rows=[300,356,418,488,564,646,H+8];

            g.fillStyle=on?`rgba(118,98,196,${0.5+pulse*0.3})`:'rgba(64,52,120,.55)';
            g.fillRect(c*W/6,rows[r],W/6+1,rows[r+1]-rows[r]);

        for(let i=0;i<8;i++){

        let close=0;
        if(n&&!n.judged&&now>=n.visFrom)close=clamp(1-Math.abs(n.t-now)*n.v/R/2.2,0,1);
        g.save();

        if(n&&!n.judged&&now>=n.visFrom){

          grd.addColorStop(1,'rgba(255,248,190,.22)');

          g.beginPath();

          g.lineTo(lp.x+R*0.92,lp.y);g.lineTo(lp.x-R*0.92,lp.y);
          g.closePath();g.fill();

          rg.addColorStop(0,lightTint(0.6+(d<P_W?0.25:0)));
          rg.addColorStop(.75,lightTint(0.28));
          rg.addColorStop(1,lightTint(0));
          g.fillStyle=rg;
          g.save();g.translate(lp.x,lp.y);g.scale(1,0.5);
          g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
          g.restore();
          g.restore();
          g.save();g.globalAlpha=0.75;
          g.strokeStyle=d<P_W?'#fff7c2':'#e8dcff';
          g.lineWidth=d<P_W?4:2.5;
          g.beginPath();g.ellipse(lp.x,lp.y,R,R*0.5,0,0,TAU);g.stroke();
          g.restore();
          g.fillStyle='#3c3552';rr(g,lp.x-16,42,32,20,7);g.fill();
          g.strokeStyle='#211c33';g.lineWidth=3;g.stroke();
        }
        drawChar(g,charPos.x,charPos.y,charLift,bi);
        parts.draw(g);flo.draw(g);
        if(now<notes[0].t-1.0)
          outlinedText(g,'わっかに ひかりが きたら タップ！',W/2,250,19,'#fff','#6a4a9e',5);
        if(ended)
          outlinedText(g,'おどりきった！',W/2,250,22,'#ffd23f','#6a4a9e',5);
      },
      onDown(){tap()},
      onKey(code,down){if(down&&(code==='Space'||code==='Enter'))tap()},
      finish(){A.proxStop();return {}},
      destroy(){A.proxStop()},
    };
    return self;
  }
});

/* ============================================================
   ゲームD: まるばつ たいせん (versus / ターン制・スコア無し)
   ------------------------------------------------------------
   勝敗判定は純関数 checkWin(board) に分離 (自動テスト対象)。
   board: 長さ9の配列。各要素は '○' | '×' | null(空)。
   将来CPU化する場合は players に {type:'cpu'} を足し、
   place() の手番交代後に getCpuMove(board, mark) を呼ぶだけでよい。
   ============================================================ */
function checkWin(board){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const line of L){
    const [a,b,c]=line;
    if(board[a]&&board[a]===board[b]&&board[a]===board[c])
      return {winner:board[a],line:line.slice()}; // コピー返し: 呼び出し側のmutationが内部定数Lに波及しない
  }
  return {winner:null,line:null};
}
/* checkWin 自動テスト: 8勝ち筋×○×, 引き分け, 未決着, 空盤 = 19ケース。
   結果は {pass,fail,log} を返しコンソールに出力。?selftest で自動実行。 */
function runTicTacToeTests(){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const mk=s=>s.split('').map(ch=>ch==='o'?'○':ch==='x'?'×':null); // 空セルは null 基準
  let pass=0,fail=0;const log=[];
  for(const ln of lines)for(const mark of ['○','×']){
    const b=Array(9).fill(null);ln.forEach(i=>b[i]=mark);
    const r=checkWin(b);
    const ok=r.winner===mark&&r.line&&r.line.join()===ln.join();
    ok?pass++:fail++;if(!ok)log.push('win '+mark+' '+ln+' -> '+JSON.stringify(r));
  }
  {const b=mk('oxooxxxoo');const r=checkWin(b);const ok=r.winner===null&&b.every(c=>c);ok?pass++:fail++;if(!ok)log.push('draw -> '+JSON.stringify(r));}
  {const b=mk('ox    o  ');const r=checkWin(b);const ok=r.winner===null;ok?pass++:fail++;if(!ok)log.push('undecided -> '+JSON.stringify(r));}
  {const r=checkWin(Array(9).fill(null));const ok=r.winner===null;ok?pass++:fail++;if(!ok)log.push('empty -> winner not null');}
  // line.slice() コピー返し検証: 返り値を破壊しても再判定が壊れない
  {const b=Array(9).fill(null);[0,1,2].forEach(i=>b[i]='○');const r=checkWin(b);r.line.push(99);const r2=checkWin(b);
   const ok=r2.line.length===3&&r2.line.join()==='0,1,2';ok?pass++:fail++;if(!ok)log.push('slice-copy -> '+JSON.stringify(r2));}
  console.log('[checkWin tests] pass='+pass+' / fail='+fail, log.length?log:'');
  return {pass,fail,log};
}
registerGame({
  id:'ox', emoji:'⭕', title:'まるばつ たいせん',
  desc:'2人で あそぶ ○×ゲーム',
  color:'#ffd6a5', type:'versus',   // duration は付けない (タイマー無し)
  howto:[
    ['👆','マスを タップして ○×を おく'],
    ['🏆','タテ・ヨコ・ナナメで 3つ そろえたら かち！'],
    ['🔄','きまったら がめんを タップで もういちど'],
  ],
  create(ctx){
    const A=ctx.audio;
    const COL={'○':'#ff5c8a','×':'#2a9df0'};
    // 盤面レイアウト (W=420,H=740 基準)
    const CELL=112,BOARD=CELL*3,BX=(W-BOARD)/2,BY=212;
    // プレイヤー定義 (Ver2.0で type:'cpu' を足すだけでCPU対応できる)
    const players=[{mark:'○',type:'human'},{mark:'×',type:'human'}];
    let board=Array(9).fill(null); // 空セルは null 基準
    let turn=0,result=null,winLine=null,t=0;
    const parts=new Particles();

    function center(idx){
      return {x:BX+(idx%3)*CELL+CELL/2, y:BY+Math.floor(idx/3)*CELL+CELL/2};
    }
    function cellAt(x,y){
      if(x<BX||x>BX+BOARD||y<BY||y>BY+BOARD)return -1;
      const cx=Math.floor((x-BX)/CELL),cy=Math.floor((y-BY)/CELL);
      if(cx<0||cx>2||cy<0||cy>2)return -1;
      return cy*3+cx;
    }
    function reset(){
      board=Array(9).fill(null);turn=0;result=null;winLine=null;
      A.pop();
    }
    function place(cell){           // 着手を1箇所に集約 (手番交代もここ)
      if(result||cell<0||board[cell])return;
      board[cell]=players[turn].mark;
      A.pop();vib(8);
      const r=checkWin(board);
      if(r.winner){
        result={winner:r.winner};winLine=r.line;
        banner(r.winner+'の かち！');A.fever();vib([30,50,30,50,30]);
        for(const idx of r.line){const c=center(idx);parts.burst(c.x,c.y,10,{shape:'star',col:COL[r.winner],grav:160});}
        confetti();
      }else if(board.every(c=>c)){
        result={draw:true};
        banner('ひきわけ！');A.ok();vib([20,40,20]);
      }else{
        turn=1-turn;
        // 将来CPU: if(players[turn].type==='cpu') place(getCpuMove(board,players[turn].mark));
      }
    }
    function drawMark(g,mark,c){
      g.save();g.lineCap='round';g.lineJoin='round';g.lineWidth=14;g.strokeStyle=COL[mark];
      const r=CELL*0.3;
      if(mark==='○'){g.beginPath();g.arc(c.x,c.y,r,0,TAU);g.stroke();}
      else{g.beginPath();g.moveTo(c.x-r,c.y-r);g.lineTo(c.x+r,c.y+r);g.moveTo(c.x+r,c.y-r);g.lineTo(c.x-r,c.y+r);g.stroke();}
      g.restore();
    }

    return {
      onDown(x,y){
        if(result){reset();return}   // 決着後タップでリセット
        place(cellAt(x,y));
      },
      update(dt){t+=dt;parts.update(dt);},
      draw(g){
        g.fillStyle='#2b2550';g.fillRect(0,0,W,H);
        outlinedText(g,'まるばつ たいせん',W/2,92,25,'#fff','#3a2a4a',7);
        // 手番 / 結果 (大きく)
        if(!result){
          const m=players[turn].mark;
          outlinedText(g,m+'の ばん',W/2,152,30,COL[m],'#fff',7);
        }else if(result.draw){
          outlinedText(g,'ひきわけ！',W/2,152,30,'#ffd23f','#5a3a10',7);
        }else{
          outlinedText(g,result.winner+'の かち！',W/2,152,32,COL[result.winner],'#fff',8);
        }
        // 盤パネル
        g.save();g.fillStyle='#fffdf6';rr(g,BX-14,BY-14,BOARD+28,BOARD+28,22);g.fill();g.restore();
        // グリッド線
        g.save();g.strokeStyle='#3a2d56';g.lineWidth=6;g.lineCap='round';
        for(let i=1;i<3;i++){
          g.beginPath();g.moveTo(BX+i*CELL,BY+10);g.lineTo(BX+i*CELL,BY+BOARD-10);g.stroke();
          g.beginPath();g.moveTo(BX+10,BY+i*CELL);g.lineTo(BX+BOARD-10,BY+i*CELL);g.stroke();
        }
        g.restore();
        // マーク
        for(let i=0;i<9;i++)if(board[i])drawMark(g,board[i],center(i));
        // 勝ち筋ハイライト
        if(winLine){
          const a=center(winLine[0]),b=center(winLine[2]);
          g.save();g.globalAlpha=0.5+0.25*Math.sin(t*6);
          g.strokeStyle='#ffd23f';g.lineWidth=16;g.lineCap='round';
          g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore();
        }
        parts.draw(g);
        // フッター: 案内 / もういちど
        if(result){
          const cy=BY+BOARD+60;
          g.save();g.fillStyle='#ff4d94';rr(g,W/2-98,cy-30,196,60,18);g.fill();g.restore();
          outlinedText(g,'▶ もう いちど',W/2,cy,24,'#fff','#b92e6e',6);
          outlinedText(g,'がめんを タップ',W/2,cy+50,15,'#cfc6e8','#2b2550',4);
        }else{
          outlinedText(g,'マスを タップして おこう',W/2,BY+BOARD+48,16,'#cfc6e8','#2b2550',4);
        }
      },
      hudInfo(){
        if(result)return result.draw?'ひきわけ':result.winner+'の かち';
        return players[turn].mark+'の ばん';
      },
    };
  }
});

/* ============================================================
   ゲームE: ごもくならべ (versus / ターン制・スコア無し)
   ------------------------------------------------------------
   勝敗判定は純関数 checkGomoku(board,lastIndex) に分離 (自動テスト対象)。
   board: 長さ225 (15x15) の配列。各要素は 'black' | 'white' | null(空)。
          → ox の checkWin と空セル表現 (null) を揃える方針。
   将来CPU化する場合は players に {type:'cpu'} を足し、
   place() の手番交代後に getGomokuCpuMove(board,mark) を呼ぶだけでよい。
   ============================================================ */
const GO_N=15; // 連珠規格 15x15
/* lastIndex から4方向に同色連続を数え、5以上で勝ち。
   line は勝ち連の全長を「負方向端→正方向端」の順で返す
   (右上がり[1,-1]だけは数値降順。描画は端点利用なので順序非依存)。副作用なし。 */
function checkGomoku(board,lastIndex){
  if(lastIndex==null||lastIndex<0||lastIndex>=GO_N*GO_N||!board[lastIndex])return {winner:null,line:null};
  const color=board[lastIndex];
  const x=lastIndex%GO_N, y=Math.floor(lastIndex/GO_N);
  const dirs=[[1,0],[0,1],[1,1],[1,-1]]; // 横・縦・右下がり・左下がり
  for(const [dx,dy] of dirs){
    const run=[lastIndex];
    for(let k=1;k<GO_N;k++){ // 正方向
      const nx=x+dx*k,ny=y+dy*k;
      if(nx<0||nx>=GO_N||ny<0||ny>=GO_N||board[ny*GO_N+nx]!==color)break;
      run.push(ny*GO_N+nx);
    }
    for(let k=1;k<GO_N;k++){ // 逆方向 (先頭へ積む = 負方向端から順)
      const nx=x-dx*k,ny=y-dy*k;
      if(nx<0||nx>=GO_N||ny<0||ny>=GO_N||board[ny*GO_N+nx]!==color)break;
      run.unshift(ny*GO_N+nx);
    }
    if(run.length>=5)return {winner:color,line:run.slice()}; // コピー返し: 呼び出し側のmutationが波及しない
  }
  return {winner:null,line:null};
}
/* checkGomoku 自動テスト: 横/縦/両斜めの5連, 6連(長連), 端・角の誤検出なし, 未決着, コピー返し。 */
function runGomokuTests(){
  const N=GO_N, idx=(x,y)=>y*N+x, blank=()=>Array(N*N).fill(null);
  const fill=(cells,color)=>{const b=blank();for(const i of cells)b[i]=color;return b;};
  let pass=0,fail=0;const log=[];
  const ck=(name,cond)=>{cond?pass++:fail++;if(!cond)log.push(name);};
  // 横5連 (黒)
  {const cells=[0,1,2,3,4].map(x=>idx(x,7));const b=fill(cells,'black');const r=checkGomoku(b,idx(2,7));
   ck('h5',r.winner==='black'&&r.line.length===5&&r.line.join()===cells.join());}
  // 縦5連 (白)
  {const cells=[3,4,5,6,7].map(y=>idx(5,y));const b=fill(cells,'white');const r=checkGomoku(b,idx(5,5));
   ck('v5',r.winner==='white'&&r.line.join()===cells.join());}
  // 右下がり斜め5連
  {const cells=[0,1,2,3,4].map(k=>idx(2+k,2+k));const b=fill(cells,'black');const r=checkGomoku(b,idx(4,4));
   ck('d5',r.winner==='black'&&r.line.length===5);}
  // 左下がり斜め5連
  {const cells=[0,1,2,3,4].map(k=>idx(10-k,2+k));const b=fill(cells,'white');const r=checkGomoku(b,idx(8,4));
   ck('ad5',r.winner==='white'&&r.line.length===5);}
  // 6連(長連)も勝ち & 全長を返す
  {const cells=[0,1,2,3,4,5].map(x=>idx(x,0));const b=fill(cells,'black');const r=checkGomoku(b,idx(3,0));
   ck('long6',r.winner==='black'&&r.line.length===6);}
  // 角での誤検出なし: 端で折り返さない (右端3 + 次行左端2 が繋がらない)
  {const cells=[idx(13,0),idx(14,0),idx(0,1),idx(1,1),idx(2,1)];const b=fill(cells,'black');
   const r=checkGomoku(b,idx(14,0));ck('wrap',r.winner===null);}
  // 4連は未決着
  {const cells=[0,1,2,3].map(x=>idx(x,5));const b=fill(cells,'black');const r=checkGomoku(b,idx(3,5));
   ck('four',r.winner===null);}
  // 異色が混ざると途切れる
  {const b=blank();[0,1,2].forEach(x=>b[idx(x,9)]='black');b[idx(3,9)]='white';[4,5].forEach(x=>b[idx(x,9)]='black');
   const r=checkGomoku(b,idx(2,9));ck('mixed',r.winner===null);}
  // 空盤・空セル指定
  {ck('empty',checkGomoku(blank(),idx(7,7)).winner===null);}
  // コピー返し: 返り値lineを破壊しても再判定が壊れない
  {const cells=[0,1,2,3,4].map(x=>idx(x,1));const b=fill(cells,'black');const r=checkGomoku(b,idx(0,1));
   r.line.push(999);const r2=checkGomoku(b,idx(0,1));ck('slice-copy',r2.line.length===5);}
  console.log('[checkGomoku tests] pass='+pass+' / fail='+fail, log.length?log:'');
  return {pass,fail,log};

/* ============================================================
   getGomokuHint(board, mark) -> index   (純関数・副作用なし)
   ------------------------------------------------------------
   現手番 mark の「良手」を1つ返す。優先度:
   ① 自分が5を完成できる点
   ② 相手が5を作る(四=あと1で5)のを止める点
   ③ 自分の四を作れる点
   ④ 相手の活三(両端開き三)を作らせない点
   ⑤ 既存石の近傍で中央寄りの空き (フォールバック)
   候補が無ければ -1。将来の getGomokuCpuMove(board,mark) のたたき台として
   そのまま流用できる構造 (同じ評価関数を読みに使う)。
   ============================================================ */
// 空点 idx に mark を置いたと仮定し、dir方向の連長と開放端数を返す (idx自身は読まない=空点シミュレート可)
function gomokuRunAt(board,idx,mark,dx,dy){
  const N=GO_N, x0=idx%N, y0=Math.floor(idx/N);
  let fwd=0, fx=x0+dx, fy=y0+dy;
  while(fx>=0&&fx<N&&fy>=0&&fy<N&&board[fy*N+fx]===mark){fwd++;fx+=dx;fy+=dy;}
  const fOpen=(fx>=0&&fx<N&&fy>=0&&fy<N&&board[fy*N+fx]===null);
  let bwd=0, bx=x0-dx, by=y0-dy;
  while(bx>=0&&bx<N&&by>=0&&by<N&&board[by*N+bx]===mark){bwd++;bx-=dx;by-=dy;}
  const bOpen=(bx>=0&&bx<N&&by>=0&&by<N&&board[by*N+bx]===null);
  return {len:1+fwd+bwd, open:(fOpen?1:0)+(bOpen?1:0)};
}
const GO_DIRS=[[1,0],[0,1],[1,1],[1,-1]];
// 空点cにmarkを置いた時の最大連長 (5以上で勝ち/勝ち阻止点)
function gomokuMaxLen(board,c,mark){
  let m=0;for(const [dx,dy] of GO_DIRS){const r=gomokuRunAt(board,c,mark,dx,dy);if(r.len>m)m=r.len;}return m;
}
// 空点cにmarkを置くと「四(あと1で5・開放端あり)」を作るか
function gomokuMakesFour(board,c,mark){
  for(const [dx,dy] of GO_DIRS){const r=gomokuRunAt(board,c,mark,dx,dy);if(r.len>=5)return true;if(r.len===4&&r.open>=1)return true;}return false;
}
// 盤上の mark の「活三(連長3・両端空き)」を探し、止める空点(開いた端の1つ)を返す。無ければ -1
function gomokuBlockOpenThree(board,mark){
  const N=GO_N;
  for(let i=0;i<board.length;i++){
    if(board[i]!==mark)continue;
    const x=i%N,y=Math.floor(i/N);
    for(const [dx,dy] of GO_DIRS){
      const px=x-dx,py=y-dy;
      if(px>=0&&px<N&&py>=0&&py<N&&board[py*N+px]===mark)continue; // 連の先頭のみ評価(重複除去)
      let len=1,cx=x+dx,cy=y+dy;
      while(cx>=0&&cx<N&&cy>=0&&cy<N&&board[cy*N+cx]===mark){len++;cx+=dx;cy+=dy;}
      if(len!==3)continue;
      const beforeOpen=(px>=0&&px<N&&py>=0&&py<N&&board[py*N+px]===null);
      const afterOpen =(cx>=0&&cx<N&&cy>=0&&cy<N&&board[cy*N+cx]===null);
      if(beforeOpen&&afterOpen)return cy*N+cx; // 活三 → 後方の開いた端で止める
    }
  }
  return -1;
}
// 候補=既存石の周囲2マスの空点 (昇順・決定的)。空盤なら天元のみ
function gomokuCandidates(board){
  const N=GO_N, set=new Set();let any=false;
  for(let i=0;i<board.length;i++){
    if(!board[i])continue;any=true;
    const x=i%N,y=Math.floor(i/N);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=N||ny<0||ny>=N)continue;
      const j=ny*N+nx;if(board[j]===null)set.add(j);
    }
  }
  if(!any)return [Math.floor(N*N/2)]; // 天元 (7,7)
  return [...set].sort((a,b)=>a-b);
}
function getGomokuHint(board,mark){
  const opp=mark==='black'?'white':'black';
  const cands=gomokuCandidates(board);
  if(!cands.length)return -1;
  for(const c of cands)if(gomokuMaxLen(board,c,mark)>=5)return c;   // ① 自分5
  for(const c of cands)if(gomokuMaxLen(board,c,opp)>=5)return c;    // ② 相手5阻止
  for(const c of cands)if(gomokuMakesFour(board,c,mark))return c;   // ③ 自分四
  {const blk=gomokuBlockOpenThree(board,opp);if(blk>=0)return blk;} // ④ 相手活三阻止
  // ⑤ フォールバック: 候補のうち中央(7,7)に最も近い空点
  const N=GO_N;let best=cands[0],bd=1e9;
  for(const c of cands){const x=c%N,y=Math.floor(c/N);const d=(x-7)*(x-7)+(y-7)*(y-7);if(d<bd){bd=d;best=c;}}
  return best;
}

   ck('win5',h===idx(1,7)||h===idx(6,7));}
  // ② 相手の5を阻止: 白が横4連 → 黒手番は白の完成点を返す
  {const b=blank();[2,3,4,5].forEach(x=>b[idx(x,7)]='white');const h=getGomokuHint(b,'black');
   ck('block5',h===idx(1,7)||h===idx(6,7));}
  // ③ 自分の四作り: 黒が横3連(両端開き) → 黒は四になる端を返す (自分四 > 相手活三なし)
  {const b=blank();[5,6,7].forEach(x=>b[idx(x,7)]='black');const h=getGomokuHint(b,'black');
   const ok=h===idx(4,7)||h===idx(8,7);ck('makefour',ok&&gomokuMakesFour(b,h,'black'));}
  // ④ 相手活三阻止: 白が横3連(両端開き)、黒は孤立1石 → 黒は白活三の開いた端で止める
  {const b=blank();[5,6,7].forEach(x=>b[idx(x,7)]='white');
   b[idx(0,0)]='black'; // 黒は孤立1石(四も活三も作れない)
   const h=getGomokuHint(b,'black');
   ck('blockthree',h===idx(4,7)||h===idx(8,7));}
  // ⑤ フォールバック: 中央付近に黒1石のみ → 近傍の空点(例外なく>=0)
  {const b=blank();b[idx(7,7)]='black';const h=getGomokuHint(b,'black');
   ck('fallback',h>=0&&b[h]===null);}
  // 空盤 → 天元
  {ck('empty',getGomokuHint(blank(),'black')===idx(7,7));}
  // 終盤(ほぼ埋まり)で例外なく空点を返す
  {const b=blank();for(let i=0;i<b.length;i++)b[i]=(i%2?'black':'white');b[idx(7,7)]=null;
   const h=getGomokuHint(b,'black');ck('endgame',h===idx(7,7));}
  console.log('[getGomokuHint tests] pass='+pass+' / fail='+fail, log.length?log:'');
  return {pass,fail,log};
