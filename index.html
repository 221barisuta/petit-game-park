/* ============================================================
   getGomokuCpuMove(board, mark, level) -> index   (純関数・副作用なし)
   ------------------------------------------------------------
   CPU思考。getGomokuHint と同じ評価部品を流用して段階化する。
   level: 1=よわい / 2=ふつう / 3=つよい
     1: 即詰み(自分5/相手5)だけ反応。あとは既存石近傍からランダム(中央寄り)。
     2: getGomokuHint の総合ヒューリスティックをそのまま使う貪欲AI。
     3: 双方向脅威(三三・四三)の創出/阻止を加点し、1手先読み(相手最善応手を減点)。
   同点手はランダムタイブレーク。候補が無ければ -1。
   ※ board は一時的に書き換えるが、関数終了時に必ず元へ戻す(実質副作用なし)。
   ============================================================ */
// 空点cにmarkを置いたときの攻撃スコア(連長×開放端 + 双方向脅威ボーナス)
function gomokuPlaceScore(board,c,mark){
  let total=0,threats=0;
  for(const [dx,dy] of GO_DIRS){
    const r=gomokuRunAt(board,c,mark,dx,dy);
    let s;
    if(r.len>=5)s=1000000;                                   // 5=勝ち
    else if(r.len===4)s=(r.open>=1?50000:0);                 // 四(開放端あり)
    else if(r.len===3)s=(r.open===2?4000:r.open===1?150:0);  // 活三 / 片開き三
    else if(r.len===2)s=(r.open===2?120:r.open===1?12:0);
    else s=(r.open===2?6:r.open===1?2:0);
    if((r.len===3&&r.open===2)||(r.len>=4&&r.open>=1))threats++; // 活三以上=脅威
    total+=s;
  }
  if(threats>=2)total+=30000; // 1手で二つ以上の脅威=三三/四三など(決まり手)
  return total;
}
function getGomokuCpuMove(board,mark,level){
  const opp=mark==='black'?'white':'black';
  const cands=gomokuCandidates(board);
  if(!cands.length)return -1;
  const pick=arr=>arr[Math.floor(Math.random()*arr.length)]; // 同点ランダムタイブレーク
  // 全レベル共通: 自分が5を作れる手は取る → 相手の5は止める(即詰み反応)
  const wins=cands.filter(c=>gomokuMaxLen(board,c,mark)>=5); if(wins.length)return pick(wins);
  const blocks=cands.filter(c=>gomokuMaxLen(board,c,opp)>=5); if(blocks.length)return pick(blocks);
  if(level<=1){ // よわい: 即詰み以外は中央寄りの軽い重みでランダム
    const N=GO_N;let pool=[];
    for(const c of cands){const x=c%N,y=Math.floor(c/N);
      const w=Math.max(1,6-Math.round(Math.hypot(x-7,y-7)));pool.push(...Array(w).fill(c));}
    return pick(pool.length?pool:cands);
  }
  if(level===2)return getGomokuHint(board,mark); // ふつう: 貪欲ヒューリスティック
  // つよい: 攻撃 + 守備(相手の好点を潰す) + 1手先読み
  let best=[],bestScore=-Infinity;
  for(const c of cands){
    let s=gomokuPlaceScore(board,c,mark)+gomokuPlaceScore(board,c,opp)*0.85; // 自分の手 + 相手の好点を奪う価値
    board[c]=mark;                       // 仮置きして相手の最善応手を見る(1手先読み)
    let oppBest=0;
    for(const d of gomokuCandidates(board)){const os=gomokuPlaceScore(board,d,opp);if(os>oppBest)oppBest=os;}
    board[c]=null;                        // 必ず元へ戻す(副作用なし)
    s-=oppBest*0.9;                        // 相手に強い返しを許す手は減点
    if(s>bestScore){bestScore=s;best=[c];}else if(s===bestScore)best.push(c);
  }
  return pick(best);
}
/* getGomokuCpuMove 自動テスト: 各レベルの即詰み反応 + つよいの双方向脅威の創出/阻止 + よわいの候補範囲。 */
function runGomokuCpuTests(){
  const N=GO_N, idx=(x,y)=>y*N+x, blank=()=>Array(N*N).fill(null);
  let pass=0,fail=0;const log=[];
  const ck=(name,cond)=>{cond?pass++:fail++;if(!cond)log.push(name);};
  const inSet=(h,...s)=>s.includes(h);
  // 全レベル: 自分の4連→完成点を取る / 相手の4連→止める
  for(const lv of [1,2,3]){
    {const b=blank();[2,3,4,5].forEach(x=>b[idx(x,7)]='black');const h=getGomokuCpuMove(b,'black',lv);
     ck('win-l'+lv,inSet(h,idx(1,7),idx(6,7)));}
    {const b=blank();[2,3,4,5].forEach(x=>b[idx(x,7)]='white');const h=getGomokuCpuMove(b,'black',lv);
     ck('block-l'+lv,inSet(h,idx(1,7),idx(6,7)));}
  }
  // つよい: 1手で二つの活三(双方向脅威)を作れる点(7,7)を選ぶ
  {const b=blank();[[5,7],[6,7],[7,5],[7,6]].forEach(([x,y])=>b[idx(x,y)]='black');
   const h=getGomokuCpuMove(b,'black',3);ck('double-make',h===idx(7,7));}
  // つよい: 相手が双方向脅威を作る点(7,7)を阻止する(黒は孤立石のみ)
  {const b=blank();[[5,7],[6,7],[7,5],[7,6]].forEach(([x,y])=>b[idx(x,y)]='white');b[idx(0,0)]='black';
   const h=getGomokuCpuMove(b,'black',3);ck('double-block',h===idx(7,7));}
  // よわい: 即詰みなし→候補(既存石近傍)の範囲内を返す
  {const b=blank();b[idx(7,7)]='black';const cand=gomokuCandidates(b);
   let ok=true;for(let i=0;i<30;i++){const h=getGomokuCpuMove(b,'black',1);if(!cand.includes(h)){ok=false;break;}}
   ck('weak-range',ok);}
  // 副作用なし: 呼び出し後に board が不変であること(つよいは仮置きする)
  {const b=blank();[[5,7],[6,7]].forEach(([x,y])=>b[idx(x,y)]='black');const snap=b.slice();
   getGomokuCpuMove(b,'black',3);ck('no-side-effect',b.every((v,i)=>v===snap[i]));}
  console.log('[getGomokuCpuMove tests] pass='+pass+' / fail='+fail, log.length?log:'');
  return {pass,fail,log};
}

      g.restore();
    }
    function hintApplicable(){ // いま手番側にヒントを出してよいか (人間の手番のみ・cvc不可)
      return screen==='play'&&!result&&cfg.mode!=='cvc'&&players[turn].type==='human';
    }
    // 共通のボタン描画
    function drawBtn(g,b,label,col,disabled,size){
      g.save();g.fillStyle=disabled?'#6b6480':col;rr(g,b.x,b.y,b.w,b.h,14);g.fill();
      if(!disabled){g.fillStyle='rgba(255,255,255,.22)';rr(g,b.x+8,b.y+5,b.w-16,9,5);g.fill();}
      g.restore();
      outlinedText(g,label,b.x+b.w/2,b.y+b.h/2+1,size||18,'#fff','rgba(0,0,0,.4)',5,disabled?0.55:1);
    }
    // ── セットアップ画面: クリック領域を一元生成 (draw と onDown で共用) ──
    function buildSetup(){
      const b=[];const add=(x,y,w,h,label,kind,val,active)=>b.push({x,y,w,h,label,kind,val,active:!!active});
      add(50,162,320,50,'👥 ふたりで たいせん','mode','pvp',cfg.mode==='pvp');
      add(50,219,320,50,'🤖 CPUと たいせん','mode','pvc',cfg.mode==='pvc');
      add(50,276,320,50,'🤖🤖 CPUどうし','mode','cvc',cfg.mode==='cvc');
      let y=350;
      if(cfg.mode==='pvc'){
        add(50,y+18,150,44,'あなた せんて','first',1,cfg.humanFirst);
        add(220,y+18,150,44,'あなた こうて','first',0,!cfg.humanFirst);y+=78;
        for(let i=0;i<3;i++)add(50+i*108,y+18,100,44,LV[i],'levelL',i+1,cfg.levelL===i+1);y+=78;
      }else if(cfg.mode==='cvc'){
        for(let i=0;i<3;i++)add(50+i*108,y+18,100,44,LV[i],'levelL',i+1,cfg.levelL===i+1);y+=78;
        for(let i=0;i<3;i++)add(50+i*108,y+18,100,44,LV[i],'levelR',i+1,cfg.levelR===i+1);y+=78;
      }
      add(110,y+18,200,44,'ヒント つねに: '+(hintOn?'ON':'OFF'),'hint',0,hintOn);y+=78;
      add(80,y+22,260,56,'▶ はじめる','start',0,false);
      return b;
    }
    function onSetupTap(x,y){
      for(const it of buildSetup())if(hitBtn(it,x,y)){
        A.pop();
        if(it.kind==='mode')cfg.mode=it.val;
        else if(it.kind==='first')cfg.humanFirst=!!it.val;
        else if(it.kind==='levelL')cfg.levelL=it.val;
        else if(it.kind==='levelR')cfg.levelR=it.val;
        else if(it.kind==='hint'){hintOn=!hintOn;store.set('pgp2_gomoku_hint',hintOn?'1':'0');}
        else if(it.kind==='start')startGame();
        return;
      }
    }
    function drawSetup(g){
      g.fillStyle='#2b2550';g.fillRect(0,0,W,H);
      outlinedText(g,'ごもくならべ',W/2,86,28,'#fff','#3a2a4a',7);
      outlinedText(g,'あいてを えらぶ',W/2,132,19,'#cfc6e8','#2b2550',5);
      if(cfg.mode==='pvc'){
        outlinedText(g,'てばん',W/2,346,15,'#cfc6e8','#2b2550',4);
        outlinedText(g,'CPUの つよさ',W/2,424,15,'#cfc6e8','#2b2550',4);
      }else if(cfg.mode==='cvc'){
        outlinedText(g,'● くろCPU の つよさ',W/2,346,15,'#cfc6e8','#2b2550',4);
        outlinedText(g,'○ しろCPU の つよさ',W/2,424,15,'#cfc6e8','#2b2550',4);
      }
      for(const it of buildSetup())
        drawBtn(g,it,it.label,it.kind==='start'?'#39c06a':(it.active?'#ff7a00':'#4a4170'),false,it.kind==='start'?22:16);
    }

    return {
      onDown(x,y){
        if(screen==='setup'){onSetupTap(x,y);return}
        // 2段目ボタンは決着前後どちらでも有効
        if(hitBtn(togBtn,x,y)){
          if(cfg.mode==='cvc'){A.bad();return}
          hintOn=!hintOn;store.set('pgp2_gomoku_hint',hintOn?'1':'0');if(!hintOn){hint=-1;hintT=0;}A.pop();return;
        }
        if(hitBtn(setBtn,x,y)){toSetup();return}
        if(!result){
          if(hitBtn(btnL,x,y)){undo();return}      // まった
          if(hitBtn(btnR,x,y)){showHint();return}  // 💡 ヒント
          if(players[turn].type==='human')place(cellAt(x,y)); // 人間の手番だけ着手可
        }else{
          if(hitBtn(btnL,x,y)){reset();return}     // もう いちど
          if(hitBtn(btnR,x,y)){undo();return}      // 勝ち手を待った (誤タップ救済)
          reset();                                  // それ以外のタップでもリセット (従来挙動)
        }
      },
      update(dt){
        t+=dt;parts.update(dt);
        if(screen!=='play')return;
        if(hintOn)hint=hintApplicable()?getGomokuHint(board,players[turn].mark):-1; // 常時ヒント
        else if(hintT>0){hintT-=dt;if(hintT<=0){hintT=0;hint=-1;}}                  // オンデマンドの減衰
        if(!result&&players[turn].type==='cpu'&&cpuTimer>0){ // CPU思考ディレイ→着手
          cpuTimer-=dt;
          if(cpuTimer<=0){const mv=getGomokuCpuMove(board,players[turn].mark,players[turn].level||2);if(mv>=0)place(mv);}
        }
      },
      draw(g){
        if(screen==='setup'){drawSetup(g);return}
        g.fillStyle='#2b2550';g.fillRect(0,0,W,H);
        outlinedText(g,'ごもくならべ',W/2,84,24,'#fff','#3a2a4a',7);
        // 手番 / 結果
        if(!result){
          const m=players[turn].mark;
          outlinedText(g,(m==='black'?'●':'○')+'の ばん',W/2,140,27,m==='black'?'#1c1630':'#fff','#cdb892',7);
          if(players[turn].type==='cpu')outlinedText(g,'🤖 かんがえちゅう…',W/2,172,15,'#ffd23f','#5a3a10',4);
        }else if(result.draw){
          outlinedText(g,'ひきわけ！',W/2,150,30,'#ffd23f','#5a3a10',7);
        }else{
          outlinedText(g,(result.winner==='black'?'●':'○')+'の かち！',W/2,150,32,'#ffd23f','#5a3a10',8);
        }
        // 盤パネル (碁盤色)
        const pad=18;
        g.save();g.fillStyle='#e6cf9c';rr(g,BX-pad,BY-pad,SPAN+pad*2,SPAN+pad*2,16);g.fill();g.restore();
        // 碁盤目グリッド
        g.save();g.strokeStyle='#7a5a2a';g.lineWidth=1.4;
        for(let i=0;i<N;i++){
          g.beginPath();g.moveTo(BX+i*CELL,BY);g.lineTo(BX+i*CELL,BY+SPAN);g.stroke();
          g.beginPath();g.moveTo(BX,BY+i*CELL);g.lineTo(BX+SPAN,BY+i*CELL);g.stroke();
        }
        // 星 (天元 + 隅の点)
        g.fillStyle='#7a5a2a';
        for(const [sx,sy] of [[3,3],[11,3],[3,11],[11,11],[7,7]]){
          g.beginPath();g.arc(BX+sx*CELL,BY+sy*CELL,3,0,TAU);g.fill();
        }
        g.restore();
        // 石
        const sr=CELL*0.46;
        for(let i=0;i<board.length;i++)if(board[i])drawStone(g,board[i],center(i),sr);
        // 直前手マーカー (Should): 小さな赤点
        if(last>=0&&!winLine){
          const c=center(last);
          g.save();g.fillStyle='#ff4d94';g.beginPath();g.arc(c.x,c.y,3.2,0,TAU);g.fill();g.restore();
        }
        // 勝ち筋ハイライト (連の端から端)
        if(winLine&&winLine.length){
          const a=center(winLine[0]),b=center(winLine[winLine.length-1]);
          g.save();g.globalAlpha=0.45+0.3*Math.sin(t*6);
          g.strokeStyle='#ff4d94';g.lineWidth=10;g.lineCap='round';
          g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore();
        }
        // ヒントリング (常時ON=継続 / オンデマンド=hintT減衰)。石と別色のシアン
        if(hint>=0&&(hintOn||hintT>0)){
          const c=center(hint);
          g.save();g.globalAlpha=0.5+0.5*Math.sin(t*9);
          g.strokeStyle='#21e6c1';g.lineWidth=4;g.beginPath();g.arc(c.x,c.y,CELL*0.55,0,TAU);g.stroke();
          g.restore();
        }
        parts.draw(g);
        // 1段目ボタン (プレイ時=[まった][ヒント] / 決着時=[もういちど][まった])
        const hintDisabled=hintOn||cfg.mode==='cvc'||players[turn].type==='cpu'; // 常時ON/CPU手番では💡無効
        if(result){
          drawBtn(g,btnL,'▶ もう いちど','#ff4d94',false);
          drawBtn(g,btnR,'↩ まった','#7a6cc0',!undoable());
        }else{
          drawBtn(g,btnL,'↩ まった','#7a6cc0',!undoable());
          drawBtn(g,btnR,'💡 ヒント','#3a9bdc',hintDisabled);
        }
        // 2段目ボタン (ヒント常時トグル / せってい)
        drawBtn(g,togBtn,'ヒント つねに '+(hintOn?'ON':'OFF'),hintOn?'#39c06a':'#5a5278',cfg.mode==='cvc',15);
        drawBtn(g,setBtn,'⚙ せってい','#5a5278',false,15);
      },
      hudInfo(){
        if(screen==='setup')return 'モードを えらぶ';
        if(result)return result.draw?'ひきわけ':STONE[result.winner]+'の かち';
        return STONE[players[turn].mark]+'の ばん'+(players[turn].type==='cpu'?' (CPU)':'');
      },
    };
  }
});

// ▼ 新しいミニゲームは registerGame({...}) をここに追加 ▼

/* ============================================================
   起動
   ============================================================ */
boot();
</script>
