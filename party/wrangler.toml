# 五目並べ オンライン対戦 — Cloudflare Workers + Durable Objects (partyserver)
# 自分の Cloudflare アカウントへ無料デプロイ:  cd party && npx wrangler deploy
# ローカル開発:                                 cd party && npx wrangler dev
name = "petit-gomoku"
main = "index.js"
compatibility_date = "2025-06-01"

# Durable Object: 部屋=1インスタンス。
# バインディング名 "Main" は partyserver で kebab 化され party "main" に対応
# → クライアントの接続パス /parties/main/<code> をそのまま維持できる。
[[durable_objects.bindings]]
name = "Main"
class_name = "Gomoku"

# #11 オセロ: バインディング名 "Othello" は partyserver で kebab 化され party "othello" に対応
# → クライアントの接続パス /parties/othello/<code> に対応する。五目(main)とは別DO=別部屋空間。
[[durable_objects.bindings]]
name = "Othello"
class_name = "Othello"

# SQLite-backed Durable Object (無料枠で利用可)。WebSocket Hibernation と DO Alarm(席解放) が動く。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gomoku"]

# #11 オセロ DO を追加 (既存 v1 は不変更。tag 追記のみ)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Othello"]

# 大富豪: バインディング名 "Daifugo" → party "daifugo" (/parties/daifugo/<code>)
[[durable_objects.bindings]]
name = "Daifugo"
class_name = "Daifugo"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Daifugo"]

# まるばつ(三目並べ): バインディング名 "Ox" → party "ox" (/parties/ox/<code>)
[[durable_objects.bindings]]
name = "Ox"
class_name = "Ox"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Ox"]

# コネクトフォー(重力付き四目): バインディング名 "Connect4" は partyserver で kebab 化され party "connect4" に対応
# → クライアントの接続パス /parties/connect4/<code> に対応する (client 側 party='connect4' と一致)。
[[durable_objects.bindings]]
name = "Connect4"
class_name = "Connect4"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Connect4"]

# ドット&ボックス: バインディング名 "Dots" は partyserver で kebab 化され party "dots" に対応
# → クライアントの接続パス /parties/dots/<code> に対応する。
[[durable_objects.bindings]]
name = "Dots"
class_name = "Dots"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Dots"]

# はさみ将棋: バインディング名 "Hasami" は partyserver で kebab 化され party "hasami" に対応
# → クライアントの接続パス /parties/hasami/<code> に対応する。
[[durable_objects.bindings]]
name = "Hasami"
class_name = "Hasami"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Hasami"]
